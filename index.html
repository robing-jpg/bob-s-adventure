      <g><rect x="262" y="70" width="14" height="290" fill="#6E7881"/><rect x="140" y="300" width="126" height="50" rx="4" fill="#E6B32E" stroke="#6B5410"/>
        <rect x="152" y="258" width="50" height="44" rx="3" fill="#E6B32E" stroke="#6B5410"/><rect x="158" y="264" width="38" height="24" fill="url(#gGlass)"/>${wheel(166, 354, 15)}${wheel(238, 354, 15)}</g>
      ${rig(c, { box: false, attrs: 'data-tx="start:-1100,0;release:0,0~2200;depart:1150,0~2600"' })}
      <g data-tx="start:0,-70;release:0,0@2200~1100;depart:1150,0~2600"><g transform="translate(320 ${y})">${boxSVG(c, { plate: true })}</g></g>
      <g data-tx="start:0,-70;release:0,0@2200~1100;gateout:0,-100~800"><rect x="270" y="${y - 14}" width="64" height="12" fill="#6E7881"/><rect x="326" y="${y - 8}" width="${w + 8}" height="7" fill="#4B555E"/></g>
      ${c.family !== 'dry' ? tag(320 + w / 2, y - 30, c.family === 'reefer' ? 'PTI ✓ · set point ' + plain('{setPoint}') : c.family === 'tank' ? 'CLEANED ✓ · LAST CARGO CHECKED' : 'SPECIAL EQUIPMENT · OOG APPROVAL', 'data-at="release" data-until="gateout" data-delay="2600"', '#0B4F6C') : ''}
      ${inset(470, 14, 232, 128, 'EIR — GATE OUT', [`Container ${CONTAINER_NO}`, `Size/type ${c.iso} · empty`, 'Structure: sound ✓', 'Interior: clean, dry ✓', 'Signed: driver · depot'], 'data-at="gateout" data-until="gateout"')}
      ${tag(782, 94, '⏱ DETENTION STARTS', 'data-at="gateout" data-until="gateout"')}
    </svg>`;
  };

  /* --- Step 2: stuffing, sealing, VGM (and step 11 reuses parts) --- */
  // v0.5 FIX (truck & cartons): cartons are now their OWN objects, never nested in the truck group.
  // cartonSlots() gives every carton's place inside the box (box drawn at x=320, top y) and its place in the
  // warehouse stock (4 columns × 3 tiers behind the open dock). Cartons move between the two ONLY while the
  // truck is parked (stuff / unstuff beats) and are hidden before the truck moves again, so nothing trails behind it.
  function cartonSlots(w, h, y) {
    const cols = Math.floor((w - 32) / 74), rowsY = [h - 74, h - 140], out = [];
    for (let tier = 0; tier < 2; tier++) for (let col = 0; col < cols; col++) out.push({ bx: 320 + 16 + col * 74, by: y + rowsY[tier], order: (cols - 1 - col) * 2 + tier });
    out.sort((a, b) => a.order - b.order);
    out.forEach((c, k) => { c.sx = 24 + (k % 4) * 70; c.sy = GY - 64 * (Math.floor(k / 4) + 1); });
    return out;
  }
  const carton = (x, y) => `<rect x="${x}" y="${y}" width="68" height="58" rx="3" fill="url(#gCarton)" stroke="#7A5A2E"/><line x1="${x}" y1="${y + 20}" x2="${x + 68}" y2="${y + 20}" stroke="#7A5A2E" opacity=".5"/><line x1="${x + 34}" y1="${y}" x2="${x + 34}" y2="${y + 58}" stroke="#7A5A2E" opacity=".5"/><rect x="${x}" y="${y + 58}" width="68" height="6" fill="#8B6A3E"/>`;
  // Inside view of the warehouse (open front) so the stock reads as "in the warehouse", not floating in front of it.
  const dockInterior = () => `<rect x="24" y="168" width="282" height="200" rx="4" fill="#3A4652"/><rect x="24" y="168" width="282" height="8" fill="#2B3540"/><rect x="24" y="360" width="282" height="8" fill="#55616D"/>`;
  SCENES.warehouse = s => {
    const c = container(), { w, h } = boxDims(c), f = c.family, t = c.id, y = GY - (h + 33);
    const open = f === 'dry' || f === 'reefer' || t === '40OT';
    const cartons = open && t !== '40OT', slots = cartons ? cartonSlots(w, h, y) : [];
    // static cartons inside the box (in the truck group): shown once the doors are closed, so they ride along hidden
    const inside = cartons ? `<g data-at="seal">${slots.map(c => carton(c.bx - 320, c.by - y)).join('')}</g>` : '';
    // loose cartons (NOT in the truck group): warehouse stock → into the box during "stuff", then hidden
    const loose = cartons ? `<g data-until="stuff">${slots.map((c, k) => `<g data-tx="start:${c.sx - c.bx},${c.sy - c.by};stuff:0,0@${k * 160}~900">${carton(c.bx, c.by)}</g>`).join('')}</g>` : '';
    let loader = '';
    if (t === '40OT' || t === '40FR') loader = `<g><rect x="${330 + w / 2 - 6}" y="20" width="12" height="40" fill="#E8C33A"/><line x1="${330 + w / 2}" y1="0" x2="${330 + w / 2}" y2="40" stroke="#3F4750" stroke-width="3"/>
        <g data-tx="start:0,-230;stuff:0,0~1800" data-at="stuff"><line x1="${330 + w / 2}" y1="${y - 200}" x2="${330 + w / 2}" y2="${y + 10}" stroke="#3F4750" stroke-width="3" data-until="stuff"/>${t === '40OT' ? `<g transform="translate(320 ${y})" data-until="stuff">${machine(70, 4, w - 140, h - 20)}</g>` : ''}</g>
        <text x="${330 + w / 2}" y="16" text-anchor="middle" font-size="11" font-weight="800" fill="#1B2631">MOBILE CRANE HOOK</text></g>`;
    if (f === 'tank') loader = `<g><rect x="40" y="170" width="120" height="190" rx="10" fill="url(#gTank)" stroke="#6E7B86"/><text x="100" y="200" text-anchor="middle" font-size="11" font-weight="800" fill="#1B2631">STORAGE TANK</text>
        <path d="M160 300 C 240 300, 260 ${y - 40}, ${320 + w / 2} ${y + 6}" stroke="#1B2631" stroke-width="7" fill="none" data-at="stuff" data-until="stuff"/>
        <g data-at="stuff" data-until="stuff"><rect x="${320 + w / 2 + 30}" y="${y - 50}" width="96" height="26" rx="13" fill="#0B4F6C"/><text x="${320 + w / 2 + 78}" y="${y - 33}" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">FILLING…</text></g></g>`;
    return `${svgOpen(s)}${ground()}${skyline([[330, 250, 46], [380, 214, 38], [424, 236, 52], [884, 226, 40], [930, 250, 60]])}
      <g opacity=".7"><rect x="610" y="96" width="10" height="272" fill="#7F97A9"/><rect x="680" y="96" width="10" height="272" fill="#7F97A9"/><rect x="470" y="88" width="300" height="12" fill="#7F97A9"/><circle class="blink" cx="655" cy="80" r="4" fill="#FF5A4A"/>
        <g class="hook"><line x1="520" y1="100" x2="520" y2="150" stroke="#5E7486" stroke-width="2"/><rect x="508" y="150" width="24" height="7" fill="#5E7486"/></g></g>
      ${f === 'tank' ? '' : warehouseSVG(20, plain(C.ui.shipperWarehouse))}${f === 'tank' ? '' : dockInterior()}
      <rect class="wb" x="330" y="${GY - 4}" width="610" height="8" rx="2" fill="#7E8A95"/><rect x="330" y="${GY - 4}" width="610" height="8" rx="2" fill="#F2C14E" data-at="vgm" data-until="vgm"/>
      ${rig(c, { attrs: 'data-tx="start:780,0;arrive:0,0~2200;depart:1160,0~2600"', boxOpts: open && t !== '40OT' ? { inside, wallAttr: 'data-until="arrive"', wall2Attr: 'data-at="seal"', plate: true } : { plate: true, cargo: t === '40FR' ? true : undefined, cargoAttr: t === '40FR' ? 'data-at="stuff" data-delay="1600"' : '', tarpAttr: 'data-at="seal"' } })}
      ${loose}${loader}
      <g data-at="stuff" data-until="stuff" data-delay="1800">${tag(555, 140, plain(C.ui.loadCentre))}</g>
      <g data-at="seal" data-until="seal"><line x1="262" y1="152" x2="314" y2="${y + 60}" stroke="#1B2631" stroke-width="1.5" stroke-dasharray="4 3"/><circle cx="230" cy="96" r="64" fill="#fff" stroke="#1B2631" stroke-width="2"/>
        ${t === '40FR' ? `<text x="230" y="92" text-anchor="middle" font-size="12" font-weight="800" fill="#1B2631">NO DOORS</text><text x="230" y="110" text-anchor="middle" font-size="11" fill="#1B2631">lashing checked</text>`
          : `<rect x="192" y="80" width="76" height="16" rx="3" fill="#F2C94C" stroke="#6B5410"/><rect x="204" y="62" width="10" height="52" rx="2" fill="#9AA5AF" stroke="#555"/><text x="230" y="134" text-anchor="middle" font-size="12" font-weight="800" fill="#1B2631">${esc(SEAL_NO)}</text><text x="230" y="52" text-anchor="middle" font-size="11" fill="#55616D">${f === 'tank' ? 'VALVE SEAL' : 'BOLT SEAL'}</text>`}</g>
      <g data-at="seal" data-tx="start:780,0;arrive:0,0~2200;depart:1160,0~2600">${t === '40FR' ? '' : `<rect x="313" y="${y + 50}" width="9" height="22" rx="2" fill="#F2C94C" stroke="#6B5410"/>`}
        ${f === 'tank' ? `<g transform="translate(${320 + w - 40} ${y + h / 2}) rotate(45)"><rect x="-14" y="-14" width="28" height="28" fill="#E2432F" stroke="#fff" stroke-width="2"/></g>` : ''}</g>
      <g data-at="vgm" data-until="vgm"><rect x="720" y="40" width="210" height="80" rx="12" fill="#1B2631"/><text x="825" y="62" text-anchor="middle" font-size="12" fill="#BFD0DC" letter-spacing="1">WEIGHBRIDGE</text>
        <text id="wbNum" x="825" y="102" text-anchor="middle" font-size="26" font-family="ui-monospace,Consolas,monospace" fill="#7CF0A8">0 kg</text></g>
      <g data-at="vgm" data-delay="1500" data-until="vgm">${tag(525, 124, 'VGM ' + plain('{vgm}') + ' kg ✓', '', '#1D7048')}</g>
    </svg>`;
  };

  /* --- Steps 3 & 10: inland transport landscapes --- */
  /* v1.0 (retour 4) — inland legs drawn terminal to terminal (steps 3 and 10).
     Truck: door → port terminal (step 3) or port terminal → door (step 10) in one go.
     Rail / barge: the train or the barge runs the WHOLE way between two terminals. A gantry crane moves the box between the
     truck and the wagon / barge; a truck does the first mile (step 3) or the last mile (step 10 — the usual case: few
     consignees have their own rail siding [TO VERIFY:v99]). The box is ONE object whose moves are nested (chain), so it rides
     the truck, is lifted, then rides the train or the barge without ever jumping between copies.
     Depth (back → front): buildings (base y 214) · rail (y 250) · road (y 294) · river / sea (y > 318). */
  function inland(s, o) {
    const c = container(), r = route(), key = o.key, pre = key === 'mode', T = o.travel;
    const bw = c.len === 20 ? 32 : 62, bh = 21, BOXY = { road: 261, rail: 211, water: 315 };
    const box = (x, y) => `<g>${miniBox(c, x, y, bw, bh)}</g>`;
    const generic = (x, y, i) => `<rect x="${x}" y="${y}" width="62" height="${bh}" fill="${PALETTE[i % PALETTE.length]}" stroke="#55616D"/><rect x="${x}" y="${y}" width="62" height="${bh}" fill="url(#corr)"/>`;
    const truck = (tx, attrs) => `<g ${attrs || ''}><g transform="translate(${tx} 0)" class="rig"><rect x="30" y="282" width="74" height="4" fill="#3F4750"/><rect x="28" y="281" width="3" height="5" fill="#C0392B"/>
        <path d="M102 287 V268 q0 -4 4 -4 h11 q4 0 5 4 l3 11 v8 z" fill="url(#gCab)" stroke="#06293A" stroke-width="1"/><path d="M113 267 h5 q2 0 3 3 l2 8 h-10 z" fill="url(#gGlass)"/><rect x="103" y="258" width="2" height="8" fill="#55616D"/>
        ${wheel(40, 288, 5)}${wheel(52, 288, 5)}${wheel(108, 288, 5)}${wheel(120, 288, 5)}</g></g>`;
    const wagon = (x, load) => `<rect x="${x}" y="232" width="66" height="4" fill="#3F4750"/><rect x="${x + 4}" y="236" width="58" height="3" fill="#2B3238"/>${load || ''}${wheel(x + 9, 245, 4)}${wheel(x + 19, 245, 4)}${wheel(x + 47, 245, 4)}${wheel(x + 57, 245, 4)}`;
    const loco = x => `<path d="M${x} 236 V214 h34 l10 8 v14 z" fill="var(--c-primary)" stroke="#06293A"/><rect x="${x + 30}" y="217" width="8" height="7" fill="url(#gGlass)"/><rect x="${x + 4}" y="219" width="22" height="3" fill="#fff" opacity=".35"/>${wheel(x + 9, 245, 4)}${wheel(x + 21, 245, 4)}${wheel(x + 33, 245, 4)}`;
    const barge = (x, ours) => `<polygon points="${x},336 ${x + 230},336 ${x + 218},356 ${x + 12},356" fill="#3C4A55"/><rect x="${x}" y="333" width="230" height="4" fill="#55616D"/>
        <rect x="${x + 202}" y="306" width="22" height="27" fill="#E4EEF4" stroke="#55616D"/><rect x="${x + 206}" y="311" width="14" height="6" fill="url(#gGlass)"/>
        ${generic(x + 8, BOXY.water, 3)}${ours ? '' : generic(x + 74, BOXY.water, 1)}${generic(x + 140, BOXY.water, 5)}`;
    const gantry = (x1, x2, foot, label, ch) => `<g ${ch ? `data-ch="${ch}"` : ''}><rect x="${x1}" y="124" width="8" height="${foot - 124}" fill="#E8C33A" stroke="#6B5410"/><rect x="${x2}" y="124" width="8" height="${foot - 124}" fill="#E8C33A" stroke="#6B5410"/>
        <rect x="${x1 - 10}" y="116" width="${x2 - x1 + 28}" height="12" fill="#E8C33A" stroke="#6B5410"/><rect x="${x1 - 4}" y="${foot - 8}" width="20" height="8" fill="#2B3238"/><rect x="${x2 - 4}" y="${foot - 8}" width="20" height="8" fill="#2B3238"/>
        <text x="${(x1 + x2) / 2 + 4}" y="110" text-anchor="middle" font-size="11" font-weight="800" fill="#1B2631">${esc(label)}</text></g>`;
    // the box and the crane's spreader follow the same nested moves; the spreader goes back up once the box is set down
    const moves = (list, inner) => chain(list.map(m => 'start:0,0;' + m), inner);
    const spreader = (x, y) => `<rect x="${x - 2}" y="${y - 6}" width="${bw + 4}" height="5" fill="#2B3238"/><line x1="${x + bw / 2 - 6}" y1="${y - 6}" x2="${x + bw / 2 - 6}" y2="${y - 400}" stroke="#2B3238" stroke-width="1.5"/><line x1="${x + bw / 2 + 6}" y1="${y - 6}" x2="${x + bw / 2 + 6}" y2="${y - 400}" stroke="#2B3238" stroke-width="1.5"/>`;

    // ---------- terrain ----------
    const bridge = !!o.bridge, landR = bridge ? 300 : 1660;
    let terr = `<rect x="-700" y="206" width="2360" height="270" fill="url(#gSea)"/>
      <g class="waves" opacity=".5">${Array.from({ length: 14 }, (_, i) => `<rect x="${-200 + (i * 173) % 1500}" y="${330 + (i * 37) % 120}" width="${60 + (i * 29) % 90}" height="1.6" rx=".8" fill="#fff"/>`).join('')}</g>
      <polygon points="-700,200 ${landR},200 ${landR + (bridge ? 26 : 0)},318 -700,318" fill="url(#gGrass)"/><rect x="-700" y="316" width="${landR + 700 + (bridge ? 26 : 0)}" height="5" fill="#8C8A6E"/>
      <rect x="-700" y="286" width="${bridge ? 1000 : 2360}" height="9" fill="#5B6670"/><rect x="-700" y="289.5" width="${bridge ? 1000 : 2360}" height="1" fill="#E8E8E0" opacity=".6"/>
      <g>${Array.from({ length: bridge ? 56 : 132 }, (_, i) => `<rect x="${-700 + i * 18}" y="249" width="3" height="4" fill="#6E5A44"/>`).join('')}</g>
      <rect x="-700" y="249" width="${bridge ? 1000 : 2360}" height="1.6" fill="#4B555E"/><rect x="-700" y="252" width="${bridge ? 1000 : 2360}" height="1.6" fill="#4B555E"/>`;
    if (bridge) terr += `<rect x="300" y="286" width="500" height="8" fill="#5B6670"/>${Array.from({ length: 8 }, (_, i) => `<rect x="${318 + i * 64}" y="294" width="6" height="${60 + i * 2}" fill="#7D8891"/>`).join('')}`;

    // ---------- ends of the scene ----------
    const warehouse = (x, label) => `<g><polygon points="${x - 6},150 ${x + 60},112 ${x + 126},150" fill="url(#gRoof)"/><rect x="${x}" y="150" width="120" height="64" fill="url(#gWall)" stroke="#97A4AF"/>
        <rect x="${x + 70}" y="176" width="34" height="38" fill="#55616D"/><text x="${x + 60}" y="168" text-anchor="middle" font-size="11" font-weight="800" fill="#1B2631">${esc(label)}</text></g>`;
    const portLeft = label => `<g><rect x="-700" y="198" width="940" height="120" fill="#C6CFD7"/><rect x="-700" y="198" width="940" height="3" fill="#fff" opacity=".4"/>
        ${[0, 1, 2, 3].map(k => `${generic(-40 + k * 66, 156, k)}${generic(-40 + k * 66, 177, k + 2)}`).join('')}
        <text x="70" y="146" text-anchor="middle" font-size="11" font-weight="800" fill="#1B2631">${esc(label)}</text></g>`;
    const portRight = label => `<g><polygon points="${bridge ? 780 : 796},250 1660,250 1660,470 ${bridge ? 800 : 816},470" fill="#C6CFD7"/><rect x="${bridge ? 780 : 796}" y="250" width="864" height="5" fill="#55616D"/>
        ${[0, 1, 2, 3, 4, 5].map(i => generic(830 + (i % 3) * 66, 228 - Math.floor(i / 3) * 21, i)).join('')}
        ${[880, 1010].map(x => `<rect x="${x}" y="120" width="6" height="130" fill="#3F4750"/><rect x="${x + 30}" y="120" width="6" height="130" fill="#3F4750"/><rect x="${x - 60}" y="114" width="150" height="8" fill="#3F4750"/>`).join('')}
        <text x="900" y="276" text-anchor="middle" font-size="11" font-weight="800" fill="#1B2631">${esc(label)}</text></g>`;

    let ends, vehicles;
    if (pre) {
      // STEP 3 — shipper (left) → export terminal (right). Barge / rail: first mile by truck to a river / rail terminal (x 170–320).
      const dxT = 180, dxB = 400, dxR = 520;
      ends = warehouse(6, o.leftLabel) + portRight(o.rightLabel)
        + gantry(170, 320, 318, plain(C.ui.riverTerminal || 'RIVER TERMINAL'), `${key}:barge`)
        + gantry(170, 320, 300, plain(C.ui.railTerminal || 'RAIL TERMINAL'), `${key}:rail`);
      vehicles = `
        <g data-ch="${key}:truck">${truck(0, `data-tx="start:0,0;${T}:640,0~3000"`)}<g data-tx="start:0,0;${T}:640,0~3000">${box(34, BOXY.road)}</g></g>
        <g data-ch="${key}:barge">
          <g data-tx="start:0,0;${T}:${dxB},0@2600~2400"><g class="bob">${barge(140, true)}</g></g>
          ${truck(0, `data-tx="start:0,0;${T}:${dxT},0~1100"`)}
          ${moves([`${T}:${dxT},0~1100`, `${T}:0,-50@1150~500`, `${T}:0,104@1700~800`, `${T}:${dxB},0@2600~2400`], box(34, BOXY.road))}
          ${moves([`${T}:${dxT},0~1100`, `${T}:0,-50@1150~500`, `${T}:0,104@1700~800`, `${T}:0,-170@2550~600`], `<g data-at="${T}" clip-path="url(#inlClip)">${spreader(34, BOXY.road)}</g>`)}</g>
        <g data-ch="${key}:rail">
          <g data-tx="start:0,0;${T}:${dxR},0@2400~2600">${wagon(190, '')}${loco(258)}</g>
          ${truck(0, `data-tx="start:0,0;${T}:${dxT},0~1100"`)}
          ${moves([`${T}:${dxT},0~1100`, `${T}:0,-60@1150~500`, `${T}:-22,10@1700~600`, `${T}:${dxR},0@2400~2600`], box(34, BOXY.road))}</g>
        ${tag(250, 380, plain(C.ui.firstMile || 'FIRST MILE BY TRUCK'), `data-ch="${key}:barge|rail" data-at="${T}" data-until="${T}"`, '#0B4F6C')}`;
    } else {
      // STEP 10 — import terminal (left) → consignee (right). Rail / barge run to an inland terminal (x 520–690), then the last mile by truck.
      const dxR = 540, dxB = 540, dxL = 180;
      ends = portLeft(o.leftLabel) + warehouse(840, o.rightLabel)
        + gantry(520, 690, 300, plain(C.ui.inlandRail || 'INLAND RAIL TERMINAL'), `${key}:rail`)
        + gantry(520, 690, 318, plain(C.ui.inlandRiver || 'INLAND RIVER TERMINAL'), `${key}:barge`);
      const lastTruck = truck(522, `data-tx="start:0,0;deliver:${dxL},0@1500~1300"`);
      vehicles = `
        <g data-ch="${key}:truck">${truck(20, `data-tx="start:0,0;${T}:690,0~3000"`)}<g data-tx="start:0,0;${T}:690,0~3000">${box(54, BOXY.road)}</g></g>
        <g data-ch="${key}:rail">
          <g data-tx="start:0,0;${T}:${dxR},0~3000">${wagon(-60, generic(-58, BOXY.rail, 2))}${wagon(10, '')}${loco(80)}</g>
          ${lastTruck}
          ${moves([`${T}:${dxR},0~3000`, 'deliver:0,-40~600', 'deliver:4,90@650~800', `deliver:${dxL},0@1500~1300`], box(12, BOXY.rail))}
          ${moves([`${T}:${dxR},0~3000`, 'deliver:0,-40~600', 'deliver:4,90@650~800', 'deliver:0,-118@1500~600'], `<g data-at="deliver" clip-path="url(#inlClip)">${spreader(12, BOXY.rail)}</g>`)}</g>
        <g data-ch="${key}:barge">
          <g data-tx="start:0,0;${T}:${dxB},0~3000"><g class="bob">${barge(-60, true)}</g></g>
          ${lastTruck}
          ${moves([`${T}:${dxB},0~3000`, 'deliver:0,-100~700', 'deliver:0,46@750~700', `deliver:${dxL},0@1500~1300`], box(16, BOXY.water))}
          ${moves([`${T}:${dxB},0~3000`, 'deliver:0,-100~700', 'deliver:0,46@750~700', 'deliver:0,-120@1500~600'], `<g data-at="deliver" clip-path="url(#inlClip)">${spreader(16, BOXY.water)}</g>`)}</g>
        ${tag(700, 380, plain(C.ui.lastMile || 'LAST MILE BY TRUCK'), `data-ch="${key}:barge|rail" data-at="deliver"`, '#0B4F6C')}`;
    }
    return `${svgOpen(s)}<defs><clipPath id="inlClip"><rect x="-700" y="126" width="2400" height="400"/></clipPath></defs>${terr}${ends}${vehicles}${o.extra || ''}
      ${tag(o.tagX || 711, 228, o.tagText, `data-at="${o.tagAt}"`)}
    </svg>`;
  }
  SCENES.precarriage = s => { const r = route(); return inland(s, { key: 'mode', travel: 'travel', bridge: !!r.bridge, leftLabel: plain(C.ui.shipper), rightLabel: r.polTerminal, tagAt: 'approach', tagText: plain(C.ui.preAdvice),

  /* --- Steps 6 & 8: quay operations (load / discharge). Ship stacks, our box and the crane share one scale (K). --- */
  /* =====================================================================
     v1.0 REALISM KIT (retour 6) — pilot: quay scenes (steps 6 and 8) and the intro sea.
     One light source per scene: the sun high on the LEFT → cast shadows fall to the right; lit faces are the left/top ones.
     Real scale in the quay scenes: QM = 6.94 px per metre (a 40' box = 84.6 px, a 9'6" tier = 20.6 px), so the boxes,

  const QM = 6.94, KQ = QM / (470 / 12.19), QTH = 20.6, QWL = 400;   // px per metre · box scale · tier height · waterline
  // Sky: gradient, sun glow (top-left), layered cumulus with lit tops and shaded bases, haze at the horizon (aerial perspective)
  function cloudSVG(x, y, s, o) {

  // Calm harbour water from y0 down: depth gradient, light sheen near the far shore, slow ripple highlights (no "~" pattern)
  function harbourRipples(y0) {
    return Array.from({ length: 26 }, (_, i) => { const y = y0 + 6 + Math.pow(i / 26, 1.6) * (470 - y0), w = 18 + (i % 5) * 14 + i * 2.4, x = ((i * 137) % 1300) - 200;
      return `<rect x="${x}" y="${y.toFixed(1)}" width="${w.toFixed(0)}" height="${(.8 + i / 26 * 1.6).toFixed(1)}" rx="1" fill="#fff" opacity="${(.22 + (i % 3) * .08).toFixed(2)}"/>`; }).join('');

    return `<g><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}"/><rect x="${x}" y="${y}" width="${w}" height="${h}" fill="url(#corrS)"/>

  const QPAL = ['#7E2F2A', '#2F5E8C', '#8B9297', '#3D6B4F', '#C9CED2', '#A3562C', '#28435E', '#6E6A5E', '#B88A2E', '#5D7587'];

  // Ship-to-shore crane, side elevation, real proportions: landside leg at xL, rail gauge 30.5 m, outreach 68 m, backreach 22 m,

      <polygon points="${xL + g * .38},-260 ${xL + g * .62},-260 ${xW + lw},${gt} ${xW},${gt} ${xL + g * .5},-150 ${xL + lw},${gt} ${xL},${gt}" fill="url(#gCraneR)" stroke="#5F7686" stroke-width="1"/>

      <rect x="${back}" y="${gb - 5}" width="${out - back}" height="5" fill="#7F93A2"/>${rail(xW + 20, out - 10, gt)}
      <path d="M${out} ${gt} l14 6 v14 l-14 6 z" fill="#8CA0AF"/>
      <g><rect x="${back + 10}" y="${gt - 30}" width="${xL - back + 30}" height="30" fill="#E6ECF0" stroke="#8CA0AF"/><rect x="${back + 10}" y="${gt - 30}" width="${xL - back + 30}" height="4" fill="#fff" opacity=".6"/>
        ${[0, 1, 2, 3].map(i => `<rect x="${back + 20 + i * 26}" y="${gt - 22}" width="14" height="6" fill="#9DB5C4"/>`).join('')}<text x="${back + 22}" y="${gt - 6}" font-size="7" font-weight="800" fill="#55616D" letter-spacing="1">${esc(CONFIG.logoText)} TERMINAL</text></g>
      <rect x="${xL}" y="${gb}" width="${lw}" height="${GY - gb - 8}" fill="url(#gCraneR)"/><rect x="${xW}" y="${gb}" width="${lw}" height="${GY - gb - 8}" fill="url(#gCraneR)"/>

  // Container ship, side elevation at quay scale (bow off-frame to the right, stern near the quay edge). Origin = stern at the waterline.
  function shipQ(o) {

      <rect x="${bayX(b) - 9}" y="${coam - QTH - 1}" width="10" height="2" fill="#5B6A74"/><rect x="${bayX(b) - 9}" y="${coam - 2 * QTH - 5}" width="10" height="2" fill="#5B6A74"/>
      <path d="M${bayX(b) - 4} ${coam - 2 * QTH} L${bayX(b) + 12} ${coam - QTH + 2} M${bayX(b) - 4} ${coam - QTH} L${bayX(b) + 12} ${coam + 2} M${bayX(b) - 4} ${coam - 2 * QTH} L${bayX(b) - 20} ${coam - QTH + 2} M${bayX(b) - 4} ${coam - QTH} L${bayX(b) - 20} ${coam + 2}" stroke="#20272C" stroke-width=".9"/></g>` : '').join('');

  /* --- Steps 6 & 8: quay operations (load / discharge), v1.0 real-scale pilot ---

  /* --- Step 7: ocean voyage on a real map (v1.0, retour 5) ---

  function neProject(lat, lon) {

    const all = main.concat(feed, alt), xs = all.map(p => p[0]), ys = all.map(p => p[1]);
    const bx0 = Math.min(...xs), bx1 = Math.max(...xs), by0 = Math.min(...ys), by1 = Math.max(...ys);
    const k = Math.min(860 / (bx1 - bx0 || 1), 330 / (by1 - by0 || 1)), tx = 490 - k * (bx0 + bx1) / 2, ty = 200 - k * (by0 + by1) / 2;

      const big = q.name === q.name.toUpperCase(), sz = big ? 12 : 9.5, tw = q.name.length * (sz * .62 + 1.5);

      return q.rot ? `<g transform="rotate(${q.rot} ${x.toFixed(1)} ${y.toFixed(1)})">${t}</g>` : t; }).join('');
    // top-down container ship, bow to +x; our box highlighted; bow wave and wake visible while the ship moves
    const bays = Array.from({ length: 7 }, (_, i) => [0, 1, 2].map(j => `<rect x="${-13 + i * 4.1}" y="${-4.4 + j * 3}" width="3.6" height="2.6" fill="${i === 4 && j === 1 ? (c.family === 'reefer' ? '#F2F5F7' : 'var(--c-box)') : PALETTE[(i + j * 2) % PALETTE.length]}"/>`).join('')).join('');

    const scaled = inner => `<g transform="scale(${(1 / k).toFixed(4)})">${inner}</g>`;
    const W = C.world;
    return `${svgOpen(s)}
      <rect x="-700" y="-100" width="2360" height="700" fill="url(#gDeep)"/>
      <g transform="translate(${tx.toFixed(2)} ${ty.toFixed(2)}) scale(${k.toFixed(4)})">
        <path d="${W.land}" fill="none" stroke="#3B7FAA" stroke-width="14" stroke-linejoin="round" opacity=".45" ${nss}/>
        <path d="${W.land}" fill="none" stroke="#5C9FC5" stroke-width="7" stroke-linejoin="round" opacity=".55" ${nss}/>
        <path d="${W.land}" fill="none" stroke="#8CC2DD" stroke-width="2.6" stroke-linejoin="round" opacity=".8" ${nss}/>
        <path d="${W.graticule}" fill="none" stroke="#fff" stroke-width=".6" opacity=".16" ${nss}/>
        <path d="${W.land}" fill="#E5DEC7" stroke="#A99D79" stroke-width=".8" stroke-linejoin="round" ${nss}/>
        <g fill="none" stroke="#5FA3C9" stroke-width="3.2" stroke-linecap="round" ${nss}>${segs(main, G.inland)}${segs(feed, G.feederInland)}</g>
        ${alt.length ? `<path d="${d(alt)}" fill="none" stroke="#F4F1E6" stroke-width="1.8" stroke-dasharray="3 5" opacity=".85" ${nss}/>` : ''}
        <path id="routePath" d="${d(main)}" fill="none" stroke="#F2B705" stroke-width="2.6" stroke-dasharray="9 6" stroke-linejoin="round" ${nss}/>
        ${feed.length ? `<path id="feederPath" d="${d(feed)}" fill="none" stroke="#FF9A4A" stroke-width="2.6" stroke-dasharray="6 5" stroke-linejoin="round" ${nss}/>` : ''}
        ${feed.length ? `<g id="feederShip" data-path="feederPath" data-heading="1" data-along="start:0;depart:0;hub:1" data-d="2400" data-until="hub">${scaled(shipIcon)}</g>` : ''}
        <g id="mainShip" data-path="routePath" data-heading="1" data-along="${along}" data-d="2600" ${feed.length ? 'data-at="hub"' : ''}>${scaled(shipIcon)}</g>
      </g>
      ${seas}${marks}
      ${alt.length && G.altLabelAt ? (() => { const [x, y] = scr(neProject(G.altLabelAt[0], G.altLabelAt[1])); return label(Math.min(Math.max(x, 120), 840), Math.min(y, 410), M.altText || '', { anchor: 'middle', size: 11, weight: 700, fill: '#F4F1E6', halo: '#174A6E', haloW: 3 }); })() : ''}
      <text x="20" y="450" font-size="11" fill="#E8F1F6" stroke="#174A6E" stroke-width="3" paint-order="stroke">${esc(plain(C.ui.mapNote))}</text>
      ${c.family === 'reefer' ? inset(690, 330, 250, 100, 'REMOTE REEFER MONITORING', ['Set point ' + plain('{setPoint}') + ' · supply air ✓', 'Alarms: none · power ✓', 'Readings sent several times a day']).replace('<g ', '<g data-at="ocean" ') : ''}
      ${tag(M.days[0], M.days[1], plain('{transit}'), 'data-at="arrive"', '#1D7048')}
    </svg>`;
  };

  /* --- Step 11: unstuffing at the consignee, empty return to the depot --- */
  SCENES.unstuff = s => {
    const c = container(), { w, h } = boxDims(c), f = c.family, t = c.id, y = GY - (h + 33);
    const open = f === 'dry' || f === 'reefer';
    const slots = open ? cartonSlots(w, h, y) : [];
    // loose cartons (NOT in the truck group): in the open box → into the consignee's warehouse; hidden before the truck leaves
    const loose = open ? `<g data-until="unstuff">${slots.slice().reverse().map((c, k) => `<g data-tx="start:0,0;unstuff:${c.sx - c.bx},${c.sy - c.by}@${k * 140}~900">${carton(c.bx, c.by)}</g>`).join('')}</g>` : '';
    let bg = ''; [430, 546, 662, 778].forEach((x, i) => { for (let k = 0; k < 3; k++) bg += `<rect x="${x}" y="${314 - k * 56}" width="112" height="54" fill="${PALETTE[(i + k) % 5]}" stroke="#6E7C88"/>`; });
    return `${svgOpen(s)}${ground()}
      ${warehouseSVG(20, plain(C.ui.consigneeWarehouse), { attrs: 'data-until="unstuff"' })}<g data-until="unstuff">${dockInterior()}</g>
      <g data-at="return" opacity=".9"><g opacity=".55">${bg}</g><rect x="20" y="20" width="236" height="30" rx="6" fill="#fff" stroke="#97A4AF"/><text x="138" y="41" text-anchor="middle" font-size="14" font-weight="800" fill="#1B2631">EMPTY DEPOT · ${esc(route().pod.toUpperCase())}</text>
        <rect x="80" y="${GY - 120}" width="140" height="120" fill="#D3DBE1" stroke="#97A4AF"/><text x="150" y="${GY - 96}" text-anchor="middle" font-size="11" font-weight="800" fill="#1B2631">${f === 'reefer' ? 'WASH + PTI' : f === 'tank' ? 'TANK CLEANING' : 'M&amp;R WORKSHOP'}</text></g>
      ${t === '40OT' || t === '40FR' ? `<g data-at="unstuff" data-until="unstuff"><line x1="${320 + w / 2}" y1="0" x2="${320 + w / 2}" y2="${y + 10}" stroke="#3F4750" stroke-width="3"/>${tag(320 + w / 2, 40, 'CRANE LIFTS THE CARGO OUT')}</g>` : ''}
      ${f === 'tank' ? `<g data-at="unstuff" data-until="unstuff"><path d="M${320 + w / 2} ${y + 6} C 260 ${y - 40}, 220 300, 160 300" stroke="#1B2631" stroke-width="7" fill="none"/>${tag(320 + w / 2 + 60, y - 40, 'DISCHARGING…', '', '#0B4F6C')}</g>` : ''}
      ${rig(c, { attrs: 'data-tx="start:0,0;return:1200,0~2400"', boxOpts: { wallAttr: open ? 'data-until="start"' : '', wall2Attr: open ? 'data-at="return"' : '', plate: true, cargo: false } })}${loose}
      ${rig(c, { attrs: 'data-tx="start:-1200,0;gatein:0,0~2400;depart:1200,0~2600"', boxOpts: { plate: true, cargo: false } })}
      ${inset(470, 14, 232, 112, 'EIR — EMPTY RETURN', [`Container ${CONTAINER_NO}`, 'Empty, clean ✓', 'Damage: none recorded', 'Detention clock: STOP'], 'data-at="gatein" data-delay="2400"')}
      ${tag(782, 150, '⏱ IMPORT DETENTION STOPS', 'data-at="gatein" data-delay="2600"', '#1D7048')}
    </svg>`;
  };

  // Narrator avatar (also used in the menu).
  // Narrator avatar (narration bubble, menu, summary): v0.5 design with the v1.0 eyes; mood = 'happy' / 'puzzled' (optional).
  function avatar(w, mood) {
    return `<svg viewBox="0 0 120 90" width="${w}" aria-hidden="true" class="${mood ? 'face-' + mood : ''}"><rect x="6" y="14" width="108" height="62" rx="6" fill="var(--c-box)" stroke="var(--c-box-dark)" stroke-width="3"/>
      ${[22, 38, 54, 70, 86, 102].map(x => `<line x1="${x}" y1="18" x2="${x}" y2="72" stroke="#000" opacity=".12" stroke-width="4"/>`).join('')}
      ${faceSVG(60, 42, .72)}</svg>`;
  }

  /* ---------- Start-up ---------- */
  function buildClouds() {
    $('#clouds').innerHTML = [[8, 120, 70, -10], [22, 90, 95, -45], [14, 150, 120, -80], [30, 70, 85, -20]].map(([top, w, dur, delay]) =>
      `<span class="cloud" style="top:${top}%;width:${w}px;animation-duration:${dur}s;animation-delay:${delay}s"></span>`).join('');
  }
  applyConfig(); mountDefs(); buildClouds(); retryUnsent();
  S = load();
  if (S && (S.v !== 3 || !S.settings)) S = null;
  if (S) { draft = Object.assign({}, S.settings); initChoices(); }
  // Bob's intro opens the game every time; saved progress is resumed from the menu ("Resume").
  if (S) S.screen = 'menu';
  renderIntro();

  // Test/debug hook (console only).
  window.__cj = { state: () => S, C, renderIntro, goStep, go, openQuestion, startQuiz, renderSummary, renderMenu, consult,
    answerRight: () => { const s = step(); answer(R(s.question).options.find(o => o.correct).id); },
    consultAll: () => { essentials(step()).forEach(h => { const arr = S.consulted[S.step] || (S.consulted[S.step] = []); if (!arr.includes(h.id)) arr.push(h.id); }); save(); renderHs(); renderBar(); },
    footprint: () => footprint(), meter: () => meterTotals(), depart: () => depart(), openMeter: () => openMeter(), nudgeNow: () => nudgeNow(), closeXfer, resultItems: () => resultItems(), results: () => loadResults(),
    reset: () => { try { localStorage.removeItem(STORE); } catch (e) {} location.reload(); } };
})();
</script>
</body>
</html>
