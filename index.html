ght": "Never for the VGM."}, {"id": "d", "text": "The laden box returns to the empty depot so that the carrier can check its weight and seal there.", "why": "Depots handle empty equipment. Weight and seal are the shipper's responsibility.", "realLife": "The depot refuses it: an extra trip and a possibly missed cut-off.", "whenRight": "Under carrier haulage via an inland depot named in the booking, laden boxes can be received inland — not at the empty depot."}]}, "3": {"prompt": "Case: the VGM is 3.5 t above the booking estimate; the customer asks you to use the booking weight instead. What should you do?", "options": [{"id": "a", "correct": true, "text": "Refuse: only the shipper's VGM counts. If they doubt it, they re-verify and send a corrected VGM in time.", "confirm": "Right. The VGM is the shipper's legal declaration; the carrier may not substitute an estimate. A re-weigh is possible, but a corrected VGM must still arrive before cut-off or the box is shut out. [TO VERIFY:v01] [TO VERIFY:v03]"}, {"id": "b", "text": "Enter the booking weight in the system: the customer knows the cargo and takes responsibility for it.", "why": "A booking weight is an estimate, not a verified mass.", "realLife": "Wrong weights endanger stowage and stability; the carrier becomes party to a misdeclaration.", "whenRight": "Never."}, {"id": "c", "text": "Accept the higher VGM and load the box anyway, even if it is above the legal road weight limit at destination.", "why": "Road limits concern the haulier; the issue here is which weight is valid.", "realLife": "Overweight on the road can mean fines and a stopped truck. [TO VERIFY:v13]", "whenRight": "Accepting the VGM is right; ignoring road limits is not."}, {"id": "d", "text": "Use the average of the two weights, so that the stowage plan stays within a safe margin either way.", "why": "There's no such thing as an 'average VGM'.", "realLife": "An invented weight is a misdeclaration with liability for whoever enters it.", "whenRight": "Never."}]}}}, {"id": 3, "short": "Pre-carriage", "title": "Pre-carriage to the terminal", "scene": "precarriage", "sceneDesc": "A landscape between the shipper and the export terminal: a road, possibly a bridge, a river with barges and a railway. The chosen transport carries the container to the terminal.", "beats": [{"id": "haulage", "levels": [2, 3], "ms": 1400, "narration": {"2": "[[pre-carriage|Pre-carriage]] to {polTerminal}. Who moves me was fixed at booking: [[merchant-haulage]] or [[carrier-haulage]]. Open the choice to compare.", "3": "Haulage mode drives liability, invoicing and who manages appointments and waiting time. Under carrier haulage the B/L can show an inland place of receipt. [TO VERIFY:v43]"}, "caption": {"2": "Under {incoterm}, pre-carriage is for the account of {preBy}, whatever the haulage mode."}}, {"id": "mode", "ms": 1400, "narration": {"1": {"_by": "modes", "many": "Full, sealed and weighed, I'm leaving. How do I get to the port? Pick a transport mode.", "*": "Full, sealed and weighed, I'm leaving for the port — by truck, the usual way to reach {polTerminal}."}, "2": {"_by": "modes", "many": "Mode choice depends on distance, volumes, infrastructure and cut-offs. Compare the options available to reach {polTerminal}. [TO VERIFY:v39]", "*": "{polTerminal} is reached by road: trucking is the standard pre-carriage here. [TO VERIFY:v39]"}, "3": "Intermodal legs close earlier than the CY cut-off and add handlings; trucking is exposed to congestion and road weight limits. [TO VERIFY:v40]"}, "caption": {"2": {"_by": "family", "reefer": "Reefers travel with a [[genset]] on the road. [TO VERIFY:v57]", "tank": "DG on the road follows national rules (e.g. ADR in Europe). [TO VERIFY:v59]", "oog": "Oversize loads may need a road permit or escort. [TO VERIFY:v58]", "*": "Intermodal legs usually close earlier than the port cut-off. [TO VERIFY:v40]"}}}, {"id": "travel", "ms": 5000, "narration": {"1": {"_by": "mode", "barge": "A truck takes me to a river terminal, where a crane puts me on a barge with dozens of other boxes, bound for {polTerminal}. Slower than a truck, but cheaper per box.", "rail": "A truck takes me to a rail terminal; a crane lifts me onto a wagon and the train carries me to the port.", "*": "On the road! The driver carries my booking number so the terminal knows who I am."}, "2": {"_by": "mode", "barge": "First mile by truck to a river terminal, then barge to {polTerminal}: economies of scale, an extra handling and an earlier cut-off. [TO VERIFY:v40]", "rail": "First mile by truck to a rail terminal, then rail to the port: extra handlings, each with cost and time. [TO VERIFY:v98]", "*": "Road haulage. Road weight limits apply to the whole truck, so a box within its own rating can still be overweight on the road. [TO VERIFY:v13]"}, "3": "In transit: the haulier carries booking and container references; ETA to the terminal is monitored against the CY cut-off ({cyCutoff})."}, "caption": {"2": "Port (CY) cut-off: {cyCutoff} (illustrative). Missed = not on the load list."}}, {"id": "approach", "ms": 1200, "narration": {"1": "Here's the terminal. The gate is expecting me: my arrival was announced in advance. But is my paperwork ready?", "2": "At the terminal approach: [[pre-advice]] sent and, where required, a truck appointment booked. Open the transport order to see what the gate checks. [TO VERIFY:v44]", "3": "Pre-advice (EDI COPARN or portal) and appointment slot must match the truck, the box and the booking — otherwise the gate rejects or holds it. [TO VERIFY:v44]"}}, {"id": "incident", "levels": [3], "kind": "incident", "narration": {"3": {"_by": "route", "SHA-LEH": "Fog closes the Donghai Bridge for hours. The driver now expects to reach Yangshan four hours after the CY cut-off.", "HCM-SIN-LEH": "Severe congestion around Cat Lai: the driver now expects to reach the gate four hours after the CY cut-off.", "*": "A road blockade on the way to Posorja: the driver now expects to reach the gate four hours after the CY cut-off."}}}], "fact": {"beat": "travel", "text": {"_by": "route", "SHA-LEH": {"1": "Shanghai is the world's busiest container port: around 50 million TEU a year. [TO VERIFY:v42]", "2": "The Donghai Bridge linking Yangshan to the mainland is about 32.5 km long — every truck delivering to Yangshan crosses it. [TO VERIFY:v41]"}, "HCM-SIN-LEH": {"1": "Around Ho Chi Minh City, many containers travel by river barge on the Mekong delta waterways. [TO VERIFY:v54]", "2": "Cat Lai is a river terminal: big ships can't reach it, which is why boxes go by feeder to a hub like Singapore — or to deep-water Cai Mep. [TO VERIFY:v54]"}, "*": {"1": "Ecuador is the world's largest banana exporter. [TO VERIFY:v55]", "2": "Posorja is a deep-water port built on the coast, so large ships no longer need to sail up the Guayas river to Guayaquil. [TO VERIFY:v55]"}}}, "hotspots": [{"id": "haulage", "beat": "haulage", "levels": [2, 3], "essential": [2, 3], "choice": "haulage", "x": 220, "y": 112, "label": "Haulage mode", "kind": "Choice"}, {"id": "mode", "beat": "mode", "essential": [1, 2, 3], "choice": "mode", "when": {"modes": "many"}, "x": 220, "y": 168, "label": "Transport mode", "kind": "Choice"}, {"id": "cutoff", "beat": "mode", "essential": [1], "x": 560, "y": 150, "label": "Port deadline", "kind": "Rule", "body": {"1": "Whoever moves me, I must reach the terminal before the port deadline ({cyCutoff}, illustrative) — the [[cut-off]]. Late = I miss my ship.", "2": "CY cut-off {cyCutoff} (illustrative). Barge and rail legs have earlier cut-offs. [TO VERIFY:v40]"}}, {"id": "terminal", "beat": "mode", "x": 880, "y": 200, "label": "Export terminal", "kind": "Stakeholder", "body": {"1": "{polTerminal}: the port facility where I'll wait for my ship.", "2": "Receives full boxes up to the CY cut-off, stacks them for loading and reports arrivals to customs. [TO VERIFY:v45]"}}, {"id": "bridge", "beat": "travel", "when": {"route": ["SHA-LEH"]}, "x": 520, "y": 258, "label": "Sea bridge", "kind": "Infrastructure", "body": {"1": "The island terminal is linked to the mainland by a sea bridge more than 30 km long. [TO VERIFY:v41]", "2": "Donghai Bridge (about 32.5 km). Congestion or bad weather on the bridge directly threatens cut-offs. [TO VERIFY:v41]"}}, {"id": "road", "beat": "travel", "x": 330, "y": 236, "label": "Road limits", "kind": "Rule", "body": {"1": "Roads have weight limits for the whole truck. A heavy container can be legal for the ship but too heavy for the road.", "2": "Gross vehicle weight limits are national (China: GB 1589; France: 44 t for 5+ axles). Overweight → fines, truck stopped. [TO VERIFY:v13]"}}, {"id": "genset", "beat": "travel", "when": {"family": ["reefer"]}, "x": 150, "y": 250, "label": "Genset", "kind": "Equipment", "body": {"1": "On the road, a diesel generator keeps my cooling unit running.", "2": "Clip-on or underslung [[genset]] keeps the reefer powered between plug points; fuel and function checked before departure. [TO VERIFY:v57]"}}, {"id": "to", "beat": "approach", "levels": [2, 3], "essential": [2, 3], "doc": {"2": "to", "3": "to"}, "x": 711, "y": 262, "label": "Transport order / pre-advice", "kind": "Document"}, {"id": "gatecheck", "beat": "approach", "levels": [1], "x": 711, "y": 262, "label": "Pre-advice", "kind": "Document", "body": {"1": "A message telling the terminal I'm coming: booking number, container number, ship. Without it, the gate may turn me away."}}], "docs": {"to": {"title": "Transport order & pre-advice", "heading": "TRANSPORT ORDER · PRE-ADVICE", "sub": "Fictional example", "stamp": "SENT", "rows": [{"label": "Haulier", "value": "Demo Transport Co. (fictional)"}, {"label": "Booking no.", "value": "{bookingNo}"}, {"label": "Container / seal", "value": "{containerNo} ({boxCode}) / {sealNo}", "zone": 1}, {"label": "Collect at", "value": "{origin}"}, {"label": "Deliver to", "value": "{polTerminal} · before {cyCutoff}", "zone": 2}, {"label": "VGM", "value": "{vgm} kg"}, {"label": "Special", "value": {"_by": "family", "reefer": "Genset · keep {setPoint}", "tank": "DG {cargo} · ADR/national DG rules", "oog": "Oversize · permit if required", "*": "—"}, "zone": 3}], "points": {"1": "Container, seal and booking must match the terminal's pre-advice exactly; a single digit wrong = gate rejection or hold. [TO VERIFY:v44]", "2": "The CY cut-off is the latest arrival time. Some terminals also require a truck appointment slot. [TO VERIFY:v44]", "3": "Special cargo has extra road rules: genset for reefers, DG documents and placards, permits for oversize loads. [TO VERIFY:v57] [TO VERIFY:v58] [TO VERIFY:v59]"}, "check": {"2": {"prompt": "What does the terminal gate match the truck against?", "options": [{"id": "a", "correct": true, "text": "The pre-advice: booking number, container number, seal (and appointment if required)"}, {"id": "b", "text": "The commercial invoice and packing list handed over by the driver at the gate", "fb": "Invoices are for customs and the buyer, not the gate."}, {"id": "c", "text": "The original Bill of Lading, which the driver must show before entering the terminal", "fb": "The B/L doesn't exist yet for this box, and never travels with the truck."}, {"id": "d", "text": "Only the driver's ID and truck plate; the box details are checked later in the yard", "fb": "The driver is checked, but the box must match an expected delivery."}], "explain": "Terminals accept full export boxes only when they match a pre-advised booking; mismatches mean refusal or hold. [TO VERIFY:v44]"}, "3": {"prompt": "The pre-advice shows a container number with a wrong check digit. The truck is at the gate. Most likely outcome?", "options": [{"id": "a", "correct": true, "text": "Gate rejection or hold until the forwarder corrects the pre-advice; the truck waits"}, {"id": "b", "text": "The gate clerk corrects the digit on the spot and lets the box into the export yard", "fb": "Some terminals allow manual correction, but data ownership stays with the sender; the default is hold."}, {"id": "c", "text": "The box enters normally; the container number is corrected later on the B/L draft", "fb": "Entering under wrong data breaks traceability to the booking and load list."}, {"id": "d", "text": "Customs seizes the container for suspected fraud and opens an investigation file", "fb": "A data mismatch is an operational issue, not a customs offence."}], "explain": "Check digits exist to catch typos (ISO 6346). Clean data avoids waiting time and cut-off risk. [TO VERIFY:v32] [TO VERIFY:v44]"}}}}, "dossier": {"documents": ["**Transport / haulage order** — merchant → haulier, or carrier → subcontractor.", "**Pre-advice** (e.g. EDI COPARN) and truck appointment. [TO VERIFY:v44]", "**VGM** already transmitted — some terminals check it at gate-in. [TO VERIFY:v01]", "**Barge or rail consignment note** for intermodal legs."], "costs": ["**Pre-carriage** — carrier haulage tariff or the merchant's own contract.", "**Waiting time** beyond free loading time. [TO VERIFY:v12]", "**Intermodal handling** at barge or rail terminals. [TO VERIFY:v40]", "**Export detention** until full gate-in. [TO VERIFY:v21]"], "risks": ["**Arrival after the CY cut-off** → shut out, rolled (+7 days on a weekly service).", "**Pre-advice mismatch** → refused at the gate, waiting time.", "**Road overweight** → fines, truck stopped. [TO VERIFY:v13]", {"text": "**Genset failure** on a reefer → temperature excursion before the terminal. [TO VERIFY:v57]", "when": {"family": ["reefer"]}}], "jobs": ["**Inland / intermodal operations** — haulier, barge and rail planning.", "**Procurement** — subcontractor contracts and rates.", "**Customer service** — cut-off monitoring and rollover communication.", "**D&D / finance** — waiting time and detention invoicing."]}, "incoNote": {"_by": "incoterm", "EXW": "Under EXW, the buyer organises and pays this trip — risk passed at the seller's door.", "FCA": "Under FCA (terminal), risk and cost pass when this truck arrives at the terminal, ready for unloading.", "FAS": "Under FAS, risk passes when the goods are 'alongside' — for containers, effectively at the terminal.", "CPT": "Under CPT, risk passes when the box is handed to the carrier at the terminal; the seller still pays carriage to destination.", "CIP": "Under CIP, risk passes when the box is handed to the carrier at the terminal; the seller still pays carriage and insurance.", "*": "The seller pays this trip and still carries the risk."}, "keyPoints": {"1": ["Pre-carriage brings the full container from the shipper to the export terminal, usually by truck.", "It must arrive before the port deadline (cut-off).", "The terminal must be expecting it: that's the pre-advice."], "2": ["Merchant vs carrier haulage changes who contracts, who invoices and where the carrier's responsibility starts.", "Mode choice (truck, barge, rail) drives cost, emissions and cut-off timing.", "Pre-advice and appointments are hard constraints; late = shut-out."], "3": ["Ask for a cut-off extension before the cut-off, not after — and document the answer.", "Data quality (check digits, seal numbers) prevents gate holds.", "Special cargo adds road rules: genset, DG regulations, oversize permits."]}, "question": {"1": {"prompt": "I'm almost at the port. What happens to my papers at the same time?", "hint": "Before a container can leave a country, two organisations need information about it: the carrier and customs.", "options": [{"id": "a", "correct": true, "text": "At the same time, the papers are finished: shipping instructions and a customs export form.", "confirm": "Yes! A container travels twice: physically, and as data. The carrier needs the shipping instructions for the Bill of Lading, and customs must approve the export. Under {incoterm}, export customs is handled by the {exportBy}."}, {"id": "b", "text": "The terminal lifts me onto the ship the very minute I arrive, with no papers needed at all.", "why": "The ship may not even be in port yet; the terminal first checks me in, stores me and plans where I go on board.", "realLife": "Containers usually wait a few days in the terminal yard. Without customs approval, the terminal won't load me.", "whenRight": "Some special cargo goes directly to the ship's side, by prior agreement."}, {"id": "c", "text": "Customs officers open and check every single container before it can enter the port.", "why": "Customs check data first and select only a small share for physical inspection, based on risk.", "realLife": "If I'm selected, I'm moved to an inspection area: extra cost and delay — but it's the exception.", "whenRight": "When customs selects a container after its risk check."}]}, "2": {"prompt": "Your {mode} delivery is approaching {polTerminal} before the port cut-off; VGM already transmitted. What happens next?", "options": [{"id": "a", "correct": true, "text": "In parallel: SI before the SI cut-off, export declaration by the exporter's broker, carrier's advance filings.", "confirm": "Correct. Physical and documentary flows run in parallel, each with its own cut-off. Under {incoterm}, export clearance is the {exportBy}'s job. [TO VERIFY:v45]"}, {"id": "b", "text": "The carrier lodges the export declaration itself, as part of the ocean freight, straight from the booking data.", "why": "The exporter (or its broker) is the declarant; booking data lacks HS codes, values and invoice details.", "realLife": "No declaration = no customs release = not loaded.", "whenRight": "Some carriers sell brokerage as a separate service, under the exporter's mandate."}, {"id": "c", "text": "No more data is needed: the carrier generates the draft B/L directly from the booking confirmation.", "why": "The booking has no consignee, final cargo description, package count or seal. The B/L is built from the SI.", "realLife": "Late or missing SI → late-SI fee, B/L on hold, shut-out risk. [TO VERIFY:v12]", "whenRight": "Portals can pre-fill the SI with booking data — the shipper still completes it."}, {"id": "d", "text": "Customs physically inspects every box at the gate; the terminal only receives boxes already inspected.", "why": "Customs controls are risk-based: most boxes are released electronically.", "realLife": "If selected, the box moves to an inspection area: costs and delay for the cargo side.", "whenRight": "When targeted after risk analysis, or for controlled goods. [TO VERIFY:v19]"}]}, "3": {"prompt": "Case: the truck will reach the gate four hours after the CY cut-off. What is the best course of action?", "options": [{"id": "a", "correct": true, "text": "Before the cut-off, ask the export desk for a late-gate approval; if refused, rebook and warn the customer.", "confirm": "Right. Late-gate acceptance depends on the terminal's load planning and is easier before the plan is closed; it may carry a fee. Either way, the customer hears it from you first. [TO VERIFY:v12] [TO VERIFY:v31]"}, {"id": "b", "text": "Let the truck drive on and hope the gate accepts the box, since vessels often leave a little late.", "why": "After the cut-off the box isn't on the load list; the gate may refuse or accept it only for the next vessel.", "realLife": "Storage starts, the box waits a week, and the customer finds out last.", "whenRight": "Never as a plan."}, {"id": "c", "text": "Ask the terminal to delay the vessel's departure by four hours so that the late box can still be loaded on board.", "why": "Vessels run on fixed berth windows serving many customers.", "realLife": "Not possible for one box; ships only wait for major operational reasons.", "whenRight": "Never for a single late container."}, {"id": "d", "text": "Send the box to another terminal in the same port that has a later cut-off for the same vessel.", "why": "The box is booked on a specific vessel at a specific terminal.", "realLife": "A box at the wrong terminal must be shifted: cost and almost certain shut-out.", "whenRight": "Only if the carrier rebooks it on a service calling that terminal."}]}}}, {"id": 4, "short": "Export docs", "title": "Export documentation & customs", "scene": "flow", "sceneDesc": "Four illustrated stations show the paper journey that runs alongside the container: shipping instructions, draft Bill of Lading check, export declaration and customs release. The container moves from station to station.", "flow": {"strip": "Cut-offs · SI {siCutoff} · VGM {vgmCutoff} · port {cyCutoff} (illustrative)", "stations": [{"beat": "si", "icon": "laptop", "title": "Shipping instructions", "sub": "Shipper → Carrier"}, {"beat": "draft", "icon": "bl", "title": "Draft B/L check", "sub": "Carrier → Shipper"}, {"beat": "export", "icon": "customs", "title": "Export declaration", "sub": "Broker → {exportCustoms}"}, {"beat": "release", "icon": "stamp", "title": "Customs release", "sub": "Customs → Terminal · ENS → EU"}], "incident": {"station": 3, "text": "DO NOT LOAD (ICS2)"}}, "beats": [{"id": "si", "ms": 1800, "narration": {"1": "While I was on the road, my data travelled too. The shipper sends the carrier its [[si|shipping instructions]]: who sends, who receives, what's inside me, seal and weights.", "2": "The [[si]] arrives before the SI cut-off ({siCutoff}): shipper, consignee (or 'to order'), [[notify-party]], description, [[hs-code|HS code]], packages, weights, seal, B/L type and freight terms. [TO VERIFY:v46]", "3": "SI completeness drives everything downstream: B/L, manifest, ENS. Vague descriptions ('general cargo', 'FAK') are rejected by advance-filing regimes such as ICS2. [TO VERIFY:v23]"}, "caption": {"2": "Consignee 'to order' → [[negotiable-bl|negotiable B/L]]; named consignee, no bank → [[sea-waybill]] possible."}}, {"id": "draft", "ms": 1800, "narration": {"1": "The carrier sends back a draft Bill of Lading for checking. Checking now is free; correcting the final B/L is not.", "2": "Documentation issues the [[draft-bl|draft B/L]]. The shipper must check it before issuance — amendments after issuance cost money. [TO VERIFY:v47]", "3": "Draft approval: if the shipper doesn't answer by the deadline, many carriers issue as drafted. One field below is inconsistent — find it. [TO VERIFY:v47]"}}, {"id": "export", "ms": 2400, "narration": {"1": "Now customs. A [[customs-broker]] files an [[export-declaration]] for the exporter: what the goods are, their value and where they go.", "2": "The exporter's broker lodges the [[export-declaration]] with invoice, packing list and HS codes. For sea exports, customs often matches it with the terminal's arrival data. [TO VERIFY:v45]", "3": "Declarant = exporter (or broker under mandate). Liability for the declared data stays largely with the exporter. Under {incoterm}, export clearance: {exportBy}. [TO VERIFY:v45]"}, "caption": {"2": "Under {incoterm}, export clearance is done by the {exportBy}."}}, {"id": "release", "ms": 1800, "narration": {"1": "Customs decides: most containers get a green light without being opened. The release goes to the terminal electronically — no release, no loading.", "2": "Risk assessment → electronic release to the terminal, or selection for inspection. The carrier files its [[manifest]] and, for the EU, the [[ens]] under [[ics2]] before loading. [TO VERIFY:v23]", "3": "ICS2: ENS at least 24 h before loading at the foreign port for deep-sea containers; house-level data may come from the NVOCC. A 'do not load' message is binding. [TO VERIFY:v23] [TO VERIFY:v48]"}}, {"id": "incident", "levels": [3], "kind": "incident", "narration": {"3": "ICS2 returns a 'do not load' message for your box: the goods description in the ENS reads 'general cargo'. The vessel loads in 30 hours."}}], "fact": {"beat": "draft", "text": {"1": "An original 'to order' Bill of Lading works like a cheque for the goods: whoever lawfully holds it can claim the cargo.", "2": "Electronic B/Ls are catching up: laws such as the UK Electronic Trade Documents Act 2023 recognise them. [TO VERIFY:v49]"}}, "hotspots": [{"id": "sihs", "beat": "si", "x": 132, "y": 236, "levels": [2, 3], "essential": [2, 3], "label": "Shipping instructions", "kind": "Document", "body": {"2": "The SI is the shipper's instruction for the B/L: parties, description, HS code, packages, weights, seal, B/L type, freight terms, originals. Sent by portal, EDI (IFTMIN) or platform before the SI cut-off. [TO VERIFY:v46]", "3": "Common SI errors: consignee vs notify confusion, description too vague for ICS2, seal not updated after inspection, weight inconsistent with VGM. Each one costs an amendment or a hold. [TO VERIFY:v12]"}}, {"id": "blinfo", "beat": "draft", "levels": [1], "essential": [1], "x": 364, "y": 236, "label": "Bill of Lading", "kind": "Document", "body": {"1": "The [[bl|Bill of Lading]] is the carrier's receipt for the goods and the contract of carriage. An original 'to order' B/L also gives the right to collect the goods at destination."}}, {"id": "dbl", "beat": "draft", "levels": [2, 3], "essential": [2, 3], "doc": {"2": "dbl", "3": "dbl"}, "x": 364, "y": 236, "label": "Draft B/L", "kind": "Document"}, {"id": "broker", "beat": "export", "x": 596, "y": 66, "label": "Customs broker", "kind": "Stakeholder", "body": {"1": "A specialist who files customs declarations for companies.", "2": "Licensed declarant acting under the exporter's mandate; responsibility for the data largely stays with the exporter. [TO VERIFY:v45]"}}, {"id": "exdec", "beat": "export", "levels": [2, 3], "essential": [2, 3], "doc": {"2": "exdec", "3": "exdec"}, "x": 596, "y": 236, "label": "Export declaration", "kind": "Document"}, {"id": "release", "beat": "release", "levels": [1], "essential": [1], "x": 828, "y": 236, "label": "Customs release", "kind": "Rule", "body": {"1": "Customs checks the data and gives a green light — the 'release'. Without it, the terminal won't load me. Under {incoterm}, export customs is handled by the {exportBy}."}}, {"id": "eu", "beat": "release", "x": 828, "y": 66, "label": "EU customs (ICS2)", "kind": "Rule", "body": {"1": "Europe wants to know what's coming before the ship even leaves — for security.", "2": "ICS2: ENS due at least 24 h before loading at the foreign port for deep-sea containerised cargo; the carrier files. [TO VERIFY:v23]"}}], "docs": {"dbl": {"title": "Draft Bill of Lading", "heading": "BILL OF LADING — DRAFT", "sub": "Fictional draft for approval", "stamp": "DRAFT", "rows": [{"label": "Shipper", "value": {"_by": "incoterm", "EXW": "Buyer's forwarder, {pol} office (fictional)", "*": "Demo Exporter Co., {pol} (fictional)"}, "zone": 1}, {"label": "Consignee", "value": "To order of Demo Trade Bank (fictional)", "zone": 2}, {"label": "Notify party", "value": "Demo Import SAS (fictional)"}, {"label": "Vessel / ports", "value": "{vessel} {voyage} · {pol} → {pod}"}, {"label": "Container / seal", "value": "{containerNo} / seal {wrongSeal}", "error": true, "when": {"container": ["20DV", "40DV", "40HC", "40RF", "40OT", "20TK"]}}, {"label": "Container / seal", "value": "{containerNo} / no seal (flat rack)", "when": {"container": ["40FR"]}}, {"label": "Description", "value": "1 × {boxCode} STC {cargo}", "zone": 3}, {"label": "Gross weight", "value": "{cargoKg} kg · VGM {vgm} kg", "when": {"container": ["20DV", "40DV", "40HC", "40RF", "40OT", "20TK"]}}, {"label": "Gross weight", "value": "{vgm} kg · VGM {vgm} kg", "error": true, "when": {"container": ["40FR"]}}, {"label": "Originals / freight", "value": "3/3 originals · Freight {freightTerms}"}], "points": {"1": {"2": "B/L shipper — also the VGM party. Under {incoterm}: {vgmBy}."}, "2": {"2": "'To order of [bank]' → negotiable B/L, transferable by endorsement; used with letters of credit. A named consignee marked non-negotiable → straight B/L or sea waybill."}, "3": {"2": "STC = 'said to contain': the carrier didn't see inside. The description and HS code should be consistent with the customs declaration and precise enough for ICS2. [TO VERIFY:v46]"}}, "check": {"_by": "container", "40FR": {"type": "spot", "prompt": "One field is inconsistent with what you know from step 2 (the B/L gross weight excludes the tare). Tap it.", "explain": "The B/L gross weight is the cargo weight ({cargoKg} kg); the VGM adds the tare ({vgm} kg). Corrected before issuance: no amendment fee. [TO VERIFY:v12]"}, "*": {"type": "spot", "prompt": "One field doesn't match the seal on the door ({sealNo}). Tap it.", "explain": "Seal on the door {sealNo} vs {wrongSeal} on the draft. Seal mismatches trigger customs and terminal checks and L/C discrepancies. Corrected before issuance: no amendment fee. [TO VERIFY:v12]"}}}, "exdec": {"title": "Export declaration", "heading": "EXPORT DECLARATION (summary)", "sub": "{exportCustoms} · fictional example", "stamp": "LODGED", "rows": [{"label": "Exporter", "value": "Demo Exporter Co. (fictional)"}, {"label": "Declarant", "value": {"_by": "incoterm", "EXW": "Broker acting for the buyer (fictional)", "*": "Demo Customs Brokers, for the exporter (fictional)"}, "zone": 1}, {"label": "Goods / HS", "value": "{cargo} · HS code per tariff", "zone": 2}, {"label": "Value", "value": "Per commercial invoice · {incoterm}"}, {"label": "Destination", "value": "{pod}"}, {"label": "Transport", "value": "{containerNo} · {vessel} {voyage}", "zone": 3}, {"label": "Status", "value": "Lodged · awaiting risk assessment"}], "points": {"1": {"2": "The declarant files for the exporter. Under EXW the buyer must arrange it — often impractical abroad. [TO VERIFY:v14]"}, "2": {"2": "The HS code drives export controls and statistics; the description must match the SI and invoice. [TO VERIFY:v46]"}, "3": {"2": "Customs links the declaration to the container and vessel, and often to the terminal's arrival report, before releasing. [TO VERIFY:v45]"}}, "check": {"2": {"_by": "group", "E": {"prompt": "Under EXW, who must lodge this export declaration?", "options": [{"id": "a", "correct": true, "text": "The buyer (through a broker in the export country)"}, {"id": "b", "text": "The seller", "fb": "Under EXW the seller only assists, at the buyer's request and cost."}, {"id": "c", "text": "The carrier", "fb": "The carrier is never the exporter's declarant by default."}, {"id": "d", "text": "The terminal", "fb": "The terminal reports arrivals; it doesn't declare goods."}], "explain": "EXW puts export clearance on the buyer — a common trap; ICC suggests FCA instead. [TO VERIFY:v14]"}, "*": {"prompt": "Under {incoterm}, who must lodge this export declaration?", "options": [{"id": "a", "correct": true, "text": "The seller (exporter), usually through its customs broker"}, {"id": "b", "text": "The buyer", "fb": "Only under EXW does the buyer handle export clearance."}, {"id": "c", "text": "The carrier", "fb": "The carrier files manifests and ENS, not the export declaration."}, {"id": "d", "text": "The terminal", "fb": "The terminal reports arrivals; it doesn't declare goods."}], "explain": "In every rule except EXW, export clearance is the seller's obligation. [TO VERIFY:v14]"}}, "3": {"prompt": "The export declaration describes 'electric appliances, HS 8516' while the SI says 'spare parts'. What's the risk?", "options": [{"id": "a", "correct": true, "text": "Inconsistent data across declaration, SI/B/L and ENS: holds, inspection, penalties"}, {"id": "b", "text": "None: customs only reads the export declaration, never the SI, the B/L or the ENS", "fb": "Customs and ICS2 cross-check data sources."}, {"id": "c", "text": "Only a B/L amendment fee, charged by the carrier when the description is corrected", "fb": "The fee is the least of it; the box can be held."}, {"id": "d", "text": "The Incoterm changes automatically, as the goods declared are no longer the same", "fb": "Data errors don't touch the sales contract."}], "explain": "Align descriptions and HS codes across all filings before the cut-offs. [TO VERIFY:v45] [TO VERIFY:v23]"}}}}, "dossier": {"documents": ["**SI** — portal or EDI. [TO VERIFY:v46]", "**B/L types** — negotiable 'to order', straight, sea waybill, express release, eB/L. [TO VERIFY:v49]", "**Export declaration** + customs release.", "**Manifest**, **ICS2 ENS**; certificate of origin where needed."], "costs": ["**B/L / documentation fee**, **late SI fee**, **amendment fee** after issuance. [TO VERIFY:v12]", "**ENS / advance filing fee** at some carriers. [TO VERIFY:v48]", "**Brokerage** and, if selected, **inspection handling**. [TO VERIFY:v45]"], "risks": ["**SI after the cut-off** → late fee, possible shut-out. [TO VERIFY:v12]", "**Wrong HS code or vague description** → hold, penalties, L/C discrepancy.", "**Misdeclared dangerous goods** → serious safety risk and heavy penalties. [TO VERIFY:v25]", "**Missing or wrong ENS** → 'do not load'. [TO VERIFY:v48]"], "jobs": ["**Documentation** — SI validation, drafts, B/L issuance, amendments.", "**Customs & compliance** — manifests, ICS2, sanctions screening. [TO VERIFY:v48]", "**DG desk** — dangerous goods declarations.", "**Finance / credit control** — prepaid freight before release of originals. [TO VERIFY:v33]"]}, "incoNote": {"_by": "group", "E": "Under EXW the buyer must handle export customs — a common trap: the seller holds the documents the buyer needs.", "F": "The seller clears export; the B/L comes from the carrier the buyer booked. FCA allows an agreed on-board B/L to the seller. [TO VERIFY:v14]", "C": "The seller clears export and must give the buyer the transport document (and the insurance document under CIF/CIP). [TO VERIFY:v18]", "D": "The seller clears export; import is for the buyer (DAP/DPU) or the seller (DDP)."}, "keyPoints": {"1": ["A container travels twice: physically, and as data.", "The shipping instructions become the Bill of Lading — check the draft carefully.", "Customs must release the export before loading; most boxes are released without being opened."], "2": ["SI → draft B/L → approval → issuance; amendments after issuance cost money.", "B/L type matters: negotiable 'to order', straight, sea waybill, express release or eB/L.", "Export clearance follows the Incoterm (EXW = the buyer!); release is electronic and risk-based.", "Advance filings such as the EU ICS2 ENS are due before loading at origin."], "3": ["Data must be consistent across SI, B/L, export declaration and ENS.", "ICS2 'do not load' is binding: fix the data and refile, or roll the box.", "Never issue or date a B/L to fit commercial deadlines."]}, "question": {"1": {"prompt": "My papers are sent and customs is on it. I'm at the terminal gate. What happens next?", "hint": "The ship isn't here yet. Where do containers wait at a port?", "options": [{"id": "a", "correct": true, "text": "I go through the port gate, I'm checked, then stacked in the yard to wait for my ship.", "confirm": "That's it! The terminal checks that I'm expected, my seal is intact and my condition is fine. Then I wait in the export yard — and my detention clock usually stops here."}, {"id": "b", "text": "The driver takes my most important paper, the Bill of Lading, and keeps it with him.", "why": "The B/L doesn't travel with the container; originals go to the shipper, often through banks, to the buyer.", "realLife": "An original lost with a driver would be serious: originals are needed to collect the goods.", "whenRight": "Never with the driver."}, {"id": "c", "text": "I wait on the truck outside the port until my ship arrives, then drive straight to it.", "why": "Ships are loaded according to a plan made in advance, so boxes arrive days before.", "realLife": "Arriving at the last minute means missing the cut-off — and the ship.", "whenRight": "Some special cargo goes directly alongside, by prior agreement."}]}, "2": {"prompt": "SI in, draft approved, export declaration lodged, ENS filed. The box is at the gate before {cyCutoff}. What happens next?", "options": [{"id": "a", "correct": true, "text": "Gate-in: pre-advice match, number, seal and damage check (EIR), VGM status; then the export yard.", "confirm": "Correct. Gate-in is the custody handover to the terminal acting for the carrier. Export detention typically stops here. [TO VERIFY:v21]"}, {"id": "b", "text": "The carrier issues the shipped-on-board B/L now that the SI, the VGM and customs are in order.", "why": "'Shipped on board' certifies the box is loaded — it's still at the gate.", "realLife": "An early on-board B/L is a false statement: L/C fraud exposure.", "whenRight": "A 'received for shipment' B/L can be issued after receipt and annotated on board later. [TO VERIFY:v50]"}, {"id": "c", "text": "Direct delivery to the ship's side when it berths; terminals keep no export stacks for laden boxes.", "why": "Standard boxes are received into the yard before the cut-off so the stowage plan can be built.", "realLife": "Turning up at berthing time = missing the CY cut-off = shut-out.", "whenRight": "Some OOG or DG cargo by arrangement. [TO VERIFY:v51]"}, {"id": "d", "text": "The box waits outside until the customs release arrives; terminals only accept released boxes.", "why": "In many ports the release can follow gate-in: the terminal blocks loading, not entry.", "realLife": "Waiting outside costs truck time and risks the cut-off for nothing.", "whenRight": "Some ports do require an export reference before gate-in. [TO VERIFY:v52]"}]}, "3": {"prompt": "Case: ICS2 'do not load' because the ENS says 'general cargo'. Loading in 30 hours. What do you do?", "options": [{"id": "a", "correct": true, "text": "Block loading, get a precise description and HS code from the shipper, refile the ENS; else roll the box.", "confirm": "Right. 'Do not load' is binding. Precise goods descriptions are required; once refiled and cleared, the box can load — otherwise it waits for the next sailing. [TO VERIFY:v23] [TO VERIFY:v48]"}, {"id": "b", "text": "Load the box anyway and correct the ENS after departure, before the vessel reaches its EU port.", "why": "Loading against a 'do not load' breaches EU requirements.", "realLife": "Penalties for the carrier and the box can be refused entry at destination.", "whenRight": "Never."}, {"id": "c", "text": "Ask the terminal to override the 'do not load' message, since the cargo is known and harmless.", "why": "The terminal has no authority over EU customs decisions.", "realLife": "No terminal will take that liability.", "whenRight": "Never."}, {"id": "d", "text": "Change the description yourself to 'household appliances' and refile it, so that the ENS passes before loading.", "why": "The carrier can't invent cargo data; it must come from the party that knows the goods.", "realLife": "A false declaration makes the carrier liable for misdeclaration.", "whenRight": "Never without the shipper's confirmed data."}]}}}, {"id": 5, "short": "Gate-in", "title": "Gate-in, yard & stowage planning", "scene": "terminal", "sceneDesc": "The export terminal: a gate with cameras checks the truck and container, then the box is carried into the yard and stacked by a gantry crane. A bay plan shows where it will go on the ship.", "beats": [{"id": "gate", "ms": 2700, "narration": {"1": "I pass the terminal [[gate-in|gate]]. Cameras read my number, someone checks my seal and my condition, and I get a receipt.", "2": "Gate-in: OCR reads container and truck, the pre-advice is matched, seal and damage checked, an [[eir]] is issued. Custody passes to the terminal acting for the carrier. [TO VERIFY:v60]", "3": "Gate transaction = custody transfer and evidence point: seal, damage, VGM status, DG/OOG/reefer checks. Export detention stops per tariff; storage/demurrage free time starts. [TO VERIFY:v60] [TO VERIFY:v21]"}, "caption": {"2": "From now on, time in the terminal counts against demurrage/storage free time, not detention."}}, {"id": "yard", "ms": 3800, "narration": {"1": {"_by": "family", "reefer": "A gantry crane lifts me into the [[yard]]. As a reefer, I'm plugged into electricity so I stay cold.", "tank": "A gantry crane lifts me into a special area for dangerous goods, away from incompatible cargo.", "oog": "I can't be stacked like other boxes, so I wait in a special area for out-of-gauge cargo.", "*": "A gantry crane ([[rtg]]) lifts me into the [[yard]], stacked with other boxes for the same ship."}, "2": {"_by": "family", "reefer": "Reefer rack: plugged in and monitored by the terminal's reefer technicians. [TO VERIFY:v57]", "tank": "DG stack with [[segregation]] per IMDG and port rules; documents checked against the booking. [TO VERIFY:v59]", "oog": "OOG area: no stacking on top, special handling equipment for loading. [TO VERIFY:v58]", "*": "Export stack grouped by vessel, port of discharge and weight class to make loading efficient. [TO VERIFY:v61]"}, "3": "Yard planning groups boxes by vessel, POD and weight; reefers on plugs, DG segregated, OOG ungrouped. Dwell beyond free time triggers storage or demurrage. [TO VERIFY:v61]"}}, {"id": "plan", "ms": 1600, "narration": {"1": "Meanwhile, planners decide exactly where I'll sit on the ship: the [[stowage-plan|stowage plan]]. Heavy boxes low, boxes for the first port on top.", "2": "Stowage planning uses VGMs, ports of discharge, DG, reefer plugs and stability. The terminal builds the loading sequence from the carrier's plan. [TO VERIFY:v61]", "3": "Carrier central planner sends the pre-stow; terminal planner sequences moves; final bay plan exchanged as EDI BAPLIE. Only boxes on the load list with VGM and customs release are loaded. [TO VERIFY:v61]"}}, {"id": "incident", "levels": [3], "kind": "incident", "narration": {"3": "Twelve hours before the vessel arrives, the load list shows your box with status 'CUSTOMS HOLD — documentary check'. The customer hasn't been told."}}], "fact": {"beat": "plan", "text": {"1": "The biggest ships on Asia–Europe carry more than 20,000 TEU — and a plan places every single box. [TO VERIFY:v11]", "2": "Every box needs a slot that respects its weight, its port of discharge, DG segregation and reefer plugs — on ships of up to 24,000 TEU. [TO VERIFY:v11] [TO VERIFY:v61]"}}, "hotspots": [{"id": "gatein", "beat": "gate", "essential": [1, 2, 3], "doc": {"2": "gr", "3": "gr"}, "x": 148, "y": 130, "label": {"1": "Gate check", "2": "Gate-in receipt"}, "kind": "Document", "body": {"1": "At the gate, my number is read by cameras, my seal and my condition are checked, and a receipt is printed. It proves I arrived in good order, on time."}}, {"id": "clock", "beat": "gate", "levels": [2, 3], "x": 330, "y": 250, "label": "Clocks switch", "kind": "Charge", "body": {"2": "Export detention stops at full gate-in; terminal storage or demurrage free time starts. Some carriers combine both. [TO VERIFY:v21]", "3": "Long dwell before the vessel (e.g. early gate-in or rollings) can trigger storage charges — check who pays under the contract and the Incoterm. [TO VERIFY:v12]"}}, {"id": "rtg", "beat": "yard", "x": 720, "y": 104, "label": "Yard crane (RTG)", "kind": "Equipment", "body": {"1": "A big crane on tyres that stacks containers in the yard.", "2": "RTGs or straddle carriers stack boxes; every extra move ('shifting') costs time, so yard planners avoid digging boxes out. [TO VERIFY:v61]"}}, {"id": "zone", "beat": "yard", "x": 543, "y": 150, "when": {"family": ["reefer", "tank", "oog"]}, "label": {"_by": "family", "reefer": "Reefer plug", "tank": "DG segregation", "oog": "OOG area"}, "kind": "Rule", "body": {"_by": "family", "reefer": {"1": "I'm plugged into electricity so my cooling unit keeps {cargo} at {setPoint}.", "2": "Terminal technicians monitor reefers on plugs; temperature records are kept for claims. Plug-in charges may apply. [TO VERIFY:v57]"}, "tank": {"1": "Dangerous goods are kept apart from cargo they could react with.", "2": "IMDG segregation rules apply in the yard and on board; ports have DG declaration and dwell limits. [TO VERIFY:v59]"}, "oog": {"1": "Nothing can be stacked on me, so I need a special place.", "2": "Out-of-gauge units take extra slots and special equipment; they are often delivered close to loading. [TO VERIFY:v58]"}}}, {"id": "plan", "beat": "plan", "essential": [1, 2, 3], "x": 156, "y": 196, "label": "Stowage plan", "kind": "Planning", "body": {"1": "Planners place every box on the ship: heavy ones low, boxes for the first port of call on top, special boxes where they're allowed.", "2": "Built from the booking list and VGMs; constraints: stability, lashing forces, port rotation, DG segregation, reefer plugs, OOG slots. Exchanged as EDI BAPLIE. [TO VERIFY:v61]", "3": "Late VGMs or bookings force replanning; overweight or misdeclared boxes can compromise stability and lashing — one reason VGM rules exist. [TO VERIFY:v01]"}}], "docs": {"gr": {"title": "Gate-in receipt (EIR)", "heading": "TERMINAL GATE-IN RECEIPT", "sub": "{polTerminal} · fictional example", "stamp": "GATE IN", "rows": [{"label": "Booking no.", "value": "{bookingNo}"}, {"label": "Container", "value": "{containerNo} · {boxCode} · FULL"}, {"label": "Seal", "value": "{sealNo} · intact", "zone": 1}, {"label": "Condition", "value": "No visible damage · photos 6", "zone": 2}, {"label": "VGM status", "value": "Received · {vgm} kg", "zone": 3}, {"label": "Vessel", "value": "{vessel} {voyage}"}, {"label": "Gate time", "value": "Day 5, 14:10 (cut-off {cyCutoff})"}], "points": {"1": {"2": "The seal is checked against the pre-advice and documents; a mismatch triggers a hold."}, "2": {"2": "Condition at handover. Damage noted here was there before the terminal took charge — key for claims and repair recharges. [TO VERIFY:v71]"}, "3": {"2": "Some terminals refuse or hold boxes without a VGM at gate-in; all refuse to load them. [TO VERIFY:v01]"}}, "check": {"2": {"prompt": "What does this gate-in receipt prove?", "options": [{"id": "a", "correct": true, "text": "When and in what condition the full box was handed over to the terminal"}, {"id": "b", "text": "That the box has been loaded on board the vessel named in the booking", "fb": "Loading comes later — at step 6."}, {"id": "c", "text": "That customs has released the export and the box may now be loaded", "fb": "The release is a separate customs message."}, {"id": "d", "text": "That the ocean freight has been paid and the B/L can now be issued", "fb": "Payment is a commercial matter, not a gate event."}], "explain": "The gate-in EIR records time and condition at custody transfer: it stops export detention and anchors any damage claim."}, "3": {"prompt": "Clean EIR at depot gate-out, but a fresh dent is recorded on this gate-in EIR (merchant haulage). Who is usually charged for the repair?", "options": [{"id": "a", "correct": true, "text": "The merchant who held the box between the two interchanges"}, {"id": "b", "text": "The terminal, because the damage was found at its own gate", "fb": "The damage was recorded at the terminal's gate, before it took charge."}, {"id": "c", "text": "The carrier, which absorbs small dents as normal wear and tear", "fb": "Possible commercially, but the tariff normally allows a recharge."}, {"id": "d", "text": "The buyer, under any Incoterm, as the final owner of the cargo", "fb": "Equipment damage follows the equipment interchange terms, not the Incoterm."}], "explain": "Two EIRs bracket the period of custody; damage between them is recharged per the carrier's equipment terms. [TO VERIFY:v71]"}}}}, "dossier": {"documents": ["**Gate-in EIR** — time, seal, condition, VGM status. [TO VERIFY:v60]", "**Load list** — boxes cleared for the vessel (VGM, customs, booking).", "**Bay plan (BAPLIE)** — where every box goes. [TO VERIFY:v61]", {"text": "**DG manifest** — dangerous goods on board, for the master and ports. [TO VERIFY:v59]", "when": {"family": ["tank"]}}], "costs": ["**Origin THC** — terminal handling, per tariff or contract. [TO VERIFY:v35]", "**Storage / demurrage** beyond free time in the terminal. [TO VERIFY:v12]", {"text": "**Reefer plug-in / monitoring** charges at some terminals. [TO VERIFY:v57]", "when": {"family": ["reefer"]}}, "**Late-gate fee** if accepted after the cut-off. [TO VERIFY:v12]"], "risks": ["**Customs hold** → box can't be loaded; rolled if not released.", "**Missing VGM** → not on the load list. [TO VERIFY:v01]", "**Damage at gate** → claims and repair recharges.", "**Replanning** after late bookings or wrong weights."], "jobs": ["**Terminal operations liaison** — gate issues, holds, load list.", "**Vessel / stowage planning** — central planners and terminal planners. [TO VERIFY:v61]", "**Customer service** — informing customers of holds and rollings.", "**Equipment (M&R)** — damage reports and recharges."]}, "incoNote": {"_by": "incoterm", "FCA": "Under FCA (terminal), this is the delivery point: risk and cost passed to the buyer on arrival here, ready for unloading. [TO VERIFY:v14]", "CPT": "Under CPT, risk passes on handover to the carrier here, though the seller pays carriage to destination.", "CIP": "Under CIP, risk passes on handover to the carrier here; the seller pays carriage and insurance to destination.", "FAS": "Under FAS, 'alongside' is effectively the terminal for containers — a poor fit; FCA is the right rule. [TO VERIFY:v15]", "FOB": "Under FOB, the seller has lost physical control here but keeps the risk until on board — the classic container gap. [TO VERIFY:v15]", "*": ""}, "keyPoints": {"1": ["At the terminal gate, number, seal and condition are checked and a receipt is issued.", "Boxes wait in the yard; reefers are plugged in, dangerous goods are kept apart.", "Planners decide where every box goes on the ship."], "2": ["Gate-in = custody transfer and evidence point; export detention stops here (per tariff).", "Yard planning groups boxes by vessel, port and weight; special cargo has its own areas.", "The stowage plan needs correct VGMs, DG data and reefer details; only cleared boxes load."], "3": ["Holds must be escalated immediately: broker, shipper, customer — before the load list closes.", "Two EIRs bracket custody: they decide who pays for damage.", "Under FOB/CFR/CIF the seller still carries the risk here — prefer FCA/CPT/CIP for containers."]}, "question": {"1": {"prompt": "I'm stacked in the yard and my place on the ship is planned. What happens next?", "hint": "My ship is about to arrive at the quay.", "options": [{"id": "a", "correct": true, "text": "When my ship arrives, a giant crane lifts me on board.", "confirm": "Yes! A quay crane lifts me from a terminal truck onto the ship, following the plan. Under {incoterm}, risk passes to the buyer at step {riskStep}."}, {"id": "b", "text": "A truck takes me straight to the customer at destination.", "why": "I haven't crossed the ocean yet!", "realLife": "Delivery happens weeks later, after the voyage and import customs.", "whenRight": "That's step 10."}, {"id": "c", "text": "I go back to the seller's warehouse to be checked again.", "why": "I was already checked at the gate. Going back would make me miss my ship.", "realLife": "An extra trip, extra costs and a missed sailing.", "whenRight": "Only if the shipper had to fix a real problem (e.g. damaged cargo)."}]}, "2": {"prompt": "Box in the export yard, VGM received, customs released, stowage planned. What happens next?", "options": [{"id": "a", "correct": true, "text": "The vessel berths; quay cranes load the load-list boxes in planned sequence; lashing follows.", "confirm": "Correct. Only boxes on the load list — VGM, customs release, booking — are loaded, in the terminal's crane sequence. [TO VERIFY:v61]"}, {"id": "b", "text": "The shipped-on-board B/L is issued at once, now that the box is safely stacked in the yard.", "why": "'Shipped on board' needs the box to be on board.", "realLife": "An early on-board B/L is a false statement.", "whenRight": "After loading (step 6). [TO VERIFY:v50]"}, {"id": "c", "text": "The box goes to a container freight station (CFS) for a final check of its contents first.", "why": "FCL boxes stay sealed; CFS handling is for LCL.", "realLife": "Opening an FCL box without reason breaks the seal chain.", "whenRight": "Only if customs orders an inspection."}, {"id": "d", "text": "Boxes are loaded in the order they arrived at the terminal: first in, first loaded on board.", "why": "Loading follows the stowage plan, not arrival order.", "realLife": "Random loading would ruin stability and discharge planning.", "whenRight": "Never."}]}, "3": {"prompt": "Case: your box shows 'CUSTOMS HOLD — documentary check' 12 hours before vessel arrival. What do you do?", "options": [{"id": "a", "correct": true, "text": "Get the customer and broker to supply the documents now; track the hold; warn of a roll if not cleared.", "confirm": "Right. Only the declarant can clear a customs hold; the carrier's role is fast communication and contingency (rolling). A held box is never loaded. [TO VERIFY:v45]"}, {"id": "b", "text": "Ask the terminal to load the box anyway: a documentary hold does not stop the physical loading.", "why": "A hold is a hold: terminals don't load held boxes.", "realLife": "Loading would breach customs rules — fines for terminal and carrier.", "whenRight": "Never."}, {"id": "c", "text": "Wait and do nothing: documentary holds are usually lifted automatically, well before the vessel arrives.", "why": "Documentary checks need documents from the declarant.", "realLife": "The box misses the vessel and the customer hears it too late.", "whenRight": "Never as a strategy."}, {"id": "d", "text": "Contact customs yourself and send them the commercial invoice you have on file for this shipment.", "why": "The carrier isn't the declarant and may not hold the right documents.", "realLife": "Customs deals with the declarant; unofficial documents can make things worse.", "whenRight": "Only if your company acts as customs broker under a mandate."}]}}}, {"id": 6, "short": "Loading", "title": "Loading & vessel departure", "scene": "loading", "sceneDesc": "A container ship arrives at the quay. A terminal truck brings the container under a giant quay crane, which lifts it on board. Lashers secure the stack and the ship sails.", "beats": [{"id": "berth", "ms": 2800, "narration": {"1": "My ship {vessel} arrives at the quay. A terminal truck brings me under a giant [[quay-crane|quay crane]].", "2": "{vessel} berths in its window; terminal tractors bring boxes from the yard in the crane sequence built from the stowage plan. [TO VERIFY:v61]", "3": "Berth window and crane intensity are agreed between carrier and terminal; a late vessel compresses the window and can leave boxes behind ('cut and run'). [TO VERIFY:v61]"}}, {"id": "load", "ms": 2700, "narration": {"1": "Up I go! The crane lifts me high and places me exactly where the plan says.", "2": "Loading: the crane driver places the box in its planned slot; the terminal tallies every move and updates the bay plan. [TO VERIFY:v62]", "3": "Discrepancies (box loaded in wrong slot, overstow) are fixed or recorded; the final BAPLIE goes to the carrier and the next ports. [TO VERIFY:v61]"}}, {"id": "lash", "ms": 1800, "narration": {"1": {"_by": "family", "reefer": "Workers fix me with steel bars and plug me into the ship's electricity, so I stay cold.", "*": "Workers secure me with steel bars and locks, so I don't move when the sea gets rough."}, "2": {"_by": "family", "reefer": "[[lashing|Lashing]] by terminal lashers; the reefer is plugged into a ship's socket and checked. [TO VERIFY:v57]", "tank": "Lashing, and DG stowage checked against the IMDG segregation and the DG manifest. [TO VERIFY:v59]", "oog": "Special lashing for OOG cargo, often on top of the stack or in dedicated slots. [TO VERIFY:v58]", "*": "[[lashing|Lashing]] with twistlocks, bars and turnbuckles by terminal lashers, per the ship's lashing plan. [TO VERIFY:v62]"}, "3": "Lashing forces depend on stack weight distribution — another reason VGMs and correct stowage matter. Inadequate lashing is a known factor in container losses. [TO VERIFY:v77]"}}, {"id": "docs", "ms": 1600, "narration": {"1": "The ship sails! Now that I'm on board, the carrier can issue the [[bl|Bill of Lading]] saying I'm 'shipped on board'.", "2": "After loading, documentation issues the shipped-on-board B/L (or annotates a received B/L) and finalises the [[manifest]]. [TO VERIFY:v50]", "3": "On-board date and vessel must be true: they're checked against L/C terms. Freight prepaid originals are often released only after payment. [TO VERIFY:v33] [TO VERIFY:v50]"}}, {"id": "incident", "levels": [3], "kind": "incident", "narration": {"3": "The day after sailing, the shipper asks to correct the consignee's name, misspelled on the B/L. The three originals were already issued and couriered to the shipper's bank."}}], "fact": {"beat": "load", "text": {"1": "A quay crane can move a container every one to two minutes. [TO VERIFY:v62]", "2": "Each quay crane typically makes about 25–35 moves per hour; big ships work several cranes at once. [TO VERIFY:v62]"}}, "hotspots": [{"id": "crane", "beat": "berth", "essential": [1], "x": 125, "y": 26, "label": "Quay crane", "kind": "Equipment", "body": {"1": "The giant crane that lifts containers between the quay and the ship.", "2": "Ship-to-shore (STS) cranes reach across 20+ container rows on the largest ships; productivity drives berth time and cost. [TO VERIFY:v62]"}}, {"id": "vessel", "beat": "berth", "x": 880, "y": 390, "label": "Vessel", "kind": "Stakeholder", "body": {"1": "{vessel} — a container ship sailing from {pol} to {pod}.", "2": "Ship sizes depend on the lane: ultra-large ships on Asia–North Europe, smaller ones on lanes with shallower ports or canals. [TO VERIFY:v11] [TO VERIFY:v64]"}}, {"id": "lashing", "beat": "lash", "essential": [2, 3], "x": 556, "y": 250, "label": {"1": "Lashing", "2": "Lashing"}, "kind": "Safety", "body": {"1": "Steel bars and locks keep stacked containers in place during the voyage.", "2": "Twistlocks between tiers, lashing bars and turnbuckles; responsibility for lashing lies with the ship/terminal, but cargo inside the box is the shipper's (SLAC). [TO VERIFY:v62]", "3": "Losses at sea are rare relative to volumes but occur in heavy weather, often with misdeclared weights or lashing failures. [TO VERIFY:v77]"}}, {"id": "reeferplug", ight** — prepaid now, or collect at destination ({freightTerms}).", "**B/L amendment fee** after issuance. [TO VERIFY:v12]", "**Courier** for originals."], "risks": ["**Cut and run** — a late vessel sails without some boxes.", "**B/L errors** after issuance → recall originals, amendment fee, L/C problems.", "**Lashing failure** in heavy weather → cargo loss. [TO VERIFY:v77]", "**Antedated B/L** → fraud exposure, loss of carrier defences."], "jobs": ["**Vessel operations** — berth windows, port calls, ETA updates.", "**Documentation** — B/L issuance, amendments, manifest.", "**Finance / credit control** — prepaid freight before release of originals. [TO VERIFY:v33]", "**Customer service** — departure confirmation to customers."]}, "incoNote": {"_by": "group", "C": "Under C-rules the risk passes here, on board — but the seller keeps paying costs to destination.", "*": ""}, "keyPoints": {"1": ["A quay crane loads me onto the ship following the plan.", "Lashing keeps the stacks in place during the voyage.", "Once I'm on board, the carrier issues the Bill of Lading."], "2": ["Only boxes on the load list are loaded, in the planned crane sequence.", "Lashing and stowage are the ship's job; cargo securing inside the box is the shipper's.", "The shipped-on-board B/L proves loading on a named vessel and date."], "3": ["B/L dates and vessels must be true — L/C problems are solved commercially, never by antedating.", "Amending an issued negotiable B/L requires the full set of originals back.", "Under FOB/CFR/CIF, risk passes on board here."]}, "question": {"1": {"prompt": "I'm on board and the ship has sailed. What happens next?", "hint": {"_by": "transship", "yes": "My first ship is a small one — I'll change ship on the way.", "*": "There's a whole ocean between me and {pod}."}, "options": [{"id": "a", "correct": true, "text": {"_by": "transship", "yes": "I sail to {hub}, change ship there, then cross to {pod}.", "*": "I cross the whole ocean to {pod}, a trip of several weeks."}, "confirm": {"_by": "transship", "yes": "Exactly. A feeder takes me to {hub}, where I'm transshipped onto a big mainline ship to {pod}.", "*": "Exactly. The voyage takes {transit}; the carrier tracks the ship and updates the arrival date."}}, {"id": "b", "text": "The ship drops me off at the customer's door the very next day.", "why": "The ship has an ocean to cross first.", "realLife": "Even the fastest services take weeks between continents.", "whenRight": "Short-sea or domestic services can take a day or two — not this route."}, {"id": "c", "text": "I'm unloaded at the next port on the way and checked there.", "why": "Ships call at several ports, but I stay on board until my port of discharge (unless transshipped).", "realLife": "Boxes not due at a port stay on board; unloading the wrong box costs a lot.", "whenRight": "Only for boxes destined for that port."}]}, "2": {"prompt": "{vessel} has sailed with the box on board; B/L issued. What happens next?", "options": [{"id": "a", "correct": true, "text": {"_by": "transship", "yes": "Feeder to {hub}, transshipment onto the mainline vessel, then the long-haul leg to {pod}.", "*": "Ocean voyage to {pod}; the carrier tracks the vessel and sends the arrival notice in time."}, "confirm": {"_by": "transship", "yes": "Correct. At the hub the box is discharged, stacked and reloaded onto {vessel}; missed connections are the main risk. [TO VERIFY:v73]", "*": "Correct. Transit depends on routing (Suez, Cape, Panama) and port rotation. [TO VERIFY:v10] [TO VERIFY:v63]"}}, {"id": "b", "text": "The consignee lodges the import declaration on board, as soon as the vessel has sailed.", "why": "Import declarations are lodged with destination customs, typically when the goods arrive or shortly before.", "realLife": "Early lodging is possible in some regimes, but nothing is done 'on board'.", "whenRight": "Pre-arrival lodging exists in some regimes. [TO VERIFY:v67]"}, {"id": "c", "text": "The original B/L is surrendered to the carrier at departure, so that the release can be prepared early.", "why": "Originals go to the shipper (and banks) and are surrendered at destination to get release.", "realLife": "Surrendering at origin = express (telex) release, a deliberate choice.", "whenRight": "When the shipper chooses express release, originals are surrendered at origin."}, {"id": "d", "text": "The ENS for destination customs is filed now, as the vessel has actually left the port.", "why": "For deep-sea containers, the ENS is due before loading at origin.", "realLife": "Filing after loading would already have triggered problems. [TO VERIFY:v23]", "whenRight": "Other transport modes have different deadlines."}]}, "3": {"prompt": "Case: the consignee's name is misspelled on an issued B/L; the 3/3 originals are already at the bank. What is the correct procedure?", "options": [{"id": "a", "correct": true, "text": "Retrieve all 3/3 originals, cancel them and reissue a corrected set; update manifest and filings.", "confirm": "Right. A negotiable B/L can only be amended against surrender of the full set, otherwise two valid documents would circulate. Manifest/ICS2 data must be corrected too. [TO VERIFY:v12] [TO VERIFY:v68]"}, {"id": "b", "text": "Issue a corrected set of originals now, and tell the bank in writing that the first set no longer counts.", "why": "Two valid negotiable sets would circulate.", "realLife": "Risk of double claims and misdelivery.", "whenRight": "Never while the original set is outstanding."}, {"id": "c", "text": "Correct only the manifest and the advance filings, and leave the issued original B/L set as it is.", "why": "B/L and manifest must match, and the bank will see the error.", "realLife": "Release problems at destination and L/C discrepancies.", "whenRight": "Only for data that isn't on the B/L."}, {"id": "d", "text": "Send the bank a signed carrier letter stating that the consignee's name on the B/L is misspelled.", "why": "A letter doesn't change a document of title.", "r
