ared for the consignee and notify party. [TO VERIFY:v66]", {"text": "**Reefer temperature log** — downloaded on request or for claims. [TO VERIFY:v57]", "when": {"family": ["reefer"]}}, {"text": "**Transshipment re-planning** at {hub}.", "when": {"transship": true}}], "costs": ["**BAF / emergency surcharges** when routing or fuel changes. [TO VERIFY:v35]", "**Canal-related surcharges** at some carriers. [TO VERIFY:v35]", {"text": "**Transshipment** is included in the freight — no extra charge to the customer by default.", "when": {"transship": true}}, "**General average contributions** after major incidents. [TO VERIFY:v76]"], "risks": ["**Delays** → missed delivery windows and connections.", "**Routing changes** (Suez/Cape) → +10 days or more. [TO VERIFY:v63]", "**Temperature excursion** (reefers) → cargo claims. [TO VERIFY:v57]", "**Incidents at sea** → general average, delays, cargo loss. [TO VERIFY:v76]"], "jobs": ["**Network & vessel operations** — schedules, routing, port calls.", "**Transshipment / hub planning** — connections.", "**Reefer management** — remote monitoring.", "**Customer service** — ETA updates; **Claims** — incidents at sea."]}, "incoNote": {"_by": "group", "C": "Under C-rules, the buyer carries the risk during the voyage although the seller paid the freight — insurance matters (CIF/CIP). [TO VERIFY:v18]", "F": "Under F-rules, the buyer contracted this carriage and carries the voyage risk.", "E": "Under EXW, the buyer carries the voyage risk.", "D": "Under D-rules, the seller still carries the risk during the voyage."}, "keyPoints": {"1": ["The ocean voyage takes weeks; the route depends on canals and safety.", "On some routes, the box changes ship at a hub: that's transshipment.", "Reefers are monitored all the way; the customer is told before arrival."], "2": ["Transit times are indicative and depend on routing (Suez, Cape, Panama). [TO VERIFY:v63]", "Transshipment adds a hub dwell and a connection risk.", "The arrival notice and import manifest are sent before arrival."], "3": ["Missed connections: re-protect the box and update ETAs fast; check delivery commitments.", "General average makes cargo owners provide security before delivery — insurance matters.", "Routing changes drive surcharges and ripple through equipment and schedules."]}, "question": {"1": {"prompt": "The ship is approaching {pod}. What happens next?", "hint": "I'm still on the ship. How do I get onto the quay?", "options": [{"id": "a", "correct": true, "text": "The ship berths, and a big crane lifts me down onto the quay.", "confirm": "Yes! At {pod}, a quay crane discharges me and I go to the import yard."}, {"id": "b", "text": "A truck drives up a ramp onto the ship to pick me up there.", "why": "Container ships are worked by cranes, not trucks driving on board.", "realLife": "Only roll-on/roll-off ships carry trucks on board.", "whenRight": "On ro-ro ships (cars, trailers) — a different kind of shipping."}, {"id": "c", "text": "The ship sails up the river and drops me at the customer's door.", "why": "I have to be unloaded and cleared by customs first.", "realLife": "No box leaves the terminal without customs and carrier release.", "whenRight": "That's step 10."}]}, "2": {"prompt": "{vessel} is approaching {pod}. What happens next?", "options": [{"id": "a", "correct": true, "text": "Berthing and discharge; import yard while customs risk-assesses and the consignee prepares clearance.", "confirm": "Correct. Discharge follows the discharge list; customs has already risk-assessed the ENS and manifest. [TO VERIFY:v67]"}, {"id": "b", "text": "The box goes straight from the ship's side onto the consignee's truck, with no yard stay at all.", "why": "Import boxes go to the yard; customs and carrier releases come first.", "realLife": "Direct delivery is exceptional and needs prior clearance.", "whenRight": "Special cargo with pre-arranged clearance."}, {"id": "c", "text": "Customs clears the goods automatically at discharge, without any import declaration being lodged.", "why": "Goods need an import declaration (or another customs procedure) to enter free circulation.", "realLife": "Undeclared goods stay in temporary storage, then face penalties.", "whenRight": "Transit or transshipment procedures follow different rules."}, {"id": "d", "text": "The box is transshipped again at {pod} onto a feeder before it may be handed over to the consignee.", "why": "{pod} is the final port of discharge in this booking.", "realLife": "Extra transshipment would add time and cost not booked.", "whenRight": "When the booking's final port is a feeder port beyond the hub."}]}, "3": {"_by": "transship", "yes": {"prompt": "Case: the box missed its mainline connection at {hub}; next sailing in 7 days; DAP delivery deadline at risk. What do you do?", "options": [{"id": "a", "correct": true, "text": "Tell the customer the new ETA now, seek faster re-protection (other service or slot), log the cause.", "confirm": "Right. Re-protection options depend on network and slot agreements; transparent, early ETA updates let the seller (DAP) manage its buyer and costs. [TO VERIFY:v73]"}, {"id": "b", "text": "Wait quietly for the next mainline sailing; the ETA will update itself in the tracking system anyway.", "why": "The customer loses the chance to adapt.", "realLife": "Contract penalties and a damaged relationship.", "whenRight": "Never."}, {"id": "c", "text": "Ask the customer to pay a new ocean freight for the next sailing, since the connection was missed.", "why": "The booked freight covers carriage to {pod}, including the connection.", "realLife": "Charging again would breach the contract of carriage.", "whenRight": "Only if the customer asks for a premium service."}, {"id": "d", "text": "Truck the box from {hub} to Europe on a land bridge, to save the seven days lost at the hub.", "why": "There's no practical road link; it's not an option.", "realLife": "Not feasible.", "whenRight": "Never on this lane."}]}, "*": {"prompt": "Case: fire in a hold, general average declared; your customer's cargo is undamaged. What must the consignee do to obtain delivery?", "options": [{"id": "a", "correct": true, "text": "Provide general average security — usually a GA bond plus an insurer's guarantee — before release.", "confirm": "Right. All cargo interests contribute to GA, even undamaged ones. Insured cargo: the insurer provides the guarantee; uninsured cargo may need a cash deposit. [TO VERIFY:v76]"}, {"id": "b", "text": "Nothing: undamaged cargo is not affected by general average and is released as soon as it lands.", "why": "GA is shared by all interests in proportion to value, damaged or not.", "realLife": "Release is withheld until security is provided.", "whenRight": "Never under a GA declaration."}, {"id": "c", "text": "Pay the full cost of the fire and the repairs to the vessel, then claim them back from the shipper.", "why": "GA is shared proportionally among ship and all cargo.", "realLife": "Each interest pays its share after adjustment, which can take years.", "whenRight": "Never."}, {"id": "d", "text": "Present a new set of original B/Ls issued after the fire, since the old set is void under GA rules.", "why": "The B/L doesn't change; security is what's required.", "realLife": "Release depends on GA security plus the usual release conditions.", "whenRight": "Never."}]}}}}, {"id": 8, "short": "Discharge", "title": "Discharge at the port of destination", "scene": "discharge", "sceneDesc": "The ship arrives at the destination quay. A quay crane lifts the container off the ship onto a terminal truck, which takes it to the import yard.", "beats": [{"id": "arrive", "ms": 3300, "narration": {"1": "Welcome to {pod}! My ship berths at {podTerminal}.", "2": "{vessel} berths at {podTerminal}. The discharge list tells the terminal which boxes come off here. [TO VERIFY:v61]", "3": "Discharge planning from the BAPLIE and import manifest; customs has risk-assessed the cargo data, and some boxes may already be flagged for inspection. [TO VERIFY:v67]"}}, {"id": "discharge", "ms": 2600, "narration": {"1": "A crane lifts me off the ship and puts me down on a terminal truck.", "2": "Discharge by quay crane; lashings removed first. Damage found at discharge is recorded — key for claims. [TO VERIFY:v62]", "3": "Discharge and damage survey; seal checked against the manifest. A seal discrepancy here triggers investigation and possibly a customs hold."}}, {"id": "yard", "ms": 2400, "narration": {"1": {"_by": "family", "reefer": "I'm taken to the import yard and plugged in again. The customer has been told I've arrived.", "*": "I'm taken to the import [[yard]] to wait for my paperwork. The customer has been told I've arrived."}, "2": "Import yard. The [[arrival-notice]] went to the consignee and notify party: charges due, free time and release conditions. The [[demurrage]] free time starts at discharge. [TO VERIFY:v66]", "3": "Import dwell: demurrage/storage free time running; customs selection (scan, physical) adds moves and days. Combined D&D tariffs may apply. [TO VERIFY:v21] [TO VERIFY:v66]"}}, {"id": "incident", "levels": [3], "kind": "incident", "narration": {"3": "Customs selects the box for a scan and physical inspection: 3 extra days. Demurrage free time ends tomorrow. The consignee asks the carrier to waive all demurrage 'because it's customs' fault'."}}], "fact": {"beat": "yard", "text": {"_by": "route", "GYE-ANR": {"1": "Antwerp-Bruges is one of Europe's largest container ports, and a major hub for fruit. [TO VERIFY:v74]", "2": "Antwerp-Bruges handles around 13 million TEU a year. [TO VERIFY:v74]"}, "*": {"1": "Le Havre is France's largest container port. [TO VERIFY:v74]", "2": "HAROPA (Le Havre, Rouen, Paris) handles around 3 million TEU a year, most of it at Le Havre. [TO VERIFY:v74]"}}}, "hotspots": [{"id": "crane", "beat": "discharge", "essential": [1], "x": 125, "y": 26, "label": "Discharge", "kind": "Operations", "body": {"1": "The crane lifts me off the ship. Workers check that I'm not damaged and that my seal is intact.", "2": "Discharge sequence follows the bay plan; damage and seal checks are recorded. [TO VERIFY:v62]"}}, {"id": "anl1", "beat": "yard", "levels": [1], "essential": [1], "x": 640, "y": 120, "label": "Arrival notice", "kind": "Document", "body": {"1": "A message from the carrier to the customer: 'Your container has arrived. Here is what you need to pay and do to collect it.'"}}, {"id": "an", "beat": "yard", "levels": [2, 3], "essential": [2, 3], "doc": {"2": "an", "3": "an"}, "x": 640, "y": 120, "label": "Arrival notice", "kind": "Document"}, {"id": "dem", "beat": "yard", "levels": [2, 3], "x": 820, "y": 330, "label": "Demurrage clock", "kind": "Charge", "body": {"2": "Import [[demurrage]] runs from discharge (or day after) until full gate-out, after the free time. Illustrative: {freeDays} days free, then {cur}40/day storage-type charges. [TO VERIFY:v21] [TO VERIFY:v12]", "3": "Customs inspections, missing originals or unpaid freight don't stop the clock unless the tariff or contract says so. [TO VERIFY:v72]"}}, {"id": "customs", "beat": "yard", "x": 560, "y": 200, "label": "Customs risk check", "kind": "Stakeholder", "body": {"1": "{importCustoms} check the data about me. Most containers are not opened.", "2": "Risk analysis on ENS and declarations; selected boxes are scanned or inspected, with moves and costs for the cargo side. [TO VERIFY:v67]"}}, {"id": "plug", "beat": "yard", "when": {"family": ["reefer"]}, "x": 420, "y": 120, "label": "Plugged again", "kind": "Equipment", "body": {"1": "Back on electricity so {cargo} stays at {setPoint}.", "2": "Reefer plugged in the import rack; plug-in and monitoring charges may apply after free time. [TO VERIFY:v57]"}}], "docs": {"an": {"title": "Arrival notice", "heading": "ARRIVAL NOTICE", "sub": "{pod} · fictional example", "stamp": "NOTICE", "rows": [{"label": "To", "value": "Consignee / notify party (fictional)"}, {"label": "B/L no.", "value": "{bookingNo}-01"}, {"label": "Vessel / ETA", "value": "{vessel} {voyage} · {eta}"}, {"label": "Container", "value": "{containerNo} · {boxCode} · {cargo}"}, {"label": "Charges due", "value": {"_by": "freight", "Buyer": "Ocean freight (collect) · destination THC · documentation fee", "*": "Destination THC · documentation fee (freight prepaid)"}, "zone": 1}, {"label": "Free time", "value": "Demurrage {freeDays} days from discharge (illustrative)", "zone": 2}, {"label": "Release requires", "value": "1 original B/L (or waybill / express release) · charges paid · customs release", "zone": 3}], "points": {"1": {"2": "Collect freight and destination charges must be paid (or covered by credit) before release. Charge names and amounts vary by carrier and port. [TO VERIFY:v35] [TO VERIFY:v66]"}, "2": {"2": "Free time per tariff or contract; after it, daily charges apply. [TO VERIFY:v21]"}, "3": {"2": "Carrier release (commercial) and customs release (legal) are two different things — both are needed. [TO VERIFY:v68]"}}, "check": {"2": {"prompt": "What does the consignee need to obtain release from the carrier?", "options": [{"id": "a", "correct": true, "text": "An original B/L (or waybill / express release) and the charges paid"}, {"id": "b", "text": "The VGM declaration and the gate-in receipt from the export terminal", "fb": "The VGM matters for loading at origin, not for release."}, {"id": "c", "text": "The booking confirmation and the arrival notice, printed and signed", "fb": "The booking is the shipper's contract document at origin."}, {"id": "d", "text": "The export declaration from origin, stamped by the exporter's customs", "fb": "Export clearance happened at origin."}], "explain": "Carrier release depends on the transport document and payment; customs release is needed in addition. [TO VERIFY:v68]"}, "3": {"prompt": "Freight is collect. The consignee pays destination THC but disputes the ocean freight amount. Can the carrier release?", "options": [{"id": "a", "correct": true, "text": "No: not until the collect freight is paid or secured; the dispute is handled separately"}, {"id": "b", "text": "Yes: THC is the only charge the terminal needs, so the carrier must release the box now", "fb": "Collect freight is part of what must be settled."}, {"id": "c", "text": "Yes, as long as the original B/L is presented, whatever is still owed on the freight", "fb": "The B/L is necessary but not sufficient when freight is collect."}, {"id": "d", "text": "Only customs can decide, because freight disputes block the import declaration too", "fb": "Payment conditions are a carrier matter."}], "explain": "Carriers usually hold cargo until collect freight is paid (lien rights depend on the B/L terms and law); disputes go to sales/credit. [TO VERIFY:v33]"}}}}, "dossier": {"documents": ["**Arrival notice** — charges, free time, release conditions. [TO VERIFY:v66]", "**Import manifest** — filed with {importCustoms}.", "**Discharge report** — damage and seal remarks.", {"text": "**Reefer download** on request. [TO VERIFY:v57]", "when": {"family": ["reefer"]}}], "costs": ["**Destination THC** and documentation fee. [TO VERIFY:v35]", "**Collect freight** when freight terms are collect.", "**Demurrage / storage** after free time. [TO VERIFY:v21]", "**Inspection costs** if customs selects the box. [TO VERIFY:v67]"], "risks": ["**Damage found at discharge** → survey and claims.", "**Customs selection** → extra days and moves.", "**Consignee not reachable** → box sits, demurrage builds.", "**Unpaid collect freight** → cargo held. [TO VERIFY:v33]"], "jobs": ["**Import customer service** — arrival notices, release questions.", "**Port / terminal operations** — discharge, yard, inspections.", "**Finance** — collect freight, destination charges.", "**D&D team** — demurrage invoicing and disputes. [TO VERIFY:v72]"]}, "incoNote": {"_by": "group", "C": "Under C-rules, the seller's costs end here at the destination port; destination charges depend on the contract of carriage.", "D": "Under D-rules, the seller still carries the risk and organises the next steps; import clearance is the buyer's (DAP/DPU) or the seller's (DDP).", "*": "Under {incoterm}, the buyer has carried the risk since step {riskStep}."}, "keyPoints": {"1": ["At {pod}, a crane unloads me and I wait in the import yard.", "The carrier sends an arrival notice to the customer.", "A free-time clock starts: waiting too long costs money."], "2": ["Discharge checks (damage, seal) are evidence for claims.", "The arrival notice sets charges, free time and release conditions.", "Import demurrage runs from discharge until gate-out, after free time."], "3": ["Customs inspections don't stop demurrage by default — check the tariff and contract.", "Collect freight must be settled before release.", "Waivers are commercial decisions, documented and approved."]}, "question": {"1": {"prompt": "I'm in the import yard. What happens next?", "hint": "Two organisations must say 'yes' before I can leave the port.", "options": [{"id": "a", "correct": true, "text": "Customs checks my papers, then the shipping line lets me go to the customer.", "confirm": "Exactly. Customs gives the legal green light; the carrier gives the commercial one (paperwork and payment). Under {incoterm}, import customs is the {importBy}'s job."}, {"id": "b", "text": "A truck takes me straight to the customer, with no papers or checks needed.", "why": "I can't leave the terminal without customs and carrier release.", "realLife": "The gate would refuse the truck.", "whenRight": "After release — that's step 10."}, {"id": "c", "text": "I go back on board and sail on to the next port, because I arrived too early.", "why": "{pod} is my destination.", "realLife": "Taking me back would cost a lot and delay the customer.", "whenRight": "Only if I was discharged by mistake."}]}, "2": {"prompt": "Box discharged at {pod}, arrival notice sent. What happens next?", "options": [{"id": "a", "correct": true, "text": "Import clearance by the broker; B/L surrender and charges paid; carrier and customs releases to the terminal.", "confirm": "Correct. Two releases are needed: customs (legal) and carrier (commercial). Under {incoterm}, import clearance: {importBy}. [TO VERIFY:v67] [TO VERIFY:v68]"}, {"id": "b", "text": "The terminal releases the box to any haulier who shows a copy of the arrival notice sent earlier.", "why": "The arrival notice is information, not a release.", "realLife": "Terminals only release against carrier and customs releases.", "whenRight": "Never."}, {"id": "c", "text": "With freight prepaid, the box is released straight away, without any document or customs release.", "why": "Prepaid freight doesn't replace the B/L, waybill or express release.", "realLife": "Releasing without the right document risks misdelivery.", "whenRight": "With a sea waybill or express release, no original is needed — but release is still controlled. [TO VERIFY:v68]"}, {"id": "d", "text": "The shipper presents its export declaration at {pod}, which then counts as the import clearance there too.", "why": "Export clearance was done at origin.", "realLife": "Destination customs need the import declaration.", "whenRight": "Never."}]}, "3": {"prompt": "Case: customs inspection adds 3 days; free time ends tomorrow; the consignee asks for a full demurrage waiver. What is the correct response?", "options": [{"id": "a", "correct": true, "text": "Demurrage runs per tariff, inspections included; give the daily rate, help clear, escalate any waiver.", "confirm": "Right. Customs delays are normally for cargo account; consistent application of the tariff and documented exceptions avoid disputes. Some regulators set billing rules. [TO VERIFY:v72]"}, {"id": "b", "text": "Waive everything at once: customs inspection delays are never the customer's fault or responsibility.", "why": "Waivers outside the tariff create inconsistency and revenue leakage.", "realLife": "Other customers will ask for the same.", "whenRight": "If the contract has a customs-inspection clause."}, {"id": "c", "text": "Stop the demurrage clock until customs finishes, then restart it with the free days still left.", "why": "Clock events are defined by the tariff, not by the situation.", "realLife": "An unauthorised stop is a billing error.", "whenRight": "If the tariff explicitly suspends free time for inspections."}, {"id": "d", "text": "Tell the consignee to ask customs to pay the demurrage, since the inspection caused the delay.", "why": "Customs doesn't pay carrier charges.", "realLife": "Unhelpful and damaging to the relationship.", "whenRight": "Never."}]}}}, {"id": 9, "short": "Import & release", "title": "Import formalities, customs clearance & release", "scene": "flow", "sceneDesc": "Four illustrated stations show what must happen before the container can leave the port: arrival notice, import declaration, Bill of Lading and payment, and release with a pick-up code.", "flow": {"strip": "Import demurrage free time: {freeDays} days from discharge (illustrative)", "stations": [{"beat": "notice", "icon": "mail", "title": "Arrival notice", "sub": "Carrier → Consignee"}, {"beat": "declare", "icon": "customs", "title": "Import declaration", "sub": "Broker → {importCustoms}"}, {"beat": "bl", "icon": "pay", "title": "B/L + payment", "sub": "Bank → Consignee → Carrier"}, {"beat": "release", "icon": "stamp", "title": "Release & pick-up code", "sub": "Carrier + customs → Terminal"}], "incident": {"station": 2, "text": "ORIGINALS MISSING"}}, "beats": [{"id": "notice", "ms": 1600, "narration": {"1": "The customer received my arrival notice. Now two 'yes' are needed: one from customs, one from the carrier.", "2": "Import starts with the arrival notice: charges, free time and release conditions. Two releases are needed — customs (legal) and carrier (commercial). [TO VERIFY:v66]", "3": "Release = customs release + carrier release (transport document, payment, holds) + terminal release (PIN or digital pick-up right). Any one missing blocks the gate-out. [TO VERIFY:v68]"}}, {"id": "declare", "ms": 2400, "narration": {"1": "A customs broker declares me to {importCustoms}: what's inside, its value and its origin. The importer pays duties and taxes.", "2": "The [[import-declaration]] (HS code, customs value, origin, preferential proofs) is lodged by the importer's broker; duties and import VAT are paid or deferred; [[eori]] required in the EU. [TO VERIFY:v67]", "3": "Customs value, classification and origin drive duties; risk-based selection may add a scan or physical exam. Under DDP the seller is the importer — check EU representation. [TO VERIFY:v26] [TO VERIFY:v67]"}, "caption": {"2": "Under {incoterm}, import clearance is done by the {importBy}."}}, {"id": "bl", "ms": 2400, "narration": {"1": "The customer gives the carrier an original Bill of Lading and pays what's due. It's like showing my ticket to pick up my luggage.", "2": "For a 'to order' B/L, the bank [[endorsement|endorses]] an original to the consignee, who surrenders it to the carrier with payment of collect freight and charges. Sea waybill or express release: no original needed. [TO VERIFY:v68]", "3": "The carrier checks the endorsement chain and that the presenter is the lawful holder; one original surrendered accomplishes the set. Delivery without original = misdelivery exposure. [TO VERIFY:v75]"}}, {"id": "release", "ms": 1800, "narration": {"1": "Customs says yes, the carrier says yes: I'm released! The terminal gets the message and a secret pick-up code is given to the truck company.", "2": "Customs release and carrier release reach the terminal (often via a port community system); the haulier gets a [[pin]] or digital pick-up right and books a slot. [TO VERIFY:v68]", "3": "Release data must match the collecting haulier; PIN security matters — cargo theft by fraudulent pick-up is a known risk, hence secure digital pick-up schemes. [TO VERIFY:v68]"}}, {"id": "incident", "levels": [3], "kind": "incident", "narration": {"3": "The originals are stuck at the buyer's bank because of an L/C discrepancy. Demurrage is running. The consignee asks you to release the box against a letter of indemnity ([[loi]])."}}], "fact": {"beat": "bl", "text": {"1": "Three original Bills of Lading are usually issued, but presenting just one is enough to collect the goods — the others then become void.", "2": "Delivering cargo without the original B/L is one of the most common causes of large claims against carriers. [TO VERIFY:v75]"}}, "hotspots": [{"id": "customs", "beat": "declare", "levels": [1], "essential": [1], "x": 364, "y": 236, "label": "Import customs", "kind": "Rule", "body": {"1": "Customs checks what I carry, collects duties and taxes, and makes sure nothing forbidden enters. Under {incoterm}, the {importBy} handles import customs."}}, {"id": "idec", "beat": "declare", "levels": [2, 3], "essential": [2, 3], "x": 364, "y": 236, "label": "Import declaration", "kind": "Document", "body": {"2": "Lodged by the importer or its broker with HS code, customs value, origin and supporting documents (invoice, packing list, certificate of origin). Duties and import VAT paid or deferred. [TO VERIFY:v67]", "3": "Wrong classification or value → penalties and post-clearance audits; preferential origin needs valid proofs. Under DDP, the seller is the importer of record. [TO VERIFY:v26]"}}, {"id": "carrier1", "beat": "release", "levels": [1], "essential": [1], "x": 828, "y": 236, "label": "Carrier release", "kind": "Rule", "body": {"1": "The carrier lets me go only when it has the right paper (or electronic release) and the charges are paid."}}, {"id": "obe", "beat": "bl", "levels": [2, 3], "essential": [2, 3], "doc": {"2": "obe", "3": "obe"}, "x": 596, "y": 236, "label": "Original B/L (endorsed)", "kind": "Document"}, {"id": "do", "beat": "release", "levels": [2, 3], "essential": [2, 3], "doc": {"2": "do", "3": "do"}, "x": 828, "y": 236, "label": "Release order", "kind": "Document"}, {"id": "waybill", "beat": "bl", "levels": [2, 3], "x": 596, "y": 66, "label": "No original?", "kind": "Document", "body": {"2": "With a [[sea-waybill]], the named consignee gets the cargo without an original. With [[telex-release|express release]], originals were surrendered at origin. eB/Ls transfer electronically. [TO VERIFY:v49]"}}], "docs": {"obe": {"title": "Original B/L — back (endorsements)", "heading": "BILL OF LADING — REVERSE", "sub": "Original 1 of 3 · fictional example", "stamp": "SURRENDERED", "rows": [{"label": "Front: consignee", "value": "To order of Demo Trade Bank"}, {"label": "Endorsement", "value": "Deliver to the order of Demo Import SAS — signed for Demo Trade Bank", "zone": 1, "levels": [2]}, {"label": "Endorsement", "value": "Deliver to the order of Demo Import SAS — signed for Demo Import SAS", "zone": 1, "error": true, "levels": [3]}, {"label": "Presented by", "value": "Demo Import SAS", "zone": 2}, {"label": "Set", "value": "1 of 3 surrendered · others void", "zone": 3}, {"label": "Freight", "value": "{freightTerms}"}], "points": {"1": {"2": "The bank named as consignee transfers its right to the importer by endorsing the back.", "3": "The endorsement must come from the current holder named on the B/L — here the bank."}, "2": {"2": "The presenter must be the lawful holder after the endorsement chain."}, "3": {"2": "One original accomplishes the set; the carrier marks the others void in its system. [TO VERIFY:v68]"}}, "check": {"2": {"prompt": "Who must endorse this 'to order of Demo Trade Bank' B/L before the importer can surrender it?", "options": [{"id": "a", "correct": true, "text": "The bank (Demo Trade Bank), on the back of the B/L"}, {"id": "b", "text": "The shipper, on the front of the B/L, next to its name", "fb": "The shipper isn't the named party here — the bank is."}, {"id": "c", "text": "The carrier, which signed and issued the original B/L", "fb": "The carrier receives the B/L; it doesn't endorse it."}, {"id": "d", "text": "The notify party, which receives the arrival notice", "fb": "Being notify party gives no right to the goods."}], "explain": "A 'to order of [bank]' B/L is transferred by the bank's endorsement, typically once the importer has paid or accepted under the L/C."}, "3": {"type": "spot", "prompt": "One line makes this original unacceptable for release. Tap it.", "explain": "The importer endorsed the B/L to itself: only the bank, named on the front, can endorse it. Releasing on this original would expose the carrier to the bank's claim. [TO VERIFY:v75]"}}}, "do": {"title": "Release order", "heading": "RELEASE ORDER / DELIVERY ORDER", "sub": "{podTerminal} · fictional example", "stamp": "RELEASED", "rows": [{"label": "Container", "value": "{containerNo} · {boxCode}"}, {"label": "Released to", "value": "Haulier appointed by the consignee (fictional)"}, {"label": "Pick-up right", "value": "PIN ●●●●-7Q2 / digital pick-up token", "zone": 1}, {"label": "Customs", "value": "Released · import declaration accepted", "zone": 2}, {"label": "Free time", "value": "Demurrage ends Day +{freeDays} after discharge (illustrative)", "zone": 3}, {"label": "Empty return", "value": "Depot designated by the carrier"}], "points": {"1": {"2": "The terminal checks the pick-up right before releasing the box; in some ports secure digital systems replace PIN codes. [TO VERIFY:v68]"}, "2": {"2": "Without customs release, the box stays — even if the carrier has released it. [TO VERIFY:v67]"}, "3": {"2": "After demurrage free time, daily charges apply until gate-out; then import detention runs until the empty is returned. [TO VERIFY:v21]"}}, "check": {"2": {"prompt": "What does the haulier need at the terminal gate to collect the box?", "options": [{"id": "a", "correct": true, "text": "A valid pick-up right (PIN or digital token), customs release on the box, a slot if required"}, {"id": "b", "text": "The arrival notice printed out, signed by the consignee and stamped by the terminal office", "fb": "That's information for the consignee, not a pick-up right."}, {"id": "c", "text": "The original B/L, which the driver hands to the gate clerk together with the truck papers", "fb": "The B/L goes to the carrier, not to the gate."}, {"id": "d", "text": "The VGM certificate from origin, to prove the weight before the box goes on the road again", "fb": "Not needed for import collection."}], "explain": "The gate releases against the pick-up right and status flags (customs, carrier). [TO VERIFY:v68]"}, "3": {"prompt": "The PIN was e-mailed to three haulage companies 'to be safe'. A truck nobody ordered collects the box. What went wrong?", "options": [{"id": "a", "correct": true, "text": "PIN security: pick-up rights must go only to the appointed haulier, via secure release"}, {"id": "b", "text": "Nothing: any truck that shows a valid PIN at the gate is a legitimate collector of the box", "fb": "The PIN proves knowledge of a code, not authority."}, {"id": "c", "text": "Customs released the box too early, before the consignee had appointed its own haulier", "fb": "Customs release isn't the issue here."}, {"id": "d", "text": "The B/L wasn't endorsed by the bank, so the PIN was generated before the release was due", "fb": "The documents were fine; the pick-up right leaked."}], "explain": "Fraudulent pick-ups exploit shared codes; ports have introduced secure digital pick-up for this reason. [TO VERIFY:v68]"}}}}, "dossier": {"documents": ["**Import declaration** + supporting documents. [TO VERIFY:v67]", "**Original B/L** (endorsed), or sea waybill / express release / eB/L. [TO VERIFY:v68]", "**Release / delivery order** with PIN or digital pick-up right.", "**Customs release** message to the terminal."], "costs": ["**Duties and import VAT** — for the importer (the seller under DDP). [TO VERIFY:v26]", "**Collect freight, destination THC, documentation fee**. [TO VERIFY:v35]", "**Brokerage** and any **inspection** costs.", "**Demurrage** if release takes too long. [TO VERIFY:v21]"], "risks": ["**Originals late** (banks, courier) → demurrage.", "**Release without original** → misdelivery claim. [TO VERIFY:v75]", "**Fraudulent pick-up** with leaked PIN. [TO VERIFY:v68]", "**Wrong customs data** → penalties, post-clearance audit."], "jobs": ["**Import documentation / release desk** — B/L checks, releases.", "**Finance / credit control** — collect freight and charges.", "**Customs & compliance** — import filings, holds.", "**Legal / claims** — LOI policy, misdelivery claims. [TO VERIFY:v75]"]}, "incoNote": {"_by": "incoterm", "DDP": "Under DDP, the seller clears import and pays duties and VAT — it must be able to act as importer. [TO VERIFY:v26]", "*": "Under {incoterm}, import clearance, duties and taxes are for the buyer."}, "keyPoints": {"1": ["Customs must clear me and the importer pays duties and taxes.", "The carrier releases me against an original Bill of Lading (or an electronic release) and payment.", "Then the truck company gets a pick-up code."], "2": ["Two releases: customs (legal) and carrier (commercial); both reach the terminal.", "A 'to order' B/L needs the right endorsement; waybills and express releases avoid paper originals.", "Pick-up rights (PIN, digital) must be protected."], "3": ["Never release without the lawful original unless the LOI policy is applied and approved.", "Check endorsement chains — the named party endorses.", "Release fraud is real: use secure pick-up processes."]}, "question": {"1": {"prompt": "I'm released! What happens next?", "hint": "I'm still in the port. The customer's warehouse is inland.", "options": [{"id": "a", "correct": true, "text": "A truck, a train or a barge takes me from the port to the customer.", "confirm": "Yes! That's the on-carriage. Under {incoterm}, it's organised by {onBy}."}, {"id": "b", "text": "The customer comes to the port and unloads me right there on the quay.", "why": "Full containers usually travel to the customer's premises to be unloaded.", "realLife": "Terminals don't let customers unload boxes on the quay.", "whenRight": "LCL or port-side warehouses (CFS) — a different service."}, {"id": "c", "text": "I sail back to {pol} first, to show the seller that I arrived safely.", "why": "My cargo is for this customer — I don't need to go back.", "realLife": "That would cost a fortune and take weeks.", "whenRight": "Never in a normal shipment."}]}, "2": {"prompt": "Customs and carrier releases have reached the terminal. What happens next?", "options": [{"id": "a", "correct": true, "text": "On-carriage: the appointed haulier collects the box with the pick-up right; gate-out EIR; detention starts.", "confirm": "Correct. Gate-out ends demurrage; import detention runs until the empty is returned. Under {incoterm}, on-carriage is organised by {onBy}. [TO VERIFY:v21]"}, {"id": "b", "text": "The consignee sends staff to the terminal to unstuff the box there, in the import yard, before delivery.", "why": "FCL boxes are unstuffed at the consignee's premises.", "realLife": "Terminals don't offer that for FCL, except via a CFS service.", "whenRight": "CFS devanning for LCL."}, {"id": "c", "text": "The box must first go back to the origin depot to be inspected before it may be delivered to anyone.", "why": "The box delivers its cargo first; the empty is returned at destination.", "realLife": "Nonsense in practice.", "whenRight": "Never."}, {"id": "d", "text": "Customs escorts the box to the consignee's warehouse and breaks the seal on arrival, as for all imports.", "why": "Released goods move freely; escorts are exceptional.", "realLife": "Only for specific procedures (e.g. some transit or high-risk goods).", "whenRight": "Special customs procedures."}]}, "3": {"prompt": "Case: originals stuck at the bank; demurrage running; the consignee asks for release against an LOI. What do you do?", "options": [{"id": "a", "correct": true, "text": "Apply the LOI policy: usually decline, or bank-countersigned LOI approved by legal; demurrage still runs.", "confirm": "Right. Releasing without the original exposes the carrier to the lawful holder (here possibly the bank). A countersigned LOI reduces but doesn't remove the risk. [TO VERIFY:v75]"}, {"id": "b", "text": "Release at once against the consignee's own LOI: it is a good customer and the bank will follow anyway.", "why": "The original holder may still claim the goods.", "realLife": "Misdelivery claims can equal the full cargo value.", "whenRight": "Never without policy approval."}, {"id": "c", "text": "Release against a scanned copy of the original B/L, sent by the bank, to stop the demurrage now.", "why": "A copy doesn't transfer title.", "realLife": "Same exposure as releasing without anything.", "whenRight": "Never for a negotiable B/L."}, {"id": "d", "text": "Stop the demurrage clock until the bank releases the originals, then release the box against them.", "why": "Bank delays are a cargo-side matter under most tariffs.", "realLife": "Unauthorised waivers create billing disputes.", "whenRight": "Only if agreed commercially and documented."}]}}}, {"id": 10, "short": "Delivery", "title": "On-carriage & delivery to the consignee", "scene": "oncarriage", "sceneDesc": "A landscape from the destination terminal to the consignee's warehouse: road, river and railway. The chosen transport carries the container to the customer.", "beats": [{"id": "pickup", "ms": 1600, "narration": {"1": "A haulier collects me at {podTerminal} with the pick-up code. At the gate my condition is checked again. How will I travel?", "2": "Gate-out with the pick-up right; an [[eir]] records my condition. [[on-carriage|On-carriage]] can be [[merchant-haulage]] or [[carrier-haulage]]. Choose the mode. [TO VERIFY:v69]", "3": "Gate-out ends demurrage and starts import detention; under carrier haulage, the carrier books the slot and the delivery appointment. [TO VERIFY:v21] [TO VERIFY:v70]"}, "caption": {"2": "Under {incoterm}, on-carriage is organised by {onBy}."}}, {"id": "travel", "ms": 3200, "narration": {"1": {"_by": "onMode", "barge": "A barge carries me up the river to an inland terminal; there a crane lifts me onto a truck for the last few kilometres.", "rail": "A train carries me to an inland rail terminal near the customer; a crane lifts me onto a truck for the last kilometres — few warehouses have their own rail siding. [TO VERIFY:v99]", "*": "On the road to {dest}!"}, "2": {"_by": "onMode", "barge": "Barge to an inland river terminal, then last-mile trucking: cheaper per box over distance, more handlings. [TO VERIFY:v69] [TO VERIFY:v98]", "rail": "Rail shuttle to an inland rail terminal, then last-mile truck (the usual case: private sidings are rare); the detention clock keeps running. [TO VERIFY:v69] [TO VERIFY:v99]", "*": "Road delivery under a [[cmr]] consignment note; road limits apply (e.g. 44 t gross in France). [TO VERIFY:v13]"}, "3": "Inland legs share risks with pre-carriage: congestion, weight limits, missed slots. Under carrier haulage, the carrier answers for the inland leg under its B/L terms. [TO VERIFY:v43]"}, "caption": {"2": {"_by": "family", "reefer": "Genset on the road keeps {setPoint}. [TO VERIFY:v57]", "tank": "DG road rules apply (ADR in Europe). [TO VERIFY:v59]", "oog": "Oversize transport may need a permit or escort. [TO VERIFY:v58]", "*": "Import detention runs until the empty is returned. [TO VERIFY:v21]"}}}, {"id": "deliver", "ms": 2800, "narration": {"1": "Delivered! The customer checks my seal and signs a delivery receipt.", "2": "Delivery at {dest} on appointment; the consignee checks the seal and condition and signs the [[pod-proof|proof of delivery]], noting any reservations. [TO VERIFY:v70]", "3": "Reservations on the POD/CMR preserve claims; a 'clean' signature with visible damage or a wrong seal weakens the consignee's position. [TO VERIFY:v70]"}}, {"id": "incident", "levels": [3], "kind": "incident", "narration": {"3": "The consignee has no unloading slot for five days. Import detention free time ends in two days. The haulier asks what to do with the loaded container."}}], "fact": {"beat": "travel", "text": {"1": "One river barge can carry dozens of containers — taking many trucks off the road. [TO VERIFY:v69]", "2": "Port authorities push barge and rail to reduce road congestion and emissions; modal share targets are set by ports such as HAROPA and Antwerp-Bruges. [TO VERIFY:v69]"}}, "hotspots": [{"id": "onmode", "beat": "pickup", "essential": [1, 2, 3], "choice": "onMode", "x": 320, "y": 140, "label": "Transport mode", "kind": "Choice"}, {"id": "gateout", "beat": "pickup", "levels": [2, 3], "x": 120, "y": 150, "label": "Gate-out", "kind": "Operations", "body": {"2": "Gate-out EIR records condition; demurrage stops, import detention starts (or combined free time continues). [TO VERIFY:v21]"}}, {"id": "detention", "beat": "travel", "levels": [2, 3], "x": 600, "y": 150, "label": "Detention clock", "kind": "Charge", "body": {"2": "Import detention runs from full gate-out to empty return at the designated depot. Illustrative: {freeDays} days free. [TO VERIFY:v21] [TO VERIFY:v12]"}}, {"id": "pod1", "beat": "deliver", "levels": [1], "essential": [1], "x": 830, "y": 190, "label": "Delivery receipt", "kind": "Document", "body": {"1": "The customer checks that my seal is intact and that I'm not damaged, then signs the delivery receipt. Any problem must be written on it."}}, {"id": "pod", "beat": "deliver", "levels": [2, 3], "essential": [2, 3], "doc": {"2": "pod", "3": "pod"}, "x": 830, "y": 190, "label": "Proof of delivery", "kind": "Document"}], "docs": {"pod": {"title": "Proof of delivery (CMR)", "heading": "CMR CONSIGNMENT NOTE · POD", "sub": "Fictional example", "stamp": "DELIVERED", "rows": [{"label": "Sender", "value": "Haulier for the consignee, from {podTerminal}"}, {"label": "Consignee", "value": "Demo Import (fictional) · {dest}"}, {"label": "Container / seal", "value": "{containerNo} / {sealNo}", "zone": 1}, {"label": "Goods", "value": "{cargo}"}, {"label": "Delivered", "value": "Day +3, 10:40 · appointment kept"}, {"label": "Reservations", "value": "Seal intact · no visible damage", "zone": 2}, {"label": "Signature", "value": "<span class=\"sig\">M. Durand<\/span> · consignee", "zone": 3, "html": true}], "points": {"1": {"2": "The consignee compares the seal number with the B/L before opening the doors."}, "2": {"2": "Reservations (damage, seal mismatch, shortage) written here preserve the right to claim. [TO VERIFY:v70]"}, "3": {"2": "Signature, date and time close the transport contract for the road leg; the CMR governs international road carriage in Europe. [TO VERIFY:v70]"}}, "check": {"2": {"prompt": "Why must the consignee check the seal before signing?", "options": [{"id": "a", "correct": true, "text": "A seal problem noted on the POD keeps the right to claim; a clean signature weakens it"}, {"id": "b", "text": "To calculate the final VGM before the container is weighed again at the empty depot", "fb": "The VGM was for loading at origin."}, {"id": "c", "text": "Because customs requires the seal number on the POD before charging the import VAT", "fb": "This is about evidence, not VAT."}, {"id": "d", "text": "To start the demurrage clock at the terminal, which only stops at the consignee's site", "fb": "Demurrage already ended at gate-out."}], "explain": "Reservations on delivery documents are the first evidence in any cargo claim. [TO VERIFY:v70]"}, "3": {"prompt": "The seal on arrival is different from the B/L, and the consignee signs a clean POD. What's the consequence?", "options": [{"id": "a", "correct": true, "text": "The claim position is weakened; it should have noted a reservation and called a surveyor"}, {"id": "b", "text": "No consequence: the B/L already proves the seal number, so the claim is fully protected", "fb": "The B/L shows what was shipped; the POD shows what was accepted."}, {"id": "c", "text": "The carrier automatically pays for any shortage, since the seal differs from its B/L", "fb": "Liability depends on evidence and the applicable rules."}, {"id": "d", "text": "Customs must reopen the import clearance and re-inspect the cargo at the warehouse", "fb": "Not by default; it's a cargo-evidence issue."}], "explain": "A seal change may be legitimate (customs inspection) — but only documented reservations allow it to be investigated. [TO VERIFY:v70]"}}}}, "dossier": {"documents": ["**Release order / pick-up right** — PIN or digital. [TO VERIFY:v68]", "**Gate-out EIR** — condition at handover.", "**CMR / POD** — signed delivery with reservations. [TO VERIFY:v70]", "**Barge or rail consignment note** for intermodal legs."], "costs": ["**On-carriage** — carrier haulage tariff or merchant contract.", "**Import detention** after free time. [TO VERIFY:v21]", "**Waiting time** at the consignee beyond free unloading time. [TO VERIFY:v12]", "**Inland terminal handling** for barge/rail. [TO VERIFY:v40]"], "risks": ["**No delivery slot** → detention and waiting time.", "**Clean POD despite damage** → weak claim.", "**Overweight on the road** → fines, re-handling. [TO VERIFY:v13]", {"text": "**Genset failure** on the last mile → temperature excursion. [TO VERIFY:v57]", "when": {"family": ["reefer"]}}], "jobs": ["**Inland / intermodal operations** — carrier haulage at destination.", "**Import customer service** — delivery appointments.", "**D&D team** — detention invoicing.", "**Claims** — damage and shortage at delivery."]}, "incoNote": {"_by": "group", "D": "Under D-rules, the seller organises this leg; risk passes at the buyer's place (DAP/DDP: ready for unloading; DPU: once unloaded).", "*": "Under {incoterm}, the buyer organises and pays this leg."}, "keyPoints": {"1": ["A truck, train or barge takes me from the port to the customer.", "My condition is checked when I leave the port and when I arrive.", "The customer signs a delivery receipt and notes any problem."], "2": ["Gate-out ends demurrage; import detention runs until the empty is returned.", "Mode choice affects cost, time and handlings.", "Reservations on the POD/CMR preserve claims."], "3": ["Plan unloading slots before collecting the box — detention keeps running.", "Under carrier haulage, the carrier answers for the inland leg.", "Seal mismatches must be documented before unloading."]}, "question": {"1": {"prompt": "I'm at the customer's warehouse. What happens next?", "hint": "My job isn't over when I'm empty.", "options": [{"id": "a", "correct": true, "text": "The customer unloads me, then a truck takes me back, empty, to a depot.", "confirm": "Yes! Once unloaded, I go back to a depot chosen by the carrier, ready for my next trip."}, {"id": "b", "text": "The customer keeps me for good and uses me as a storage room behind the shop.", "why": "I belong to the carrier (or a leasing company).", "realLife": "Every extra day costs detention.", "whenRight": "If the customer buys or leases the container separately."}, {"id": "c", "text": "I sail straight back to {pol} still full, because the goods were not wanted.", "why": "I must be unloaded first.", "realLife": "Sending cargo back would be a new shipment.", "whenRight": "Only for a return shipment, with a new booking."}]}, "2": {"prompt": "Delivered, POD signed. What happens next?", "options": [{"id": "a", "correct": true, "text": "Unstuffing within free time, then empty return to the carrier's designated depot; detention stops at gate-in.", "confirm": "Correct. The designated return depot matters: returning elsewhere can mean extra charges. [TO VERIFY:v71]"}, {"id": "b", "text": "The empty stays with the consignee to reuse as it likes; the carrier only collects it at the next export booking.", "why": "Equipment belongs to the carrier and is managed by equipment control.", "realLife": "Detention builds daily.", "whenRight": "With a separate agreement (e.g. street turn or 'triangulation' approved by the carrier)."}, {"id": "c", "text": "The empty goes back to the import terminal by default, whatever the release order says about depots.", "why": "The return location is set by the carrier — often a depot, not the terminal.", "realLife": "Wrong location = refused or charged.", "whenRight": "When the carrier designates the terminal as return point."}, {"id": "d", "text": "The empty is shipped back to the origin depot in Asia at the consignee's cost, under a new booking.", "why": "Repositioning is the carrier's business.", "realLife": "The consignee's obligation ends at the designated return depot.", "whenRight": "Never for the consignee."}]}, "3": {"prompt": "Case: no unloading slot for five days; detention free time ends in two days. What do you advise?", "options": [{"id": "a", "correct": true, "text": "Warn of the detention exposure; offer options (drop the loaded box at a yard, or accept detention); record it.", "confirm": "Right. Detention follows the tariff; transparent options let the cargo side choose the cheapest path. Storage at the haulier's yard has its own costs and security implications. [TO VERIFY:v21] [TO VERIFY:v70]"}, {"id": "b", "text": "Return the loaded box to the import terminal: detention stops there, and its storage is free for five more days.", "why": "Re-entering the terminal triggers handling and storage, and detention rules may still apply.", "realLife": "Extra moves and fees, plus a second delivery trip.", "whenRight": "Rarely, if the terminal and carrier agree and it's cheaper."}, {"id": "c", "text": "Stop the detention clock until the consignee is ready, since the delay is caused by its unloading slot.", "why": "Clock events are defined by the tariff.", "realLife": "An unauthorised stop is a billing error.", "whenRight": "Only with a documented commercial agreement."}, {"id": "d", "text": "Unload the cargo at the haulier's depot without asking the consignee, to return the empty in time.", "why": "The consignee decides where its goods are unloaded.", "realLife": "Liability and insurance issues for the haulier.", "whenRight": "Only on the consignee's instruction."}]}}}, {"id": 11, "short": "Empty return", "title": "Unstuffing & empty return", "scene": "unstuff", "sceneDesc": "At the consignee's warehouse, the cargo is unloaded from the container. The empty container is then trucked to an empty depot, inspected at the gate and prepared for its next trip.", "beats": [{"id": "unstuff", "ms": 2800, "narration": {"1": {"_by": "family", "tank": "A hose empties my tank into the customer's storage. Then I need a special cleaning.", "oog": "A crane lifts {cargo} off me. Job done!", "*": "The customer's team unloads {cargo} — that's [[unstuffing]]. I'm empty again!"}, "2": {"_by": "family", "reefer": "Unstuffing straight into the cold store: the cold chain must hold until the doors close behind the cargo. [TO VERIFY:v56]", "tank": "Discharge into the consignee's tanks; residues must be handled per DG rules before the tank is cleaned. [TO VERIFY:v59]", "*": "[[unstuffing|Unstuffing]] within the consignee's free time; any damage or shortage is documented with photos before the box leaves. [TO VERIFY:v70]"}, "3": "Post-delivery: shortages and damage claims need notice within the applicable time limits; the box must be returned clean, emptied of dunnage and labels removed (DG placards too). [TO VERIFY:v71]"}}, {"id": "return", "ms": 2600, "narration": {"1": "A truck takes me, empty, to the depot chosen by the carrier.", "2": "Empty return to the depot designated in the release; returning elsewhere can be refused or charged. [TO VERIFY:v71]", "3": "Equipment control designates return depots by type and demand; empty repositioning is a major cost driven by trade imbalance. [TO VERIFY:v38]"}}, {"id": "gatein", "ms": 2600, "narration": {"1": "At the depot gate, someone checks me all around again and writes down my condition. My [[detention]] clock stops!", "2": "Empty gate-in [[eir]]: condition and cleanliness recorded; import detention stops. Damage beyond normal wear is recharged per tariff. [TO VERIFY:v71] [TO VERIFY:v21]", "3": {"_by": "family", "reefer": "Return EIR, wash and PTI before the next release; unit faults found at PTI may lead to recharges if caused by misuse. [TO VERIFY:v57] [TO VERIFY:v71]", "tank": "Tank cleaning at an approved station with a cleaning certificate before the next load. [TO VERIFY:v71]", "*": "Return EIR vs gate-out EIR decides damage recharges; M&R estimates follow repair standards. [TO VERIFY:v71]"}}}, {"id": "incident", "levels": [3], "kind": "incident", "narration": {"3": "The consignee disputes a {cur}650 damage recharge for a dent recorded on the return EIR. The gate-out EIR at the import terminal says 'no damage', but its photos are blurry."}}], "fact": {"beat": "gatein", "text": {"1": "After this trip, I may carry an export from Europe — or travel back to Asia empty, because more goods go east to west than west to east. [TO VERIFY:v38]", "2": "Empty repositioning costs the industry billions each year; equipment control tries to reuse import boxes for exports ('street turns') wherever possible. [TO VERIFY:v38]"}}, "hotspots": [{"id": "unstuff", "beat": "unstuff", "levels": [1], "essential": [1], "x": 560, "y": 250, "label": "Unloading", "kind": "Operations", "body": {"1": "The customer unloads me at its own warehouse. If anything is damaged or missing, it takes photos and tells the carrier quickly."}}, {"id": "claims", "beat": "unstuff", "levels": [2, 3], "x": 560, "y": 250, "label": "Damage & claims", "kind": "Rule", "body": {"2": "Damage or shortage must be noted on delivery documents and notified within the time limits of the applicable rules; photos and survey reports are key. [TO VERIFY:v70]", "3": "Carrier liability depends on the B/L terms and the applicable regime (e.g. Hague-Visby); the SLAC clause shifts packing issues to the shipper. [TO VERIFY:v50]"}}, {"id": "depot", "beat": "return", "x": 138, "y": 64, "label": "Return depot", "kind": "Stakeholder", "body": {"1": "The carrier chooses where I'm returned, so I can be cleaned, repaired and used again.", "2": "Designated by the carrier per type and location; returning to another depot may be refused or charged. [TO VERIFY:v71]"}}, {"id": "clean", "beat": "return", "when": {"family": ["reefer", "tank"]}, "x": 150, "y": 260, "label": {"_by": "family", "reefer": "Wash & PTI", "tank": "Tank cleaning"}, "kind": "Equipment", "body": {"_by": "family", "reefer": {"1": "Reefers are washed and their cooling machine tested before the next trip.", "2": "Washing and PTI before the next release; damage to the unit is checked. [TO VERIFY:v57]"}, "tank": {"1": "My tank is cleaned and a certificate proves it's ready for the next product.", "2": "Cleaning at an approved station with a cleaning certificate; residues of dangerous goods are handled under DG rules. [TO VERIFY:v59] [TO VERIFY:v71]"}}}, {"id": "eir1", "beat": "gatein", "levels": [1], "essential": [1], "x": 586, "y": 80, "label": "Return EIR", "kind": "Document", "body": {"1": "My condition report at return. If I'm damaged and the earlier report said I was fine, the customer may have to pay for the repair."}}, {"id": "reir", "beat": "gatein", "levels": [2, 3], "essential": [2, 3], "doc": {"2": "reir", "3": "reir"}, "x": 586, "y": 80, "label": "Return EIR", "kind": "Document"}, {"id": "stop", "beat": "gatein", "x": 782, "y": 196, "label": "Detention stops", "kind": "Charge", "body": {"1": "The clock stops when I'm back at the depot. If I came back late, the customer pays detention for the extra days.", "2": "Import detention ends at empty gate-in at the designated depot. Illustrative: {freeDays} free days, then {cur}80/day. [TO VERIFY:v21] [TO VERIFY:v12]"}}], "docs": {"reir": {"title": "Return EIR", "heading": "EIR — EMPTY RETURN", "sub": "Empty depot, {pod} · fictional example", "stamp": "GATE IN", "rows": [{"label": "Container", "value": "{containerNo} · {boxCode} · EMPTY"}, {"label": "Condition", "value": "Dent 30 cm, left side panel · photos 4", "zone": 1}, {"label": "Cleanliness", "value": {"_by": "family", "reefer": "Washed · PTI scheduled", "tank": "Cleaning certificate required", "*": "Swept clean · labels removed"}, "zone": 2}, {"label": "Returned", "value": "Day +6, 15:20", "zone": 3}, {"label": "Detention", "value": "{freeDays} days free · 6 used · no charge (illustrative)"}], "points": {"1": {"2": "Compared with the full gate-out EIR at the import terminal: damage that appeared in between is recharged per tariff. [TO VERIFY:v71]"}, "2": {"2": "Dirty boxes, leftover dunnage or old DG labels trigger cleaning fees. [TO VERIFY:v71]"}, "3": {"2": "Empty gate-in time stops import detention. [TO VERIFY:v21]"}}, "check": {"2": {"prompt": "What decides whether the consignee pays for the dent?", "options": [{"id": "a", "correct": true, "text": "Comparing this return EIR with the gate-out EIR at the import terminal"}, {"id": "b", "text": "The Incoterm agreed between the seller and the buyer in their contract", "fb": "Equipment damage follows the interchange terms, not the Incoterm."}, {"id": "c", "text": "The booking confirmation, which lists the damage limits for the box", "fb": "The booking doesn't record condition."}, {"id": "d", "text": "The arrival notice, which records the box's condition on discharge", "fb": "It lists charges, not condition."}], "explain": "Two EIRs bracket the custody period; damage recorded between them is recharged per the carrier's equipment terms. [TO VERIFY:v71]"}, "3": {"prompt": "The box was returned to a different depot, 30 km closer to the consignee. Likely outcome?", "options": [{"id": "a", "correct": true, "text": "Refused, or accepted with a wrong-depot charge; detention may run until an accepted depot"}, {"id": "b", "text": "Accepted with no consequence: all depots in the area work for every carrier the same way", "fb": "Depots are contracted and stocked per carrier needs."}, {"id": "c", "text": "The carrier pays the extra trip, since its depot list was not sent to the consignee in time", "fb": "The return location was part of the release terms."}, {"id": "d", "text": "Customs fines the consignee for moving an imported container to an undeclared place", "fb": "It's an equipment issue, not a customs one."}], "explain": "Return locations reflect equipment control's plan; deviations cost money. [TO VERIFY:v71]"}}}}, "dossier": {"documents": ["**Return EIR** — condition and time at empty gate-in. [TO VERIFY:v71]", "**Damage report / M&R estimate** if repairs are needed.", {"text": "**Cleaning certificate** — tanks. [TO VERIFY:v71]", "when": {"family": ["tank"]}}, {"text": "**PTI report** — reefers. [TO VERIFY:v57]", "when": {"family": ["reefer"]}}, "**Detention invoice** — if free time was exceeded. [TO VERIFY:v21]"], "costs": ["**Import detention** after free time. [TO VERIFY:v21]", "**Damage recharge** per tariff and repair standards. [TO VERIFY:v71]", "**Cleaning fee** for dirty boxes. [TO VERIFY:v71]", "**Wrong-depot charge** if returned elsewhere. [TO VERIFY:v71]"], "risks": ["**Late return** → detention.", "**Undocumented damage** → disputes. [TO VERIFY:v72]", "**Leftover DG labels or residues** → refusal or fees. [TO VERIFY:v59]", "**Box left idle** → equipment shortage elsewhere. [TO VERIFY:v38]"], "jobs": ["**Equipment control** — return depots, repositioning, street turns. [TO VERIFY:v38]", "**Depot / M&R management** — inspections, repairs, cleaning.", "**D&D team** — detention and damage invoicing, disputes. [TO VERIFY:v72]", "**Customer service** — return instructions."]}, "incoNote": {"_by": "incoterm", "DPU": "Under DPU, the seller unloads the goods: risk and cost pass to the buyer once they are unloaded here.", "*": "Empty return and detention follow the contract of carriage and the sales contract, not the Incoterm."}, "keyPoints": {"1": ["The customer unloads me and reports any damage quickly.", "I go back empty to a depot chosen by the carrier, where my condition is checked.", "My detention clock stops when I'm back — then I'm ready for a new journey."], "2": ["Unstuffing within free time; claims need documented evidence.", "Return to the designated depot; EIRs decide damage recharges.", "Equipment control reuses or repositions the empty — trade imbalance makes this costly."], "3": ["D&D and damage disputes are won or lost on evidence (EIRs, photos, timestamps).", "Bill per tariff consistently; waivers are documented commercial decisions.", "Street turns and smart return depots cut empty repositioning."]}, "question": {"1": {"prompt": "I'm empty and clean at the depot. What happens next?", "hint": "Containers are made to travel again and again.", "options": [{"id": "a", "correct": true, "text": "I'm used for a new trip, maybe an export from Europe, or sent where boxes are needed.", "confirm": "Yes! Equipment control gives me a new job. My journey starts again with a booking. Congratulations — you've followed me all the way!"}, {"id": "b", "text": "I'm taken to the scrapyard and melted down, because containers are used only once.", "why": "Containers are built to last many years and many trips.", "realLife": "A box typically serves for well over a decade.", "whenRight": "Only when it's too damaged or old to repair."}, {"id": "c", "text": "I stay at the depot and wait there until my very first shipper books me once again.", "why": "Any customer can use me; equipment control decides.", "realLife": "Idle boxes cost money and create shortages elsewhere.", "whenRight": "Never as a rule."}]}, "2": {"prompt": "Empty returned and inspected at the depot. What happens next?", "options": [{"id": "a", "correct": true, "text": "Equipment control allocates it: a new export booking in the region, or repositioning to a deficit area.", "confirm": "Correct. Reusing import boxes for exports avoids empty moves; the rest are repositioned where demand is. The journey loops back to step 1. [TO VERIFY:v38]"}, {"id": "b", "text": "The consignee now owns the box, since the freight is fully paid, and can sell it or reuse it as it wishes.", "why": "The carrier (or lessor) owns it.", "realLife": "Keeping it would mean detention, then a lost-box claim.", "whenRight": "Only if sold."}, {"id": "c", "text": "The importer must send it back to the origin terminal in Asia, empty, at its own cost and risk.", "why": "The consignee's obligation ends at the designated return depot.", "realLife": "Repositioning is the carrier's business.", "whenRight": "Never."}, {"id": "d", "text": "It waits at the depot for the original shipper to book again, as each box belongs to one shipper.", "why": "Containers are pooled and reused by any customer.", "realLife": "Idle equipment is waste.", "whenRight": "Never."}]}, "3": {"prompt": "Case: {cur}650 damage recharge disputed; gate-out EIR says 'no damage' but its photos are blurry. What is the right approach?", "options": [{"id": "a", "correct": true, "text": "Review both EIRs, photos and M&R estimate; if custody proof is weak, adjust or waive, and fix the photos.", "confirm": "Right. Recharges need evidence: two EIRs with usable photos and an approved repair estimate. Weak evidence loses disputes and customers; process fixes prevent repeats. [TO VERIFY:v71] [TO VERIFY:v72]"}, {"id": "b", "text": "Insist on full payment: the return EIR clearly shows the dent, and that is enough proof on its own.", "why": "The return EIR alone doesn't prove when the damage happened.", "realLife": "Disputes escalate; regulators or courts may side with the customer.", "whenRight": "When both EIRs clearly support it."}, {"id": "c", "text": "Waive the charge automatically to keep the customer happy, and say nothing to the terminal team.", "why": "Automatic waivers ignore valid recharges and set precedents.", "realLife": "Revenue leakage and inconsistent billing.", "whenRight": "When the evidence is genuinely insufficient — after review."}, {"id": "d", "text": "Charge the haulier instead, since its own driver signed the EIR when collecting the box at the import terminal.", "why": "The contractual counterparty for the recharge is the merchant who held the box.", "realLife": "The merchant may recover from its haulier, but that's their relationship.", "whenRight": "Under carrier haulage, the carrier may recover from its own subcontractor."}]}}}], "world": {"source": "Natural Earth 1:50m land (public domain), via world-atlas; projection Natural Earth (geoNaturalEarth1)", "scale": 420, "translate": [760, 380], "land": "M1573,374L1573,374L1573,374ZM255.5,197.5L255.5,197.5L255.5,197.5ZM259,196.5L259,196.5L259,196.5ZM260.5,195.5L260.5,195.5L260.5,195.5ZM1701,595L1699,597L1697,601.5L1693.5,606.5L1692.5,609L1690.5,613L1688,615.5L1686,617.5L1684.5,620.5L1681.5,622L1681.5,622.5L1679,624L1673.5,629L1672,632L1669.5,634L1668,635.5L1664.5,640.5L1664,641L1659.5,645.5L1656,651L1655,652L1653.5,656L1652,658L1648.5,660L1641,660.5L1638.5,661L1634.5,663.5L1629.5,666.5L1626,667L1625.5,668L1626.5,668L1625,670L1625,668L1623.5,668.5L1623.5,666.5L1621.5,665.5L1623,664.5L1623,663.5L1622,663.5L1619,665.5L1618,664L1619,664L1621.5,662.5L1620.5,661L1617,662.5L1618.5,663L1614,665L1611.5,667L1609.5,667.5L1608,667L1605,665L1603,664.5L1600.5,663.5L1599.5,664.5L1598.5,664.5L1597,662L1595,662L1594,661L1594,659L1592.5,656L1593,654.5L1595,651.5L1595,647.5L1593,643.5L1594.5,643.5L1595,644L1595.5,642.5L1595,642L1590,644L1588.5,644L1590.5,642L1592,639.5L1592.5,637.5L1592,633L1590,635.5L1589,637.5L1587,640.5L1585.5,640.5L1583,641L1581.5,641L1583.5,639L1585.5,639L1587,636.5L1588.5,633L1590.5,631L1593,629L1593.5,626L1594.5,625.5L1595,623L1595,621.5L1594,623L1591,626L1588.5,629L1584,631L1582.5,632L1577.5,637L1577,639L1576,638.5L1575,639L1573.5,636.5L1575,636.5L1575.5,631.5L1574.5,629L1574.5,627L1574,626L1572,626L1572,622.5L1573,622.5L1573.5,621L1570.5,618.5L1568,618.5L1566,617L1562.5,617L1560.5,615L1557.5,613.5L1555,614L1551,614L1543.5,615L1537.5,617.5L1532.5,619L1529,619.5L1525,619L1523.5,619.5L1521,621L1519,621.5L1515,623.5L1512.5,624L1510.5,625.5L1508,629L1506,631L1503,632L1502.5,631L1500.5,631L1496.5,632L1496.5,631L1492.5,630.5L1489,631L1486,631.5L1482.5,632L1481,632.5L1479. <script>
/* ===================== [4] ENGINE ===================== */
(function () {
  'use strict';
  const C = JSON.parse(document.getElementById('content').textContent);
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const CIRCLED = ['', '①', '②', '③', '④'];
  const LETTERS = 'ABCD';
  const fmt = n => Math.round(n).toLocaleString('en-GB');
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  /* ---------- Fictional identifiers ---------- */
  function iso6346(code) {
    const lv = ch => { let v = 10; for (let c = 65; c < ch.charCodeAt(0); c++) { v++; if (v % 11 === 0) v++; } return v; };
    let sum = 0; code.split('').forEach((ch, i) => { sum += (/\d/.test(ch) ? +ch : lv(ch)) * Math.pow(2, i); });
    return (sum % 11) % 10;
  }
  const CONTAINER_NO = `${CONFIG.containerOwnerCode} 123456 ${iso6346(CONFIG.containerOwnerCode + '123456')}`;
  const SEAL_NO = `${CONFIG.logoText}-4471826`, WRONG_SEAL = `${CONFIG.logoText}-4471862`;

  /* ---------- State (saved in localStorage when the browser allows it) ---------- */
  const STORE = 'container-journey-v03';
  let S = null;                     // journey state (null until a journey starts)
  let draft = null;                 // settings being edited in the start menu
  function load() { try { return JSON.parse(localStorage.getItem(STORE)); } catch (e) { return null; } }
  function save() { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) { /* storage unavailable: memory only */ } }
  function freshJourney(settings) {
    return { v: 3, player: player(), settings: Object.assign({}, settings), screen: 'journey', step: 1, maxStep: 1, i: 0, departed: false,
             consulted: {}, docs: {}, q: {}, firstTry: {}, completed: [], choices: {}, quiz: null, narrMin: false, factMin: {} };
  }
  /* v0.5 — nickname (stored on this device only; no full name, no e-mail) */
  const PLAYER = STORE + '-player', RESULTS = STORE + '-results';
  function player() { try { return localStorage.getItem(PLAYER) || ''; } catch (e) { return window.__nick || ''; } }
  function setPlayer(v) { window.__nick = v; try { localStorage.setItem(PLAYER, v); } catch (e) {} }
  // 2–20 characters; letters, digits, space, . _ -; an e-mail address is refused
  function validNick(v) { v = String(v || '').trim(); return /^[\p{L}\p{N} ._-]{2,20}$/u.test(v) && !v.includes('@') ? v : ''; }
  const cur = () => (S && S.screen !== 'menu' ? S.settings : draft) || (S && S.settings) || draft;
  const L = () => +cur().level;
  const container = () => C.containers.find(c => c.id === cur().container) || C.containers[0];
  const fam = () => container().family;
  const route = () => C.routes.find(r => r.id === cur().route) || C.routes[0];
  const inco = () => C.incoterms[cur().incoterm] || C.incoterms.FCA;
  const stepDef = id => C.steps.find(s => s.id === id);

  /* ---------- Text resolution ---------- */
  function byVal(k) {
    switch (k) {
      case 'family': return fam();
      case 'container': return container().id;
      case 'route': return route().id;
      case 'incoterm': return cur().incoterm;
      case 'level': return String(L());
      case 'transship': return route().transship ? 'yes' : 'no';
      case 'freight': return inco().freight;
      case 'group': return inco().group;
      case 'modes': return (route().modes || []).length > 1 ? 'many' : 'one';
      default: return S && S.choices ? S.choices[k] : undefined;
    }
  }
  // Resolves level objects {"1","2","3"} (L3 → L2 → L1 fallback) and choice objects {"_by": key}.
  function R(v) {
    for (let g = 0; g < 8 && v && typeof v === 'object' && !Array.isArray(v); g++) {
      if (v._by) { const k = byVal(v._by); v = (k != null && v[k] !== undefined) ? v[k] : v['*']; continue; }
      if ('1' in v || '2' in v || '3' in v) { const l = L(); v = v[l] != null ? v[l] : (l === 3 && v['2'] != null ? v['2'] : v['1']); continue; }
      break;
    }
    return v;
  }
  // Filter for beats, hotspots, rows, options: "levels" and "when".
  function ok(it) {
    if (!it) return false;
    if (it.levels && !it.levels.includes(L())) return false;
    const w = it.when; if (!w) return true;
    return Object.keys(w).every(k => {
      const want = w[k];
      const have = k === 'transship' ? !!route().transship : byVal(k);
      return Array.isArray(want) ? want.includes(have) : want === have;
    });
  }
  function choiceLabel(key) {
    const v = S && S.choices[key]; if (!v) return '';
    const o = (C.choices[key] || { options: [] }).options.find(x => x.id === v);
    return o ? String(R(o.title)).toLowerCase() : v;
  }
  // Template variables from the learner's choices.
  function vars() {
    const r = route(), c = container(), ic = inco(), f = c.family, cut = r.cutoffs || {};
    const cargoKg = (r.cargoKg || {})[f] || 10000, tare = c.tare;
    return {

      box: c.name, boxCode: c.iso, family: c.familyName.toLowerCase(), cargo: R((r.cargo || {})[f]), setPoint: R(r.setPoint) || '',

      incoterm: cur().incoterm, incoName: ic.name, freightBy: (ic.freight || '').toLowerCase(), freightTerms: ic.freight === 'Seller' ? 'prepaid' : 'collect',
      exportBy: ic.exportBy, importBy: ic.importBy, preBy: ic.preBy, onBy: ic.onBy, vgmBy: ic.vgmBy, insurance: ic.insurance,
      riskStep: ic.risk, costStep: ic.cost, containerNo: CONTAINER_NO, sealNo: SEAL_NO, wrongSeal: WRONG_SEAL,
      freeDays: CONFIG.tariff.freeDays, mode: choiceLabel('mode') || 'truck', onMode: choiceLabel('onMode') || 'truck',
      company: CONFIG.companyName, cur: CONFIG.tariff.currency
    };
  }
  function tpl(s) { const m = vars(); return String(s).replace(/\{(\w+)\}/g, (x, k) => (m[k] != null && m[k] !== '' ? m[k] : x)); }
  function rich(v, allowHtml) {
    const s = R(v); if (s == null || s === '') return '';
    let h = allowHtml ? tpl(s) : esc(tpl(s));
    h = h.replace(/\[\[([a-z0-9-]+)(?:\|([^\]]+))?\]\]/gi, (m, id, label) => {
      const g = C.glossary[id]; if (!g) return label || id;
      let shown = label || g.term.replace(/\s*\(.*\)$/, '');
      if (!label && /^[A-Z][a-z]/.test(shown)) shown = shown.charAt(0).toLowerCase() + shown.slice(1);
      return `<button type="button" class="term" data-term="${id}">${shown}</button>`;

    h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    return h.replace(/^([a-z])/, c => c.toUpperCase());
  }
  const plain = v => tpl(String(R(v) == null ? '' : R(v))).replace(/\[\[[^|\]]+\|([^\]]+)\]\]/g, '$1')
    .replace(/\[\[([^\]]+)\]\]/g, (m, id) => (C.glossary[id] ? C.glossary[id].term : id)).replace(/\s*\[TO VERIFY:v\d+\]/g, '').replace(/\*\*/g, '');

  /* ---------- Branding ---------- */

    const m = { primary: '--c-primary', primaryDark: '--c-primary-dark', primarySoft: '--c-primary-soft', box: '--c-box', boxDark: '--c-box-dark', text: '--c-text', muted: '--c-muted', ok: '--c-ok', okBg: '--c-ok-bg', star: '--c-star', seller: '--c-seller', buyer: '--c-buyer', skyTop: '--c-sky-top', skyBottom: '--c-sky-bottom' };

  }

  /* ---------- Hotspots ---------- */

  /* ---------- Bottom bar ---------- */
  function sceneEssDone() { const b = curBeat(); return visibleHs().filter(h => h.essential && h.essential.includes(L()) && h.beat === b.id).every(h => consulted(h.id)); }

  /* ---------- v1.0: essentials nudge (retour 3) ----------

  /* ---------- Departure, key points, next step ---------- */

  /* ---------- v0.5: risk / cost transfer moment ----------
     A full-screen beat in the spirit of a game "evolution" scene, with original visuals only: flash, the RISK shield
     (or the € coin) leaves the seller and flies to the buyer, then the rule's name and one sentence on what changed.

  /* ---------- v0.5: indicative cost (€) and CO2e meter ----------

  function pickVal(v, c) {

  /* v1.0 — CO2e line by line (retour 1). footprint.lines in global.json lists every emission source with its step and the

      rows.push({ step: it.step, label: it.label, eur: Math.round(eur * x / 5) * 5, payer, kg: 0, v });

    const add = (L, label, kg, calc, v, beat) => rows.push({ step: L.step, beat: beat || L.beat, label, eur: 0, payer: null, kg, calc, v });
    const land = (L, mode, km, t, label) => { const f = fac[mode] || fac.truck; if (!km) return; add(L, label, km * t * f.kg, fill(CL.tkm, { name: f.short || mode, km: fmt(km), t: n1(t), f: nf(f.kg) }), f.v); };

      else if (L.calc === 'first') { if (mode !== 'truck') land(L, 'truck', (RT.firstKm || {})[mode] || 0, grossT, lab(L.label, { mode: modeName('mode') })); }
      else if (L.calc === 'pre') land(L, mode, (RT.preKmBy || {})[mode] || RT.preKm || 0, grossT, lab(L.label, { mode: modeName('mode') }));

      else if (L.calc === 'terminal') add(L, lab(L.label, { hub: r.hub || '' }), fac.terminal.kg, fill(CL.terminal, { f: nf(fac.terminal.kg) }), fac.terminal.v);

  /* ---------- v0.5: results (nickname, scores, right/wrong per question at the first try) ---------- */
  // Every scored item of the journey: step questions (first try), document checks (1 pt = first try) and the final quiz.
  function resultItems() {
    const out = [];
    C.steps.forEach(s => {
      const ft = S.firstTry[s.id]; if (ft) out.push({ id: `S${s.id}`, tag: `Step ${s.id}`, label: `${plain(s.title)} — ${plain(R(s.question).prompt)}`, ok: !!ft.ok });
      (s.hotspots || []).forEach(h => { const d = docOf(h); if (!d || !ok(h)) return; const st = S.docs[`${s.id}:${d}`]; if (st && st.done) out.push({ id: `D${s.id}-${d}`, tag: `Step ${s.id} · document`, label: plain(s.docs[d].title), ok: st.pts === 1, pts: st.pts }); });
    });
    const Z = S.quiz, pool = R(C.quiz) || [];
    if (Z) Z.order.forEach(id => { const a = Z.answers[id], q = pool.find(x => x.id === id); if (a && q) out.push({ id: `Q-${id}`, tag: 'Final quiz', label: plain(q.q), ok: !!a.ok }); });
    return out;
  }
  function loadResults() { try { return JSON.parse(localStorage.getItem(RESULTS)) || []; } catch (e) { return window.__results || []; } }
  function saveResults(list) { window.__results = list; try { localStorage.setItem(RESULTS, JSON.stringify(list)); } catch (e) {} }
  // Built once per finished journey (S.resultId), kept on this device, and sent to CONFIG.resultsEndpoint if set.
  function recordResults() {
    let list = loadResults(), rec = S.resultId && list.find(r => r.id === S.resultId);
    if (rec) return rec;
    const ids = Object.keys(S.firstTry), okN = ids.filter(k => S.firstTry[k].ok).length, dt = docTotals(), Z = S.quiz;
    const items = resultItems();
    rec = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), app: CONFIG.appTitle, version: (C.meta || {}).version || '',
      nickname: player() || 'anonymous', date: new Date().toISOString(), level: L(), container: container().name, route: route().name, incoterm: cur().incoterm,
      firstTry: `${okN}/${ids.length}`, firstTryPct: ids.length ? Math.round(okN / ids.length * 100) : 0,
      documents: dt.max ? `${dt.pts}/${dt.max}` : 'n/a', quiz: Z ? `${Object.values(Z.answers).filter(a => a.ok).length}/${Z.order.length}` : 'n/a',
      toReview: items.filter(x => !x.ok).map(x => `${x.tag}: ${x.label}`).join(' | '),
      questions: items.map(x => ({ id: x.id, label: `${x.tag}: ${x.label}`, ok: x.ok })), sent: false };
    list.push(rec); saveResults(list); S.resultId = rec.id; save();
    sendResult(rec);
    return rec;
  }
  function sendResult(rec) {
    if (!CONFIG.resultsEndpoint || !window.fetch) return;
    const body = JSON.stringify(Object.assign({ token: CONFIG.resultsToken }, rec, { sent: undefined }));
    // text/plain avoids a CORS pre-flight; Apps Script answers with an opaque response, so success = no network error
    fetch(CONFIG.resultsEndpoint, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body })
      .then(() => { const list = loadResults(), r = list.find(x => x.id === rec.id); if (r) { r.sent = true; saveResults(list); }
        const el = $('#smSent'); if (el) el.textContent = plain(C.ui.resultsSent); })
      .catch(() => { const el = $('#smSent'); if (el) el.textContent = plain(C.ui.resultsLocal); });
  }
  function retryUnsent() { loadResults().filter(r => !r.sent).forEach(sendResult); }
  function downloadCsv() {
    const me = player(), list = loadResults().filter(r => !me || r.nickname === me);
    const q = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
    const head = ['date', 'nickname', 'level', 'container', 'route', 'incoterm', 'first_try', 'first_try_pct', 'documents', 'final_quiz', 'question_id', 'question', 'correct_first_try'];
    const rows = [head.join(',')];
    list.forEach(r => (r.questions.length ? r.questions : [{ id: '', label: '', ok: '' }]).forEach(x => rows.push([r.date, r.nickname, r.level, r.container, r.route, r.incoterm, r.firstTry, r.firstTryPct, r.documents, r.quiz, x.id, x.label, x.ok === '' ? '' : x.ok ? 'yes' : 'no'].map(q).join(','))));
    const blob = new Blob(['\ufeff' + rows.join('\r\n')], { type: 'text/csv;charset=utf-8' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `bobs-adventure-results-${(me || 'me').replace(/[^\w-]+/g, '_')}.csv`;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  /* ---------- Popovers, toast, events ---------- */
