ration requirements.", "source": "Union Customs Code; national customs and tax guidance"}, {"id": "v27", "claim": "Some Asia–Europe services call Cai Mep directly, reducing transshipment via Singapore.", "source": "Carrier schedules"}, {"id": "v28", "claim": "Guayaquil/Posorja → Antwerp-Bruges reefer transit time and service structure.", "source": "Carrier schedules"}, {"id": "v30", "claim": "Booking channels: portal, platforms, EDI IFTMBF/IFTMBC.", "source": "UN/EDIFACT directories; carrier EDI guides"}, {"id": "v31", "claim": "Overbooking practice, blank sailings and rollings; cancellation / no-show fees at some carriers.", "source": "Carrier booking terms; industry press"}, {"id": "v32", "claim": "ISO 6346 size-type codes (22G1, 42G1, 45G1, 45R1, 42U1, 42P3, 22T6).", "source": "ISO 6346:2022"}, {"id": "v33", "claim": "Prepaid/collect set by the contract of carriage; release of originals subject to freight payment (credit policy).", "source": "Carrier B/L terms and credit policy"}, {"id": "v34", "claim": "NVOCCs book in their own name and issue house B/Ls.", "source": "US FMC definitions; FIATA documents"}, {"id": "v35", "claim": "Rate structure (all-in vs base + surcharges) and surcharge names vary by carrier.", "source": "Carrier tariffs"}, {"id": "v36", "claim": "Empty depots often third-party; gate movements reported electronically (e.g. EDI CODECO).", "source": "SMDG CODECO; carrier depot contracts"}, {"id": "v37", "claim": "Empty container handlers for empty boxes only; stacking height depends on machine and depot rules.", "source": "Manufacturer specifications; depot safety rules"}, {"id": "v38", "claim": "Empty containers ≈ 20% of global port container handling; trade imbalance drives repositioning.", "source": "Drewry; UNCTAD Review of Maritime Transport"}, {"id": "v39", "claim": "Inland access per terminal: Yangshan by road (Donghai Bridge) or water; Cat Lai by road or river barge; Posorja by road.", "source": "Port authorities; local forwarders"}, {"id": "v40", "claim": "Intermodal (barge/rail) cut-offs earlier than port cut-off; extra handling charges.", "source": "Carrier intermodal tariffs; operator schedules"}, {"id": "v41", "claim": "Donghai Bridge length ≈ 32.5 km.", "source": "Official Shanghai sources"}, {"id": "v42", "claim": "Shanghai: world's busiest container port since 2010, ≈ 50 million TEU per year.", "source": "SIPG annual report; Lloyd's List One Hundred Ports"}, {"id": "v43", "claim": "Inland haulier liability and carrier responsibility under carrier haulage per B/L terms.", "source": "Carrier B/L terms; national law"}, {"id": "v44", "claim": "Terminal pre-advice (e.g. EDI COPARN) and truck appointment systems; gate refusal on mismatch.", "source": "Terminal operating rules; SMDG guides"}, {"id": "v45", "claim": "Export declaration lodged by exporter/broker; matched with terminal arrival data; electronic, risk-based release (procedures vary by country).", "source": "National customs administrations; local brokers"}, {"id": "v46", "claim": "SI content and channels (portal, EDI IFTMIN); HS 6-digit international base.", "source": "WCO HS; carrier SI guides"}, {"id": "v47", "claim": "Draft B/L approval deadline; B/L issued as drafted if no reply (practice varies).", "source": "Carrier documentation policies"}, {"id": "v48", "claim": "ICS2 'do not load' messages; advance filing fees charged by some carriers.", "source": "European Commission ICS2 guidance; carrier tariffs"}, {"id": "v49", "claim": "B/L types; eB/L legal recognition (e.g. UK Electronic Trade Documents Act 2023); carrier eB/L commitments.", "source": "UK ETDA 2023; DCSA; carrier websites"}, {"id": "v50", "claim": "'Received for shipment' B/L can be annotated 'shipped on board' with date.", "source": "Hague-Visby Rules art. III(7); UCP 600 art. 20"}, {"id": "v51", "claim": "Direct (shipside) delivery possible for some OOG/DG cargo by arrangement.", "source": "Terminal tariffs and operating rules"}, {"id": "v52", "claim": "Some ports/terminals require an export declaration reference or pre-clearance before gate-in.", "source": "Terminal rules by country"}, {"id": "v53", "claim": "Container specs used: 20DV tare ≈ 2,200 kg / 33 m³; 40DV ≈ 3,700 kg / 67 m³; 40' reefer HC tare ≈ 4,800 kg, MGM ≈ 34,000 kg; 40OT tare ≈ 3,850 kg; 40' flat rack tare ≈ 5,000 kg, MGM ≈ 45,000 kg; 20' ISO tank tare ≈ 3,700 kg, MGM ≈ 36,000 kg.", "source": "ISO 668 / ISO 1496; carrier and tank-operator equipment pages"}, {"id": "v54", "claim": "Ho Chi Minh City: Cat Lai river terminal; feeder to Singapore ≈ 2–3 days; mainline Singapore → Le Havre ≈ 28–32 days via Suez; some services call Cai Mep directly.", "source": "Carrier schedules; port operator sites"}, {"id": "v55", "claim": "Posorja/Guayaquil → Antwerp-Bruges ≈ 18–22 days via Panama; direct and transshipment services exist; Ecuador is the world's largest banana exporter.", "source": "Carrier schedules; FAO banana market review"}, {"id": "v56", "claim": "Reefer set points: bananas ≈ +13.3 °C (13–14 °C), frozen fish −18 °C or colder; bananas need ventilation or controlled atmosphere.", "source": "Carrier reefer cargo guides; Cargo Handbook (GDV)"}, {"id": "v57", "claim": "Reefer PTI before release; genset on road/rail; plugged at terminals and on board; remote monitoring by carriers.", "source": "Carrier reefer service pages"}, {"id": "v58", "claim": "OOG: special approval before booking confirmation, cannot be stacked normally, special stowage and lashing, oversize road permits.", "source": "Carrier special-cargo pages; national road rules"}, {"id": "v59", "claim": "DG tanks: IMDG declaration and approval, placards, segregation in yard and on board; road transport under national DG rules (e.g. ADR in Europe).", "source": "IMDG Code ch. 5 & 7; ADR; port DG rules"}, {"id": "v60", "claim": "Terminal gates with OCR portals and appointment systems; export detention stops at full gate-in.", "source": "Terminal operating rules; carrier tariffs"}, {"id": "v61", "claim": "Stowage planning: bay plan (EDI BAPLIE) built from weights, port rotation, DG, reefer plugs and stability; terminal and carrier planners co-operate.", "source": "SMDG BAPLIE; carrier vessel-operations practice"}, {"id": "v62", "claim": "Quay cranes handle roughly 25–35 moves per hour each; lashing done by terminal lashers; shipped-on-board B/L after loading.", "source": "Terminal productivity reports; Hague-Visby; UCP 600 art. 20"}, {"id": "v63", "claim": "Since 2024 many Asia–Europe services have been rerouted via the Cape of Good Hope because of Red Sea security; status changes over time.", "source": "Carrier network advisories (time-sensitive)"}, {"id": "v64", "claim": "Reefer and fruit lanes from the west coast of South America use ships of roughly 8,000–14,000 TEU with large plug capacity.", "source": "Carrier fleet lists; schedules"}, {"id": "v65", "claim": "A 40' reefer of bananas carries about 20 pallets / ≈ 1,000–1,100 cartons of ≈ 18 kg.", "source": "Carrier reefer guides; banana industry data"}, {"id": "v66", "claim": "Arrival notice sent before arrival; destination THC, demurrage free time and import charges per carrier tariff.", "source": "Carrier import procedures and tariffs"}, {"id": "v67", "claim": "EU import: customs declaration with HS code, customs value, duties and import VAT; EORI required; customs release sent to the terminal through port community systems.", "source": "Union Customs Code; French and Belgian customs; port community systems"}, {"id": "v68", "claim": "Release: one original B/L of the full set surrendered (or sea waybill / telex release / eB/L), collect freight and charges paid, release by PIN or secure digital pick-up (e.g. Antwerp certified pick-up).", "source": "Carrier import procedures; port community system documentation"}, {"id": "v69", "claim": "On-carriage options: Le Havre by road, rail and Seine barge; Antwerp-Bruges by road, barge and rail.", "source": "HAROPA Port; Port of Antwerp-Bruges"}, {"id": "v70", "claim": "Import detention from full gate-out to empty return; delivery appointments; POD / CMR for road transport.", "source": "Carrier tariffs; CMR Convention"}, {"id": "v71", "claim": "Empty return depot set by the carrier; damage recharges based on EIR; cleaning fees; reefer wash and PTI; tank cleaning certificate.", "source": "Carrier tariffs; tank cleaning industry standards (e.g. EFTCO)"}, {"id": "v72", "claim": "D&D disputes: billing must follow tariff/contract; some regulators (e.g. US FMC) set billing rules.", "source": "US FMC 46 CFR Part 541; carrier tariffs"}, {"id": "v73", "claim": "Singapore: world's largest transshipment hub, ≈ 39–41 million TEU per year; hub dwell typically 1–3 days.", "source": "Maritime and Port Authority of Singapore"}, {"id": "v74", "claim": "Port volumes: Antwerp-Bruges ≈ 13 million TEU; Le Havre (HAROPA) ≈ 3 million TEU per year.", "source": "Port of Antwerp-Bruges; HAROPA annual figures"}, {"id": "v75", "claim": "Delivery without original B/L exposes the carrier to misdelivery claims; LOIs carry risk.", "source": "P&I club guidance"}, {"id": "v76", "claim": "General average declared after incidents such as fires; cargo interests must provide GA security before delivery.", "source": "York-Antwerp Rules 2016; P&I / average adjusters guidance"}, {"id": "v77", "claim": "Containers lost at sea: a few hundred to a few thousand per year depending on the year (e.g. 221 in 2023 per WSC).", "source": "World Shipping Council 'Containers Lost at Sea' report"}, {"id": "v78", "claim": "Ocean freight Shanghai → Le Havre ≈ €3,000 per 40' and ≈ €1,900 per 20' (Drewry WCI Shanghai–Rotterdam US$3,504/40ft on 12 Nov 2026; Xeneta Far East–North Europe US$3,588/FEU on 13 Nov 2026; a 40' usually costs 1.5–1.7× a 20'). Spot rates move every week.", "source": "Drewry World Container Index; Xeneta weekly market update; carrier quotation"}, {"id": "v79", "claim": "Ocean freight Ho Chi Minh City → Le Havre via Singapore ≈ €3,100 per 40' and ≈ €1,950 per 20': no weekly public index found for this lane, Far East–North Europe used as a proxy. Mid-2026 quotes for Ho Chi Minh City–North Europe were much higher (≈ US$5,700).", "source": "Xeneta / Drewry; carrier quotation for Cat Lai–Le Havre"}, {"id": "v80", "claim": "Posorja → Antwerp-Bruges: 40' reefer ≈ €4,300 (no public index; reference ranges for 40' reefers to North Europe ≈ US$4,300–5,600 in 2026); dry ≈ €1,350 (20') / €2,100 (40') from indicative online quotes Guayaquil–Rotterdam (20' US$1,260–1,930, Oct 2026).", "source": "Carrier reefer tariff or quotation, Ecuador–North Europe"}, {"id": "v81", "claim": "40' reefer freight Asia → North Europe ≈ €3,800 (forwarder reference: China–North Europe 40' reefer ≈ US$4,300, June 2026).", "source": "Carrier reefer tariff or quotation"}, {"id": "v82", "claim": "Out-of-gauge surcharge ≈ €1,500 per open top / flat rack (lost slots, special stowage); in reality quoted case by case.", "source": "Carrier OOG / special equipment tariff"}, {"id": "v83", "claim": "Dangerous-goods surcharge ≈ €350 per tank container, IMDG class 3.", "source": "Carrier DG surcharge tariff"}, {"id": "v84", "claim": "Origin THC ≈ US$150 per TEU at Chinese export ports (≈ €130 per 20' / €195 per 40'), same order assumed for Cat Lai; Posorja ≈ €200 / €300 is an estimate (no public tariff found); reefer THC ≈ ×1.5 (estimate).", "source": "Carrier local-charge tariffs (China, Vietnam, Ecuador)"}, {"id": "v85", "claim": "Destination THC: Le Havre ≈ €295 per container (forwarder general tariff France, Q3 2026); Antwerp-Bruges ≈ €200 per 20' / €300 per 40' (2026 overview).", "source": "Carrier THC tariffs for North Europe (published per port)"}, {"id": "v86", "claim": "Documentation fee ≈ €95 per B/L and import customs clearance ≈ €105 per declaration (forwarder tariff France 2025–2026); export declaration ≈ €100 is an estimate. Duties and VAT are not included.", "source": "Forwarder / customs broker tariffs"}, {"id": "v87", "claim": "Inland transport costs are estimates (no public tariff): pre-carriage ≈ €300 Shanghai (≈ 120 km), ≈ €150 Ho Chi Minh City (≈ 40 km), ≈ €350 Ecuador (≈ 150 km); on-carriage incl. empty return ≈ €850 Le Havre → Paris region (≈ 200 km), ≈ €450 Antwerp → Belgian ripening centre (≈ 60 km). The same price is used for barge and rail (simplification).", "source": "Haulier, barge and rail operator quotations"}, {"id": "v88", "claim": "Sea distances: Shanghai–Le Havre via Suez ≈ 19,500 km (≈ 10,500 nm; via the Cape ≈ 13,800 nm); Ho Chi Minh City–Singapore ≈ 1,200 km (estimate); Singapore–Le Havre via Suez ≈ 15,600 km (Singapore–Rotterdam ≈ 8,440 nm); Posorja–Antwerp via Panama ≈ 10,500 km (routing tools give 9,500–13,200 km with port calls).", "source": "Sea-distance tables (e.g. NGA Pub. 151) and the actual service rotation"}, {"id": "v89", "claim": "Container ship default intensity ≈ 66 g CO₂e per TEU-km (dry) and ≈ 134 g per TEU-km (reefer, including on-board reefer energy); a 40' = 2 TEU. Clean Cargo lane factors for Asia–Europe are lower.", "source": "GLEC Framework default intensity values; Clean Cargo trade-lane factors"}, {"id": "v90", "claim": "Feeder ship ≈ 128 g CO₂e per TEU-km (GLEC 'other trade lanes', well-to-wheel); reefer on a feeder counted ×2 (estimate).", "source": "GLEC Framework default intensity values"}, {"id": "v91", "claim": "Land intensity (GLEC v3, Europe): articulated truck 34–40 t, container transport ≈ 73 g CO₂e per tonne-km (tank-to-wheel); inland container barge ≈ 16 g; electric rail ≈ 11 g (upstream electricity). Mass = cargo + tare (simplification).", "source": "GLEC Framework v3.x, road / rail / inland waterway tables"}, {"id": "v92", "claim": "Reefer on land ≈ 100 kWh per day plugged in (reported 96–139 kWh per day) × ≈ 0.4 kg CO₂e per kWh (assumed grid / genset mix) ≈ 40 kg CO₂e per day; 3 days at each terminal (assumption).", "source": "Reefer unit manufacturer data; national grid emission factors"}, {"id": "v93", "claim": "Exchange rate used for freight indices: ≈ 0.86 € per US$ (November 2026).", "source": "ECB euro reference rates"}, {"id": "v94", "claim": "Maritime container terminal ≈ 10.7 kg CO₂e per container (ambient; ≈ 12.6 kg for mixed-temperature terminals), GLEC default from the GILA market study of 15 terminals. The value covers the whole terminal visit (gate, yard, quay crane) and is not split by activity, so it is counted once per terminal: origin (step 6), transshipment hub (step 7) and destination (step 8). A transshipped box counts twice in port throughput statistics; one value per terminal visit is used here (assumption).", "source": "GLEC Framework v3.1 (2024), Table 3 'Logistics hubs emission intensity values' (Fraunhofer IML / GILA); terminal operator's own ISO 14083 data"}, {"id": "v95", "claim": "Stuffing and unstuffing counted as a 'transshipment' logistics hub (ISO 14083 hub operation): ≈ 1.3 kg CO₂e per tonne handled (ambient) and ≈ 2.5 kg per tonne for mixed-temperature sites (used for reefer cargo). Small samples (99 and 8 sites).", "source": "GLEC Framework v3.1, Table 3; Fraunhofer IML 'Average emission intensity values for logistics sites' (2024)"}, {"id": "v96", "claim": "Empty box from the depot to the shipper: distance assumed equal to the pre-carriage distance (empty depots are usually near the port: ≈ 120 km Shanghai, ≈ 40 km Ho Chi Minh City, ≈ 150 km Ecuador). Counted as tare-only tonne-km with the truck factor, like the empty return (simplification: a vehicle-based calculation would give more).", "source": "Depot location from the carrier's equipment control; haulier fuel data; GLEC Framework (empty running)"}, {"id": "v97", "claim": "Reefer plug-in time on land, prorated by step (assumption): export terminal 2.5 days in the yard + 0.5 day until loading; transshipment hub ≈ 7 days (Singapore transshipment dwell ≈ 7–8 days in early 2026, EconDB data); import terminal 1 day after discharge + 2 days waiting for customs release. On-board energy is inside the reefer ship factor; genset fuel on road legs and refrigerant leaks are not counted.", "source": "Terminal reefer monitoring data (plug-in / plug-out times); EconDB port dwell statistics; GLEC Framework (temperature control)"}, {"id": "v98", "claim": "Inland legs by barge or rail run terminal to terminal: on-carriage ends at an inland terminal (e.g. Gennevilliers, Paris, served by barge and rail from Le Havre), then a truck does the last kilometres (≈ 20 km Paris region; ≈ 10 km in Belgium). Distances are estimates: Seine barge Le Havre → Paris region ≈ 350 km, rail ≈ 230 km, Antwerp → Belgian inland terminal ≈ 50 km. Pre-carriage by barge starts with a truck to a river terminal (≈ 15 km + barge ≈ 130 km near Shanghai; ≈ 10 km + barge ≈ 40 km near Ho Chi Minh City).", "source": "Barge and rail operator schedules (HAROPA PORT inland terminals, Antwerp-Bruges barge network, Yangtze / Mekong delta feeders); route planners"}, {"id": "v99", "claim": "Most containers carried inland by rail finish their trip by truck from an inland rail terminal; few consignees have a private rail siding.", "source": "Rail operators and inland terminal operators; national intermodal statistics"}, {"id": "v100", "claim": "Map: port and passage coordinates (decimal degrees) and the sea-lane waypoints are approximations drawn for teaching, not a navigation route; coastlines from Natural Earth 1:50m (public domain), Natural Earth projection. The Suez / Cape choice depends on the Red Sea security situation.", "source": "Natural Earth; NGA World Port Index (Pub. 150) for port positions; carrier service maps"}], "quiz": {"1": [{"id": "q1", "q": "Where are the goods loaded into a full container (FCL)?", "options": [{"text": "At the shipper's own premises", "correct": true}, {"text": "On board the ship, at the port", "text2": ""}, {"text": "At the empty container depot"}], "explain": "For FCL, the shipper stuffs its own goods at its premises; the depot only handles empty boxes."}, {"id": "q2", "q": "What does the VGM include?", "options": [{"text": "The container's own weight plus everything inside", "correct": true}, {"text": "Only the weight of the goods, without the container"}, {"text": "The weight of the truck plus the loaded container"}], "explain": "VGM = tare + cargo + packaging + pallets + dunnage. It must reach the carrier before the VGM cut-off."}, {"id": "q3", "q": "Why does a container get a numbered seal?", "options": [{"text": "To prove nobody opened it during the journey", "correct": true}, {"text": "To show which ship and voyage it travels on"}, {"text": "To show that the customs duties are paid"}], "explain": "The seal number is written in the documents; a broken or different seal shows the box was opened."}, {"id": "q4", "q": "What happens to a container that reaches the port after the port cut-off?", "options": [{"text": "It can miss its ship and wait for the next one", "correct": true}, {"text": "The ship waits for it before leaving the port"}, {"text": "It goes back to the shipper free of charge"}], "explain": "Ships keep their schedule; a late box is 'rolled' to the next sailing, often a week later."}, {"id": "q5", "q": "Who usually decides which ship a container goes on, and where it sits on board?", "options": [{"text": "The carrier's and terminal's planners", "correct": true}, {"text": "The truck driver who brings it to the port"}, {"text": "The consignee who will receive it later"}], "explain": "Planners build the stowage plan from weights, destinations and special cargo."}, {"id": "q6", "q": "What is transshipment?", "options": [{"text": "Moving a container from one ship to another at a hub port", "correct": true}, {"text": "Moving a container from a truck onto a train for the next leg"}, {"text": "Returning an empty container to the depot after delivery"}], "explain": "On the Ho Chi Minh City route, a feeder brings the box to Singapore, where it is moved to the mainline ship."}, {"id": "q7", "q": "At destination, what must usually happen before the consignee can collect the container?", "options": [{"text": "Import customs clearance and release by the carrier", "correct": true}, {"text": "A new weighing of the full container, with a new VGM"}, {"text": "Nothing: the customer's truck just picks it up"}], "explain": "Customs must clear the goods and the carrier must release the box (B/L, freight and charges settled)."}, {"id": "q8", "q": "What is detention?", "options": [{"text": "A daily charge when the carrier's box stays out too long", "correct": true}, {"text": "A customs penalty paid for any wrong or missing documents"}, {"text": "The fee paid to the terminal for loading the ship"}], "explain": "After the free days, every extra day the box stays with the customer costs money."}, {"id": "q9", "q": "Do Incoterms decide who owns the goods?", "options": [{"text": "No — they decide costs, risks and tasks, not ownership", "correct": true}, {"text": "Yes — ownership changes at the risk transfer point, always"}, {"text": "Only under DDP, where the seller does everything for the buyer"}], "explain": "Ownership is set by the sales contract. Incoterms cover delivery, costs, risk and formalities."}, {"id": "q10", "q": "Under {incoterm}, who books and pays the ocean freight in your journey?", "options": [{"text": {"_by": "freight", "Seller": "The seller (exporter)", "Buyer": "The buyer (importer)"}, "correct": true}, {"text": {"_by": "freight", "Seller": "The buyer (importer)", "Buyer": "The seller (exporter)"}}, {"text": "The port's terminal"}], "explain": "E- and F-rules: the buyer contracts the main carriage. C- and D-rules: the seller does."}], "2": [{"id": "q1", "q": "Which document is the B/L drafted from?", "options": [{"text": "The shipping instructions (SI)", "correct": true}, {"text": "The booking confirmation (BC)"}, {"text": "The VGM declaration (SOLAS)"}, {"text": "The export customs declaration"}], "explain": "The SI gives parties, cargo description, packages, weights and seal; the booking lacks these details."}, {"id": "q2", "q": "Under SOLAS, a packed container without a VGM…", "options": [{"text": "must not be loaded until a VGM is received", "correct": true}, {"text": "can be loaded if the manifest shows a weight"}, {"text": "can be loaded once the shipper pays a fine"}, {"text": "is weighed on board by the crew after loading"}], "explain": "No VGM, no loading: the terminal keeps it off the load list. [TO VERIFY:v01]"}, {"id": "q3", "q": "Export detention usually runs…", "options": [{"text": "from empty gate-out to full gate-in at the terminal", "correct": true}, {"text": "from the booking date to the vessel's departure"}, {"text": "from full gate-in at the terminal to vessel loading"}, {"text": "from discharge at destination to final delivery"}], "explain": "Demurrage covers time in the terminal; detention covers time outside. Tariffs vary. [TO VERIFY:v21]"}, {"id": "q4", "q": "A sea waybill differs from a negotiable B/L because…", "options": [{"text": "it is not a document of title: no original is needed for release", "correct": true}, {"text": "it is only used for reefers and other perishable, urgent cargo"}, {"text": "it must be endorsed to the bank before the carrier gives any release"}, {"text": "it is issued before loading, so that it can travel with the box"}], "explain": "Sea waybills speed up release when no bank or onward sale needs a document of title."}, {"id": "q5", "q": "Which party lodges the EU entry summary declaration (ENS) for an FCL shipment to Le Havre?", "options": [{"text": "The ocean carrier (house data possibly by an NVOCC), before loading", "correct": true}, {"text": "The consignee, on arrival at Le Havre, together with the import entry"}, {"text": "The exporter's broker, together with the export declaration at origin"}, {"text": "The terminal at Le Havre, when the vessel's arrival is announced"}], "explain": "Under ICS2 the carrier files the ENS at least 24 h before loading for deep-sea containers. [TO VERIFY:v23]"}, {"id": "q6", "q": "What is the main risk at a transshipment hub?", "options": [{"text": "Missing the connection to the mainline vessel", "correct": true}, {"text": "A new VGM must be declared for the second ship"}, {"text": "The B/L must be reissued for the new vessel"}, {"text": "Import duties must be paid in the hub country"}], "explain": "Feeder delays or congestion can roll the box to a later mainline sailing. [TO VERIFY:v73]"}, {"id": "q7", "q": "Under merchant haulage at destination, who books the truck to the consignee?", "options": [{"text": "The consignee or its forwarder", "correct": true}, {"text": "The carrier, as part of the freight"}, {"text": "The terminal, after the discharge"}, {"text": "Customs, once the release is given"}], "explain": "Merchant haulage = the cargo side organises inland transport; the carrier only releases the box."}, {"id": "q8", "q": "A reefer's set point is…", "options": [{"text": "the temperature the unit must keep, given by the shipper", "correct": true}, {"text": "the place in the yard where the reefer is plugged in"}, {"text": "the reefer's maximum gross weight, shown on its door"}, {"text": "the deadline for the reefer's pre-trip inspection (PTI) check"}], "explain": "The set point is booked by the shipper and checked at PTI and throughout the voyage. [TO VERIFY:v56]"}, {"id": "q9", "q": "Under CIF, where does the risk pass from seller to buyer?", "options": [{"text": "On board the vessel at the port of loading", "correct": true}, {"text": "At discharge in the port of destination"}, {"text": "At the buyer's warehouse, on final delivery"}, {"text": "At the export terminal gate, on gate-in"}], "explain": "Costs run to destination, but risk passes on board at origin — two critical points."}, {"id": "q10", "q": "Which Incoterm does ICC recommend instead of FOB for containers?", "options": [{"text": "FCA", "correct": true}, {"text": "FAS"}, {"text": "EXW"}, {"text": "CFR"}], "explain": "Containers are handed over at the terminal before loading; FCA matches that delivery point. [TO VERIFY:v15]"}], "3": [{"id": "q1", "q": "A customer's box is rolled because of overbooking, and the L/C requires shipment by a date that the next sailing misses. Best first action?", "options": [{"text": "Inform the customer immediately with options (other service, split, L/C amendment)", "correct": true}, {"text": "Issue the B/L with the original vessel and date, exactly as the letter of credit requires"}, {"text": "Wait until the next sailing is confirmed, then inform the customer in writing"}, {"text": "Change the B/L date after loading so that it matches the latest shipment date"}], "explain": "Never misdate a B/L (fraud). Early transparency lets the shipper seek an L/C amendment. [TO VERIFY:v31]"}, {"id": "q2", "q": "The VGM received differs by 3.5 t from the booking estimate. What does the carrier rely on for stowage?", "options": [{"text": "The VGM — the booking weight is only an estimate", "correct": true}, {"text": "The booking weight, until the B/L has been issued"}, {"text": "The average of both weights, as a safety margin"}, {"text": "The gross weight shown on the commercial invoice"}], "explain": "Stowage uses the VGM; large gaps should still be queried for misdeclaration. [TO VERIFY:v01]"}, {"id": "q3", "q": "Seal number on the door ≠ seal number on the B/L after a customs inspection at origin. Correct handling?", "options": [{"text": "Record the customs seal and amend the documents and manifest as required", "correct": true}, {"text": "Ignore it: customs seals are always accepted without any document change"}, {"text": "Replace the customs seal with a new one bearing the original seal number"}, {"text": "Cancel the shipment and issue a new booking with the new seal number"}], "explain": "The new seal must be documented to avoid holds and claims at destination."}, {"id": "q4", "q": "Under FOB, the box is damaged in the export yard before loading. Who bears the risk?", "options": [{"text": "The seller — risk passes only once the box is on board", "correct": true}, {"text": "The buyer — because it booked and pays the ocean freight"}, {"text": "The carrier, always, as soon as the box is in the yard"}, {"text": "The terminal, always, while the box is in its custody"}], "explain": "This gap is why ICC recommends FCA for containers; carrier/terminal liability is a separate question. [TO VERIFY:v15]"}, {"id": "q5", "q": "A reefer alarm shows supply air +6 °C above set point mid-ocean on a frozen cargo. First step?", "options": [{"text": "Reefer team checks remote data, has the crew inspect and act; inform the customer", "correct": true}, {"text": "Wait until arrival, so as not to alarm the customer about a short-lived deviation"}, {"text": "Change the set point to +6 °C above, so the alarm stops and the log stays clean"}, {"text": "Switch the unit off and on again to reset it, then watch the next remote readings"}], "explain": "Early technical intervention and documentation protect the cargo and the claim position. [TO VERIFY:v57]"}, {"id": "q6", "q": "Original B/L 'to order' not yet received by the consignee; cargo is in demurrage. The consignee asks for release against an LOI. Carrier position?", "options": [{"text": "Release only under the carrier's LOI policy and approval — misdelivery risk is high", "correct": true}, {"text": "Release immediately against the LOI, since demurrage hurts everyone, the carrier too"}, {"text": "Release to the notify party, who is named on the B/L and can sign for the cargo"}, {"text": "Release as soon as the freight is paid, since the carrier then has no more risk"}], "explain": "Delivering without the original exposes the carrier to the lawful B/L holder. [TO VERIFY:v75]"}, {"id": "q7", "q": "General average is declared after an engine-room fire. What does the consignee need before delivery?", "options": [{"text": "To provide GA security (bond and guarantee, often via the cargo insurer)", "correct": true}, {"text": "Nothing, as long as the ocean freight was prepaid at origin by the shipper"}, {"text": "A new set of original B/Ls, issued after the general average declaration"}, {"text": "A new VGM, since the fire may have changed the weight of the cargo on board"}], "explain": "Uninsured cargo owners must pay security themselves — a key reason to insure. [TO VERIFY:v76]"}, {"id": "q8", "q": "A DG tank arrives at the terminal without the DG declaration matching the booking (UN number differs). Terminal action?", "options": [{"text": "Refuse or hold the box until the documents and DG approval match", "correct": true}, {"text": "Accept it and fix the papers later, before the vessel's arrival"}, {"text": "Stow it under deck to be safe, away from accommodation and heat"}, {"text": "Change the UN number on the booking to match the declaration"}], "explain": "Misdeclared DG is a major safety risk; segregation and approval depend on the exact UN number. [TO VERIFY:v59]"}, {"id": "q9", "q": "A customer disputes detention: the box was ready but the consignee had no delivery slot. Who decides?", "options": [{"text": "The tariff or contract terms: free time, clock events, agreed exceptions", "correct": true}, {"text": "The Incoterm in the sale contract, which allocates delays between parties"}, {"text": "The terminal, which records the gate times and owns the container clock"}, {"text": "Customs, since the box stayed under customs control during the whole time"}], "explain": "D&D is contractual; billing must follow the agreed events and rules. [TO VERIFY:v72]"}, {"id": "q10", "q": "Under CIF, the buyer finds the insurance excludes the loss that occurred. Why is this common?", "options": [{"text": "CIF only requires minimum cover (Institute Cargo Clauses C)", "correct": true}, {"text": "The insurance stops at the origin terminal, before loading"}, {"text": "The insurance is the carrier's job, not the seller's, under CIF"}, {"text": "CIF requires no insurance at all; only CIP requires a policy"}], "explain": "Buyers needing wider cover should ask for CIP (ICC A) or extra cover. [TO VERIFY:v18]"}]}, "footprint": {"title": "Cost & CO₂ — indicative", "kicker": "Indicative · November 2026", "date": "November 2026", "currency": "€", "tip": "Indicative cost and CO₂e of the journey so far — click for the details", "intro": "The two counters add up, step by step, what your container's journey costs and emits. The CO₂ counter moves as soon as a truck, a crane, a ship or a forklift does the work, not only at the end of the step. **Orders of magnitude only**: real prices depend on the contract, the date and the carrier.", "note": "Indicative, November 2026. Freight from public spot indices (Drewry WCI, Xeneta) converted at ≈ 0.86 € per US$ [TO VERIFY:v93]; terminal handling and fees from published tariffs; inland legs are estimates. **Not included:** duties and VAT, cargo insurance, demurrage & detention, peak-season or emergency surcharges. The seller / buyer split follows the Incoterm's cost transfer point (export clearance: {exportBy}; import clearance: {importBy}). Under C rules, destination THC is often billed to the buyer unless the freight contract includes it. **CO₂e** follows the GLEC Framework / ISO 14083 logic: transport legs = distance × default intensity factor (tonne-km on land, TEU-km at sea, a 40' counts as 2 TEU); hubs (stuffing, terminals, unstuffing) = GLEC hub default per tonne or per container; reefers add plug-in energy on land, prorated by days. Genset fuel on road legs and refrigerant leaks are not counted [TO VERIFY:v97].", "labels": {"pre": "Pre-carriage by {mode} (cargo + tare)", "on": "On-carriage by {mode} (cargo + tare)", "ret": "Empty return by truck (tare only)", "plugO": "Reefer plugged in at the export terminal", "plugD": "Reefer plugged in at the import terminal", "empty": "Empty box, depot → shipper by truck (tare only)", "stuff": "Stuffing at the shipper: forklifts, dock and warehouse (ISO 14083 hub)", "first": "Truck from the shipper to the {mode} terminal (first mile, cargo + tare)", "termO": "Origin terminal: gate, yard and quay crane (one value per container)", "hub": "Transshipment in {hub}: discharge, yard, reload (one value per container)", "termD": "Destination terminal: quay crane, yard and gate-out (one value per container)", "plug": "Reefer plugged in — {place} ({days} days)", "last": "Truck from the inland {mode} terminal to the consignee (last mile, cargo + tare)", "unstuff": "Unstuffing at the consignee: forklifts, dock and warehouse (ISO 14083 hub)"}, "factors": {"ship": {"kg": 0.0664, "unit": "TEU-km", "label": "Container ship, deep-sea, dry", "v": "v89", "short": "ship"}, "shipReefer": {"kg": 0.134, "unit": "TEU-km", "label": "Container ship, reefer", "v": "v89", "short": "reefer ship"}, "feeder": {"kg": 0.128, "unit": "TEU-km", "label": "Feeder ship, dry", "reeferX": 2, "v": "v90", "short": "feeder"}, "truck": {"kg": 0.073, "unit": "t-km", "label": "Articulated truck 34–40 t, container", "v": "v91", "short": "truck"}, "barge": {"kg": 0.016, "unit": "t-km", "label": "Inland container barge", "v": "v91", "short": "barge"}, "rail": {"kg": 0.011, "unit": "t-km", "label": "Electric rail, container", "v": "v91", "short": "rail"}, "reeferDay": {"kg": 40, "unit": "day", "label": "Reefer plugged in on land", "v": "v92", "short": "plug-in"}, "terminal": {"kg": 10.7, "unit": "container", "label": "Maritime container terminal, whole visit (GLEC default, ambient)", "short": "terminal", "v": "v94"}, "stuffing": {"kg": 1.3, "unit": "t", "label": "Transshipment-type logistics hub, ambient (stuffing / unstuffing)", "short": "hub", "v": "v95"}, "stuffingCold": {"kg": 2.5, "unit": "t", "label": "Transshipment-type logistics hub, mixed temperature (reefer cargo)", "short": "hub", "v": "v95"}}, "routes": {"SHA-LEH": {"preKm": 120, "onKm": 200, "returnKm": 200, "plugDays": 3, "sea": [{"kind": "ship", "km": 19500, "label": "Shanghai → Le Havre via Suez (≈ 19,500 km) [TO VERIFY:v88]", "split": [{"beat": "canal", "share": 0.693, "label": "Shanghai → Suez 5, "v": "v86"}, {"step": 5, "label": "Origin terminal handling (THC)", "route": {"SHA-LEH": {"20": 130, "40": 195}, "HCM-SIN-LEH": {"20": 130, "40": 195}, "GYE-ANR": {"20": 200, "40": 300}}, "reeferX": 1.5, "v": "v84"}, {"step": 7, "label": "Ocean freight incl. bunker surcharge (BAF)", "route": {"SHA-LEH": {"20": 1900, "40": 3000, "reefer": 3800}, "HCM-SIN-LEH": {"20": 1950, "40": 3100, "reefer": 3800}, "GYE-ANR": {"20": 1350, "40": 2100, "reefer": 4300}}, "v": {"SHA-LEH": "v78", "HCM-SIN-LEH": "v79", "GYE-ANR": "v80"}, "vReefer": "v81"}, {"step": 7, "label": "Out-of-gauge surcharge (lost slots, special stowage)", "eur": 1500, "when": {"family": "oog"}, "v": "v82"}, {"step": 7, "label": "Dangerous-goods surcharge (IMDG class 3)", "eur": 350, "when": {"family": "tank"}, "v": "v83"}, {"step": 8, "label": "Destination terminal handling (THC)", "route": {"SHA-LEH": 295, "HCM-SIN-LEH": 295, "GYE-ANR": {"20": 200, "40": 300}}, "reeferX": 1.5, "v": "v85"}, {"step": 9, "label": "Import customs clearance (broker fee; duties and VAT not included)", "eur": 105, "payer": "importBy", "v": "v86"}, {"step": 10, "label": "On-carriage to the consignee, incl. empty return", "route": {"SHA-LEH": 850, "HCM-SIN-LEH": 850, "GYE-ANR": 450}, "v": "v87"}], "calc": {"tkm": "{name} {km} km × {t} t × {f} kg/t-km", "teukm": "{name} {km} km × {teu} TEU × {f} kg/TEU-km", "hub": "{t} t handled × {f} kg/t", "terminal": "1 container × {f} kg/container", "plug": "{days} days × {f} kg/day"}, "ui": {"stepRow": "Step {n} · {title}", "stepKg": "+{kg} this step", "cumKg": "{kg} so far", "upcoming": "upcoming", "delta": "+{kg} CO₂e"}, "zero": {"4": {"title": "+0 kg — paperwork only", "text": "Shipping instructions, B/L draft and export declaration are data and documents: the box does not move in this step, so no CO₂e is added. A customs scan or physical inspection would add moves — not in this scenario."}, "5": {"title": "+0 kg here — counted at step 6", "text": "Gate-in and yard moves are part of the terminal's footprint. The GLEC default gives one value per container for the whole terminal visit (gate, yard and quay crane) and cannot be split, so it is counted once, at step 6. [TO VERIFY:v94]"}, "9": {"title": "+0 kg — paperwork only", "text": "Customs clearance, B/L surrender and the release order are paperwork: no CO₂e is added. A customs scan or physical inspection would add moves — not in this scenario. A reefer stays plugged in while it waits: that energy is counted."}}, "lines": [{"step": 1, "beat": "depart", "calc": "empty", "km": "depotKm", "label": "empty"}, {"step": 2, "beat": "stuff", "calc": "hub", "label": "stuff"}, {"step": 3, "beat": "travel", "calc": "first", "label": "first"}, {"step": 3, "beat": "travel", "calc": "pre", "label": "pre"}, {"step": 5, "beat": "yard", "calc": "plug", "place": "export terminal yard"}, {"step": 6, "beat": "load", "calc": "terminal", "label": "termO"}, {"step": 6, "beat": "load", "calc": "plug", "place": "export terminal, until loading"}, {"step": 7, "calc": "sea"}, {"step": 7, "beat": "hub", "calc": "terminal", "label": "hub", "when": {"transship": true}}, {"step": 7, "beat": "hub", "calc": "plug", "place": "hub yard, between the two ships", "when": {"transship": true}}, {"step": 8, "beat": "discharge", "calc": "terminal", "label": "termD"}, {"step": 8, "beat": "yard", "calc": "plug", "place": "import terminal yard"}, {"step": 9, "beat": "declare", "calc": "plug", "place": "import terminal, waiting for customs release"}, {"step": 10, "beat": "travel", "calc": "on", "label": "on"}, {"step": 10, "beat": "deliver", "calc": "last", "label": "last"}, {"step": 11, "beat": "unstuff", "calc": "hub", "label": "unstuff"}, {"step": 11, "beat": "return", "calc": "empty", "km": "returnKm", "label": "ret"}]}, "mapPlaces": {"SHA": {"name": "Shanghai (Yangshan)", "lat": 30.62, "lon": 122.07, "kind": "port", "label": "l"}, "CLI": {"name": "Cat Lai (Ho Chi Minh City)", "lat": 10.76, "lon": 106.79, "kind": "port", "label": "r"}, "SIN": {"name": "Singapore", "lat": 1.24, "lon": 103.78, "kind": "hub", "label": "b"}, "SGS": {"name": "Singapore Strait", "lat": 1.19, "lon": 104.1, "kind": "passage", "label": "r"}, "MAL": {"name": "Strait of Malacca", "lat": 3.0, "lon": 100.7, "kind": "passage", "label": "tl"}, "BAB": {"name": "Bab-el-Mandeb", "lat": 12.5, "lon": 43.3, "kind": "passage", "label": "bl"}, "SUEZ": {"name": "Suez Canal", "lat": 30.6, "lon": 32.33, "kind": "passage", "label": "r"}, "GIB": {"name": "Strait of Gibraltar", "lat": 35.95, "lon": -5.6, "kind": "passage", "label": "t"}, "CHN": {"name": "English Channel", "lat": 50.05, "lon": -1.6, "kind": "passage", "label": "tl"}, "LEH": {"name": "Le Havre", "lat": 49.47, "lon": 0.12, "kind": "port", "label": "r"}, "POS": {"name": "Posorja (Guayaquil)", "lat": -2.71, "lon": -80.25, "kind": "port", "label": "l"}, "PAN": {"name": "Panama Canal", "lat": 9.12, "lon": -79.72, "kind": "passage", "label": "r"}, "ANR": {"name": "Antwerp-Bruges", "lat": 51.28, "lon": 4.32, "kind": "port", "label": "r"}, "CGH": {"name": "Cape of Good Hope", "lat": -34.6, "lon": 18.35, "kind": "passage", "label": "r"}}, "mapSeas": [{"name": "PACIFIC OCEAN", "lat": 12, "lon": -110}, {"name": "PACIFIC OCEAN", "lat": 24, "lon": 140}, {"name": "ATLANTIC OCEAN", "lat": 30, "lon": -42}, {"name": "ATLANTIC OCEAN", "lat": -20, "lon": -20}, {"name": "INDIAN OCEAN", "lat": -12, "lon": 78}, {"name": "Arabian Sea", "lat": 17.5, "lon": 63.0}, {"name": "Bay of Bengal", "lat": 13.0, "lon": 89.6}, {"name": "South China Sea", "lat": 15.5, "lon": 115.0}, {"name": "Red Sea", "lat": 21.6, "lon": 37.2, "rot": 58}, {"name": "Mediterranean Sea", "lat": 34.4, "lon": 18}, {"name": "Caribbean Sea", "lat": 15, "lon": -75}, {"name": "North Sea", "lat": 56, "lon": 3.5}, {"name": "Bay of Biscay", "lat": 45.4, "lon": -5.5}, {"name": "East China Sea", "lat": 25.0, "lon": 127.5}], "steps": [{"id": 1, "short": "Booking", "title": "Booking & empty release", "scene": "depot", "sceneDesc": "A booking request travels from the shipper to the carrier and a confirmation comes back. In an empty-container depot, a truck drives in, an empty container is lowered onto it, inspected at the gate and driven out.", "beats": [{"id": "book", "ms": 1800, "narration": {"1": "Before I travel, someone must reserve space for me on a ship: that's the [[booking]]. The [[shipper]] — or a [[freight-forwarder]] — asks the carrier for one {box}, from {pol} to {pod}.", "2": "It starts with a [[booking]] request: equipment type and quantity, {pol} → {pod}, commodity ({cargo}), estimated weight, preferred sailing and the contract or quote behind the rate. [TO VERIFY:v30]", "3": "Booking request via portal, platform or EDI against a service contract or spot quote. Special cargo — reefer, DG, OOG — needs approval before confirmation. [TO VERIFY:v30]"}, "caption": {"2": "Under {incoterm}, the {freightBy} side contracts the ocean freight with the carrier."}}, {"id": "confirm", "ms": 1800, "narration": {"1": "The carrier checks there is space and an empty box nearby, then sends a [[booking-confirmation]]. It's my travel plan: ship, places and deadlines.", "2": "Customer service validates allocation, equipment and approvals, then issues the [[booking-confirmation]]. Open it: every line drives a later step.", "3": "Confirmation against allocation and equipment availability. Watch the fine print: cut-offs, free time, pick-up and return locations, special-cargo approvals."}, "caption": {"2": "Carriers may accept slightly more bookings than slots to offset no-shows. [TO VERIFY:v31]"}}, {"id": "release", "ms": 3600, "narration": {"1": "A truck collects me at the [[depot]], a yard full of empty containers. A lifting machine puts me on the truck.", "2": "The haulier presents the [[release-order|release reference]]. [[equipment-control|Equipment control]] allocated the type and, if needed, a grade (food quality, {family}).", "3": "Empty release against the reference; grade and condition must match the commodity. Reefers need a passed [[pti]], tanks a cleanliness check, OOG equipment the right fittings. [TO VERIFY:v57]"}, "caption": {"2": {"_by": "family", "reefer": "Reefer: [[pti]] passed, [[set-point]] {setPoint} programmed before release. [TO VERIFY:v56]", "tank": "Tank: last cargo and cleaning checked — tanks are usually supplied by tank operators. [TO VERIFY:v59]", "oog": "Special equipment is scarce: the depot may need time to supply it. [TO VERIFY:v58]", "*": "Wrong box for the cargo (dirty, damaged) = refused at stuffing and a second truck trip."}}}, {"id": "gateout", "ms": 1600, "narration": {"1": "At the gate, someone checks me all around and writes down my condition on an [[eir]]. From now on, my [[detention]] clock is ticking.", "2": "Gate-out inspection recorded on the [[eir]], often digital with photos. The export [[detention]] clock runs until full gate-in at the terminal. [TO VERIFY:v21]", "3": "EIR at gate-out, movement reported to the carrier (EDI CODECO). Export detention clock starts per tariff. [TO VERIFY:v36] [TO VERIFY:v21]"}}, {"id": "incident", "levels": [3], "kind": "incident", "narration": {"3": "Two days before the cut-off, capacity management cuts the allocation on {vessel}: your customer's box is on the list of bookings to roll to next week's sailing. The customer's letter of credit requires shipment by this week."}}], "fact": {"beat": "release", "text": {"1": "Asia ships far more goods to Europe than it receives, so many containers go back to Asia empty — at the carrier's cost. [TO VERIFY:v38]", "2": "Empty boxes are estimated at around 20% of all container handling in ports — the price of trade imbalances. [TO VERIFY:v38]"}}, "hotspots": [{"id": "booker", "beat": "book", "until": "confirm", "x": 413, "y": 128, "label": "Shipper / forwarder", "kind": "Stakeholder", "essential": [1], "body": {"1": "The exporter or its forwarder makes the booking. Under {incoterm}, the ocean freight is arranged by the {freightBy}; when that's the buyer, its forwarder near {pol} usually books for it.", "2": "The booking party is not always the B/L shipper. A forwarder acting as [[nvocc]] books in its own name and issues its own house B/L. [TO VERIFY:v34]"}}, {"id": "desk", "beat": "book", "until": "confirm", "x": 590, "y": 128, "label": "Booking desk", "kind": "Stakeholder", "body": {"1": "The carrier's customer service checks space and equipment, then confirms. Many bookings are made online.", "2": "Checks: allocation by trade and customer, equipment at the depot, rate validity, special approvals (DG desk, reefer, OOG). [TO VERIFY:v30]"}}, {"id": "rate", "beat": "confirm", "x": 760, "y": 40, "label": "Freight rate", "kind": "Charge", "body": {"1": "The price of the trip: ocean freight plus surcharges such as [[baf]] (fuel) and port handling ([[thc]]).", "2": "All-in, or base rate + surcharges (BAF, peak season, origin/destination THC, documentation fee). Names and structures vary by carrier. [TO VERIFY:v35]"}}, {"id": "bc", "beat": "confirm", "x": 520, "y": 160, "label": {"1": "Booking confirmation", "2": "Booking confirmation"}, "kind": "Document", "essential": [2, 3], "doc": {"2": "bc", "3": "bc"}, "levels": [2, 3]}, {"id": "depot", "beat": "release", "x": 140, "y": 72, "label": "Empty depot", "kind": "Stakeholder", "essential": [1], "body": {"1": "A yard where empty containers wait between trips. They are inspected, cleaned and repaired there.", "2": "Often run by a third party under contract: storage, maintenance and repair ([[mnr]]), cleaning, reefer PTI. Gate movements are reported electronically. [TO VERIFY:v36]"}}, {"id": "handler", "beat": "release", "x": 200, "y": 250, "label": "Empty handler", "kind": "Equipment", "body": {"1": "A forklift-like machine built to lift and stack light, empty containers.", "2": "Designed for empty boxes only; full boxes need reach stackers or yard cranes. [TO VERIFY:v37]"}}, {"id": "special", "beat": "release", "until": "release", "x": 555, "y": 205, "when": {"family": ["reefer", "tank", "oog"]}, "label": {"_by": "family", "reefer": "PTI & set point", "tank": "Tank check", "oog": "Special equipment"}, "kind": "Equipment", "body": {"_by": "family", "reefer": {"1": "Before a reefer leaves the depot, its cooling machine is tested ([[pti]]) and set to the temperature the shipper asked for: {setPoint} for {cargo}.", "2": "PTI passed and [[set-point]] {setPoint} programmed; ventilation and humidity settings per booking. A wrong set point is a classic cause of cargo claims. [TO VERIFY:v56] [TO VERIFY:v57]"}, "tank": {"1": "Tanks carry liquids, often dangerous. The tank must be clean and suitable for {cargo}.", "2": "Tank containers are usually supplied by tank operators; the last cargo and cleaning certificate must be compatible with the new product. DG approval is required at booking. [TO VERIFY:v59]"}, "oog": {"1": "{box} boxes are rarer than standard ones, so they must be ordered early.", "2": "OOG bookings need the exact dimensions and weight, and approval by the special-cargo desk and vessel planners before confirmation. [TO VERIFY:v58]"}}}, {"id": "eir", "beat": "gateout", "x": 586, "y": 160, "label": "EIR", "kind": "Document", "body": {"1": "Equipment Interchange Receipt: a short report on my condition each time I change hands — dents, holes, cleanliness.", "2": "Signed or digitally confirmed by driver and depot, often with photos. Damage found later without an EIR record can be charged to the merchant."}}, {"id": "clock", "beat": "gateout", "x": 782, "y": 128, "label": "Detention clock", "kind": "Charge", "essential": [2, 3], "body": {"1": "The container belongs to the carrier. After the free days, every extra day outside costs money: that's [[detention]].", "2": "Export detention typically runs from empty gate-out to full gate-in (merchant haulage). Illustrative free time: {freeDays} days, then {cur}80 per day. [TO VERIFY:v21] [TO VERIFY:v12]", "3": "Collect the empty too early and free time burns before the cut-off. Some carriers combine demurrage and detention into one free-time pool. [TO VERIFY:v21]"}}], "docs": {"bc": {"title": "Booking confirmation", "heading": "BOOKING CONFIRMATION", "sub": "Fictional example", "stamp": "CONFIRMED", "rows": [{"label": "Booking no.", "value": "{bookingNo}"}, {"label": "Routing", "value": "{pol} → {pod}"}, {"label": "Vessel / voyage", "value": "{vessel} / {voyage}"}, {"label": "Equipment", "value": "1 × {box} ({boxCode}) · {cargo}", "zone": 1}, {"label": "Special", "value": {"_by": "family", "reefer": "Set point {setPoint} · vents per booking", "tank": "DG approved · {cargo}", "oog": "OOG approved · dimensions on file", "*": "—"}}, {"label": "Empty pick-up", "value": "Depot near {pol} · release R-58214"}, {"label": "Full return to", "value": "{polTerminal}"}, {"label": "Cut-offs", "value": "SI {siCutoff} · VGM {vgmCutoff} · Port {cyCutoff}", "zone": 2}, {"label": "Free time", "value": "{freeDays} days detention (illustrative)", "zone": 3}, {"label": "Freight terms", "value": "Freight {freightTerms}"}], "points": {"1": {"2": "Size-type code per ISO 6346 ({boxCode}). Substituting equipment needs the customer's agreement. [TO VERIFY:v32]", "3": "Equipment and commodity drive approvals: a change of commodity after confirmation (e.g. to DG) requires a new approval."}, "2": {"2": "Documentation (SI), VGM and port (CY) cut-offs. Order and timing vary by carrier and port. [TO VERIFY:v20]"}, "3": {"2": "From the tariff or the customer's contract. Illustrative value from CONFIG. [TO VERIFY:v12]"}}, "check": {"2": {"prompt": "Which deadline comes first in this booking?", "options": [{"id": "a", "correct": true, "text": "The documentation (SI) cut-off — {siCutoff}"}, {"id": "b", "text": "The port (CY) container cut-off — {cyCutoff}", "fb": "The full box can arrive last; paperwork closes earlier."}, {"id": "c", "text": "The VGM submission cut-off — {vgmCutoff}", "fb": "Here the VGM closes after the SI."}, {"id": "d", "text": "The vessel's scheduled departure (ETD) — {etd}", "fb": "ETD comes after every cut-off."}], "explain": "Here the SI closes first, then the VGM, then the port cut-off. Sequences vary by carrier and port — always read the confirmation. [TO VERIFY:v20]"}, "3": {"prompt": "Empty picked up Day 1, full gate-in at {polTerminal} Day 5, free time {freeDays} days (export detention). What is billed?", "options": [{"id": "a", "correct": true, "text": "Nothing — the box was back within the free time"}, {"id": "b", "text": "4 days of detention, counted from Day 1 to Day 5", "fb": "Days are charged only beyond the free time."}, {"id": "c", "text": "5 days of demurrage at the export terminal yard", "fb": "Demurrage covers time inside the terminal, not this period."}, {"id": "d", "text": "It depends on the Incoterm agreed in the sale contract", "fb": "Billing follows the tariff or contract; the Incoterm only shapes who should bear it between seller and buyer."}], "explain": "Detention runs gate-out to gate-in per tariff; 4 days < {freeDays} free days. Who ultimately bears D&D between seller and buyer is a sales-contract question. [TO VERIFY:v21]"}}}}, "dossier": {"documents": ["**Booking request / confirmation** — portal or EDI (IFTMBF/IFTMBC). [TO VERIFY:v30]", "**Release reference / PIN** — sometimes time-limited.", "**EIR** at gate-out — the box's condition on record.", "**Rate agreement** — service contract or quote reference."], "costs": ["**Ocean freight + surcharges** (BAF, THC…), fixed by contract or quote. [TO VERIFY:v35]", "**Cancellation / no-show fees** at some carriers. [TO VERIFY:v31]", "**Export detention** from empty gate-out. [TO VERIFY:v21]", "**Damage / cleaning recharges** if the return EIR shows new damage."], "risks": ["**Rolled** after overbooking or a [[blank-sailing]]: inform the customer early. [TO VERIFY:v31]", "**Wrong equipment grade** → rejected at stuffing, extra trucking.", "**Empty collected too early** → free time burnt before the cut-off.", {"text": "**No special approval** for reefer/DG/OOG → booking cannot be confirmed. [TO VERIFY:v58]", "levels": [3]}], "jobs": ["**Sales & pricing** — contracts, quotes, surcharges.", "**Capacity / allocation management** — who gets space on which vessel.", "**Customer service** — validation, confirmation, changes.", "**Equipment control** — release, repositioning, depot vendors; **DG / special cargo desk** — approvals."]}, "incoNote": {"_by": "group", "E": "The buyer (or its forwarder near {pol}) books and collects the empty.", "F": "The buyer books the freight, so it must pass the booking details to the seller in time.", "C": "The seller books and pays the freight to {pod}.", "D": "The seller books the whole carriage to the buyer's door."}, "keyPoints": {"1": ["Every journey starts with a booking; the booking confirmation sets ship, places and deadlines.", "The party paying the ocean freight under the Incoterm makes the booking.", "Empty containers come from depots; their condition is recorded on an EIR and the detention clock starts at gate-out."], "2": ["Booking → validation (allocation, equipment, approvals) → confirmation with cut-offs.", "Who books follows the Incoterm and the contract of carriage; NVOCCs book in their own name.", "Equipment control releases the right type and grade; reefers need PTI and the right set point.", "Export detention starts at gate-out, per tariff."], "3": ["Read the confirmation like a contract: cut-off sequence, free time, pick-up/return locations, approvals.", "Rollings must be communicated at once — never 'fix' a deadline by misdating a B/L.", "Special cargo (reefer, DG, OOG) is approved before confirmation, not after."]}, "question": {"1": {"prompt": "I'm an empty container on a truck, just out of the depot. What happens next?", "hint": "I'm empty. Where are the goods waiting?", "options": [{"id": "a", "correct": true, "text": "The truck takes me to the seller's warehouse, where the goods are put inside me.", "confirm": "Exactly. The goods are waiting at the shipper's premises, so I go there to be filled ('stuffed'). Under {incoterm}, this trip is arranged by {preBy}."}, {"id": "b", "text": "The truck takes me straight to the port, and I'm loaded onto the ship still empty.", "why": "I'm still empty! The goods are at the shipper's warehouse.", "realLife": "An empty box at the export terminal would be refused, and the shipper would pay for an extra trip.", "whenRight": "Carriers do move empties to ports to reposition them — but that's their own move, not a customer's booking."}, {"id": "c", "text": "I stay at the depot, and the seller brings the goods here in small vans, one by one.", "why": "Depots only handle empty containers. For a full container load ([[fcl]]), the shipper loads its own goods.", "realLife": "The depot has no goods and no staff to load them: the truck would wait for nothing.", "whenRight": "Small shipments ([[lcl]]) are consolidated at a [[cfs]] — a different service and place."}]}, "2": {"prompt": "Booking confirmed, empty {box} gated out with a clean EIR. What happens next?", "options": [{"id": "a", "correct": true, "text": "The haulier positions the empty at the shipper's premises for stuffing, within the free time.", "confirm": "Correct. FCL cargo is stuffed at origin by the shipper. Too early burns detention free time; too late puts the VGM and port cut-offs at risk. Under {incoterm}, this leg is for {preBy}."}, {"id": "b", "text": "The haulier delivers the empty to the export terminal, where the cargo is stuffed before loading.", "why": "Export terminals receive full containers for loading, not empties for stuffing.", "realLife": "Refused or charged for handling and storage; a second truck move puts the cut-offs at risk.", "whenRight": "For [[lcl]] or port-side services, cargo is stuffed at a [[cfs]] near the port — another booking and service."}, {"id": "c", "text": "The shipper submits the SI and asks the carrier to issue the original B/L against the booking.", "why": "A B/L needs actual cargo details (seal, packages, weights) and the carrier must have taken charge of the goods — the box is still empty.", "realLife": "A B/L issued before receiving the goods certifies something untrue: fraud exposure and L/C problems.", "whenRight": "Early SI submission is fine once data is final; the B/L comes after receipt or loading."}, {"id": "d", "text": "The depot weighs the empty container so that the shipper can declare the VGM to the carrier.", "why": "The [[tare]] is marked on the door and the [[csc-plate]]. The VGM is the packed container's weight — after stuffing.", "realLife": "A 'VGM' declared before stuffing is not verified: misdeclaration and unsafe stowage. [TO VERIFY:v02]", "whenRight": "Method 2 uses the marked tare plus weighed contents — no depot weighing needed."}]}, "3": {"prompt": "Case: allocation is cut and the booking is on the roll list. The customer's L/C requires shipment this week. What should you do first?", "options": [{"id": "a", "correct": true, "text": "Tell the customer now and offer options: another service this week, or time to amend the L/C.", "confirm": "Right. Early, documented communication with alternatives is the professional standard; the shipper can then act with its bank. Never adjust a B/L date to fit the L/C. [TO VERIFY:v31]"}, {"id": "b", "text": "Keep the booking quietly and issue the B/L with this week's vessel and date, as the L/C requires.", "why": "A B/L must reflect the vessel and date the goods were actually shipped on.", "realLife": "Misdated or false B/Ls are fraud: the carrier loses its defences and may face L/C fraud claims.", "whenRight": "Never."}, {"id": "c", "text": "Wait for the final load list before telling the customer, to avoid worrying them for nothing.", "why": "Waiting removes the customer's options (other service, L/C amendment).", "realLife": "The customer discovers the rolling at the last minute: missed L/C, penalties, lost account.", "whenRight": "Only if the roll list is still provisional — and even then, a heads-up is better."}, {"id": "d", "text": "Cancel the booking, refund the customer and suggest they look for space with another carrier.", "why": "Cancelling doesn't ship the goods; the customer needs a solution, not a refund.", "realLife": "The customer must rebook at a possibly higher spot rate and still misses the L/C date.", "whenRight": "If the customer chooses to cancel after being offered alternatives."}]}}}, {"id": 2, "short": "Stuffing & VGM", "title": "Stuffing, sealing & VGM", "scene": "warehouse", "sceneDesc": "Side view of the shipper's premises. A truck brings the container to the loading dock; the cargo is loaded, the container is sealed and the truck is weighed on a weighbridge.", "beats": [{"id": "arrive", "levels": [2, 3], "ms": 2300, "narration": {"2": "Empty {box} at {origin} for a [[live-load]]. My export [[detention]] clock has been running since depot gate-out. [TO VERIFY:v21]", "3": "Live load at the shipper's dock; carrier-haulage free loading time is typically a few hours, then waiting time is charged. [TO VERIFY:v12]"}, "caption": {"2": "Who hired this truck depends on [[merchant-haulage]] vs [[carrier-haulage]]."}}, {"id": "stuff", "ms": 2700, "narration": {"1": {"_by": "family", "tank": "Here I am at the shipper's site, clean and checked. A hose fills my tank with {cargo}.", "oog": "Here I am at the shipper's site. A crane lowers {cargo} into place — it's too big for a normal box.", "*": "Here I am at the [[shipper]]'s warehouse. The team loads {cargo} into me — that's [[stuffing]] — spreading the weight evenly."}, "2": {"_by": "family", "reefer": "[[stuffing|Stuffing]] of pre-cooled {cargo}: the cargo, not the box, must already be at temperature — a reefer keeps temperature, it doesn't cool warm cargo fast. [TO VERIFY:v56]", "tank": "Filling {cargo} by hose. Tanks must not be over- or under-filled: a minimum and maximum filling level applies to limit surge and expansion. [TO VERIFY:v59]", "oog": "Crane loading of {cargo}, then lashing to the lashing points per the [[ctu-code]]. Dimensions beyond the box make it [[oog]]. [TO VERIFY:v58]", "*": "[[stuffing|Stuffing]] per the [[ctu-code]]: weight spread along my length, voids filled with [[dunnage]], cargo secured. The carrier never sees inside."}, "3": {"_by": "family", "reefer": "Pre-cooled cargo, air flow kept clear (no cargo above the red load line, T-floor uncovered). Stuffing at ambient temperature: unit off or doors closed fast to avoid condensation. [TO VERIFY:v56]", "tank": "Filling ratio within IMDG limits; product compatibility with tank and gaskets checked; placards on all four sides. [TO VERIFY:v59]", "oog": "Lashing calculated for sea forces; overheight/overwidth measured and declared exactly — they drive slot loss and freight. [TO VERIFY:v58]", "*": "CTU Code: centre of gravity within limits, no voids, blocking and bracing. SLAC wording protects the carrier — the shipper owns packing quality. [TO VERIFY:v08]"}}, "caption": {"2": "The carrier never sees inside me — hence the [[slac]] clause on the B/L."}}, {"id": "seal", "ms": 1500, "narration": {"1": {"_by": "container", "40FR": "I have no doors, so no seal: instead, the lashing is checked and photographed before I leave.", "*": "Doors closed: a numbered [[seal]] goes on my door. If anyone opens me on the way, the broken seal will show it."}, "2": {"_by": "container", "40FR": "Flat racks can't be sealed. The lashing is checked, photographed and documented instead. [TO VERIFY:v58]", "*": "High-security bolt [[seal]] applied ([[iso-17712]] class H). [TO VERIFY:v07] Open the seal record: its number must flow into the next documents."}, "3": {"_by": "container", "40FR": "No seal: pre-shipment survey and photos are the evidence for any later claim.", "*": "Seal number door → SI → B/L → manifest. Customs may cut it and apply their own: the new number must be recorded. [TO VERIFY:v07]"}}, "caption": {"2": {"_by": "family", "tank": "DG: [[placard|placards]] on all four sides, DG declaration from the shipper. [TO VERIFY:v25]", "*": "A seal mismatch is a classic trigger for a customs inspection."}}}, {"id": "vgm", "ms": 2200, "fx": "weigh", "narration": {"1": "Before any ship takes me, the carrier needs my [[vgm]]: my total weight, cargo included. No VGM, no loading — it's a worldwide safety rule.", "2": "Under [[solas]] Ch. VI Reg. 2 the B/L shipper must submit my [[vgm]] before the VGM [[cut-off]]. [TO VERIFY:v01] Open the declaration to see how {vgm} kg was established.", "3": "VGM: Method 1 (weigh packed box) or Method 2 (certified sum + tare). Estimates are prohibited; the signatory must be authorised by the shipper. [TO VERIFY:v02] [TO VERIFY:v17]"}, "caption": {"2": "Who owes it? {vgmBy}."}}, {"id": "incident", "levels": [3], "kind": "incident", "narration": {"3": "The VGM arrives 3.5 t above the booking estimate, 2 hours before the VGM cut-off. The customer asks you to 'just use the booking weight' because their weighbridge ticket is 'probably wrong'."}}], "fact": {"beat": "vgm", "text": {"1": "Since 1 July 2016, no packed export container may be loaded on a ship without a verified weight. [TO VERIFY:v01]", "2": "After the MSC Napoli was beached in 2007, about 20% of 660 boxes checked were more than 3 t off their declared weight. [TO VERIFY:v09]"}}, "hotspots": [{"id": "shipper", "beat": "arrive", "x": 150, "y": 236, "label": "Shipper", "kind": "Stakeholder", "body": {"1": "The company sending the goods — here, {origin}. It packs the container itself.", "2": "In the SOLAS sense, the shipper is the party named as shipper on the B/L — not necessarily the factory. Under {incoterm}: {vgmBy}. [TO VERIFY:v03]"}}, {"id": "haulier", "beat": "arrive", "levels": [2, 3], "x": 852, "y": 228, "label": "Truck & driver", "kind": "Stakeholder", "body": {"2": "Merchant haulage: the shipper or forwarder hires the haulier. Carrier haulage: the carrier arranges and invoices it, with free loading time then waiting-time charges. [TO VERIFY:v12]"}}, {"id": "cargo", "beat": "stuff", "x": 560, "y": 262, "label": {"1": "The goods", "2": "Cargo"}, "kind": "Cargo", "body": {"_by": "family", "reefer": {"1": "{cargo}, kept at {setPoint}. The cold chain must never break.", "2": "Set point {setPoint}. Cargo must be pre-cooled; reefers maintain temperature but have limited pull-down capacity. [TO VERIFY:v56]"}, "tank": {"1": "{cargo}. Dangerous goods follow strict international rules.", "2": "Class 3 flammable liquid: IMDG declaration, placards, segregation, emergency information. [TO VERIFY:v59]"}, "oog": {"1": "{cargo}: too big or too heavy for a normal container.", "2": "Exact dimensions, weight and centre of gravity must be declared; overheight costs slots on board. [TO VERIFY:v58]"}, "*": {"1": "{cargo}. Good packing protects them during more than a month at sea.", "2": "Watch for condensation ('container rain'): desiccants and dry pallets help. Wooden pallets must usually meet [[ispm15]]. [TO VERIFY:v24]"}}}, {"id": "dist", "beat": "stuff", "until": "stuff", "levels": [2, 3], "x": 720, "y": 140, "label": "Load centre", "kind": "Rule", "body": {"2": "The [[ctu-code]] gives guidance on load distribution: a heavy end is dangerous to lift and to drive. [TO VERIFY:v08]"}}, {"id": "seal", "beat": "seal", "x": 300, "y": 262, "essential": [1, 2, 3], "when": {"container": ["20DV", "40DV", "40HC", "40RF", "40OT", "20TK"]}, "label": {"1": "Seal", "2": "Seal record"}, "kind": "Document / equipment", "doc": {"2": "seal", "3": "seal"}, "body": {"1": "A single-use, numbered lock that can only be removed by cutting it. Its number goes into the shipping documents: a broken or different seal shows that someone opened me."}}, {"id": "lashing", "beat": "seal", "x": 560, "y": 230, "essential": [1, 2, 3], "when": {"container": ["40FR"]}, "label": "Lashing check", "kind": "Safety", "body": {"1": "A flat rack has no doors to seal. The chains and straps holding the cargo are checked and photographed instead.", "2": "Lashing must withstand sea forces (rolling, pitching). Photos and a survey report are the evidence if a claim arises. [TO VERIFY:v58]"}}, {"id": "dg", "beat": "seal", "x": 700, "y": 200, "when": {"family": ["tank"]}, "label": "DG labels", "kind": "Rule", "body": {"1": "The orange-red diamond tells everyone the tank holds a flammable liquid (class 3).", "2": "[[placard|Placards]] on all sides, UN number displayed, DG declaration and container packing certificate from the shipper. [TO VERIFY:v25] [TO VERIFY:v59]"}}, {"id": "vgm", "beat": "vgm", "x": 345, "y": 124, "essential": [1, 2, 3], "label": {"1": "VGM (total weight)", "2": "VGM declaration"}, "kind": "Document", "doc": {"2": "vgm", "3": "vgm"}, "visual": "vgm", "body": {"1": "VGM = my own empty weight ([[tare]]) + everything inside me. It must reach the carrier before the VGM deadline, or I stay on the quay."}}, {"id": "markings", "beat": "vgm", "x": 520, "y": 312, "label": "Door markings", "kind": "Equipment", "body": {"1": "My maximum weight ({mgm} kg) and my empty weight ({tare} kg) are painted on my door. [TO VERIFY:v53]", "2": "MGM, tare and payload, plus the [[csc-plate]]. Use the actual markings of the unit, not a typical value. [TO VERIFY:v05]"}}, {"id": "weighbridge", "beat": "vgm", "x": 900, "y": 392, "label": "Weighbridge", "kind": "Equipment", "body": {"1": "A giant scale for trucks: weigh the loaded truck, then subtract the truck's own weight.", "2": "Certified and calibrated per national rules (Method 1). Road limits apply too, e.g. 44 t gross for a 5-axle combination in France. [TO VERIFY:v02] [TO VERIFY:v13]"}}], "docs": {"seal": {"title": "Seal record", "heading": "CONTAINER SEAL RECORD", "sub": "Fictional example", "stamp": "SHIPPER COPY", "rows": [{"label": "Booking no.", "value": "{bookingNo}"}, {"label": "Container no.", "value": "{containerNo}", "zone": 1}, {"label": "Seal number", "value": "{sealNo}", "zone": 2}, {"label": "Seal type", "value": {"_by": "family", "tank": "Valve and manlid seals · ISO 17712", "*": "Bolt seal · ISO 17712 class H"}, "zone": 3}, {"label": "Applied by", "value": "Shipper, at stuffing (fictional)"}, {"label": "Date / time", "value": "Day 2, 15:40"}], "points": {"1": "Owner code + serial + check digit (ISO 6346). It identifies me on every document and gate message. [TO VERIFY:v32]", "2": "Must be identical on the door, in the [[si]] and on the [[bl]]. If customs cuts it and applies its own, the new number must be recorded.", "3": "Class H high-security seal per [[iso-17712]] — the usual standard for international shipments. [TO VERIFY:v07]"}, "check": {"2": {"prompt": "Where must this seal number appear next?", "options": [{"id": "a", "correct": true, "text": "In the shipping instructions (SI), then on the B/L"}, {"id": "b", "text": "Only on the truck driver's delivery note at the gate", "fb": "The road note is not where the carrier and customs look."}, {"id": "c", "text": "On the VGM declaration, which replaces the B/L field", "fb": "The VGM is about weight; the seal belongs in the SI and B/L."}, {"id": "d", "text": "Nowhere: the physical seal itself is the only proof", "fb": "A seal proves nothing unless its number is recorded and compared."}], "explain": "Door → SI → B/L → manifest. Terminals and customs compare the door with the documents; a mismatch triggers checks and L/C discrepancies."}, "3": {"prompt": "Origin customs inspects the box after stuffing and applies their seal CU-0099. The SI already shows {sealNo}. What is correct?", "options": [{"id": "a", "correct": true, "text": "Update the SI/B/L draft and manifest data with the new seal before issuance"}, {"id": "b", "text": "Keep {sealNo} on all documents: the shipper's seal is the contractual one", "fb": "The door now carries CU-0099; documents must match the door."}, {"id": "c", "text": "Ask the terminal to replace CU-0099 with a new seal bearing {sealNo}", "fb": "Nobody may re-seal with a fake number."}, {"id": "d", "text": "Change nothing: customs seals are never checked against the B/L at destination", "fb": "Destination customs and the consignee check the seal against the documents."}], "explain": "Seal changes must be documented; otherwise the box risks a hold at destination and the carrier's position in a shortage claim is weakened."}}}, "vgm": {"title": "VGM declaration", "heading": "VERIFIED GROSS MASS DECLARATION", "sub": "SOLAS Ch. VI Reg. 2 · fictional example", "stamp": "SUBMITTED", "rows": [{"label": "Booking no.", "value": "{bookingNo}"}, {"label": "Container no.", "value": "{containerNo}"}, {"label": "Method", "value": "Method 1 — packed container weighed on a certified weighbridge", "zone": 1}, {"label": "VGM", "value": "{vgm} kg  ({wbGross} − 15,750 tractor & chassis)", "zone": 2}, {"label": "Shipper (per B/L)", "value": "Shipper of record (fictional)"}, {"label": "Authorised person", "value": "<span class=\"sig\">Li Wei<\/span>  · Day 2, 16:20", "zone": 3, "html": true}], "points": {"1": "Method 1 weighs the packed container; Method 2 adds certified weights of all contents to the tare. Estimates are never allowed. [TO VERIFY:v02]", "2": "{vgm} kg = cargo and packaging {cargoKg} kg + tare {tare} kg. Both methods must give the same result. (Illustrative figures.)", "3": "Signed by a person duly authorised by the B/L shipper, sent before the VGM cut-off by portal, [[edi]] (VERMAS) or platform. [TO VERIFY:v17] [TO VERIFY:v16]"}, "check": {"2": {"prompt": "Which weights does the VGM include?", "options": [{"id": "a", "correct": true, "text": "Cargo, packaging, pallets, dunnage and the container's tare"}, {"id": "b", "text": "The cargo and its packaging only, as on the packing list", "fb": "That's closer to the B/L gross weight — it excludes the tare."}, {"id": "c", "text": "Cargo, packaging, pallets and dunnage, but not the tare", "fb": "The crane lifts the container too: the tare is included."}, {"id": "d", "text": "The packed container plus the truck, chassis and fuel", "fb": "The truck is weighed, then subtracted (Method 1)."}], "explain": "The VGM is the packed container as it will be lifted: everything inside plus the tare. The B/L gross weight, by contrast, excludes the tare."}, "3": {"prompt": "The shipper uses Method 2. Which practice is NOT acceptable?", "options": [{"id": "a", "correct": true, "text": "Estimating dunnage and pallet weight from last month's average shipment"}, {"id": "b", "text": "Using the tare weight marked on the container's door for the box", "fb": "Method 2 explicitly uses the marked tare."}, {"id": "c", "text": "Weighing each package type on calibrated scales and adding them up", "fb": "That is Method 2 when the procedure is certified/approved."}, {"id": "d", "text": "Using manufacturer-sealed package weights clearly marked on the packages", "fb": "Accepted under the IMO guidelines for sealed packages, depending on national rules."}], "explain": "Method 2 requires actual (certified/approved) weights of all contents, including packing and securing material; estimates are not allowed. [TO VERIFY:v02]"}}}}, "dossier": {"documents": ["**Booking confirmation** — cut-offs for VGM, SI and port.", "**[[eir|EIR]]** from empty pick-up — the box's condition before stuffing.", "**Packing list** — the shipper's own document; it feeds the SI.", "**VGM declaration** — portal, EDI VERMAS or platform. [TO VERIFY:v16]", {"text": "**DG declaration + container packing certificate** — dangerous goods only. [TO VERIFY:v25]", "when": {"family": ["tank"]}}], "costs": ["**Detention** — export clock from empty gate-out to full gate-in. [TO VERIFY:v21]", "**Waiting time** — carrier haulage beyond the free loading time. [TO VERIFY:v12]", "**VGM fees** — some carriers charge for late, amended or manual VGM. [TO VERIFY:v12]", "**Weighing and seal fees** — where applicable. [TO VERIFY:v12]"], "risks": ["**Missed VGM cut-off** → shut out, rolled to the next sailing (+7 days on a weekly service).", "**Wrong VGM** → amendment fees; overweight boxes can be refused or break road limits. [TO VERIFY:v13]", "**Seal mismatch** → customs or terminal check and delay.", "**Poor stowage** → cargo claims, which the [[slac]] clause puts on the shipper."], "jobs": ["**Customer service** — cut-off reminders, missing-VGM chasing.", "**Documentation** — VGM reception, consistency with the SI.", "**Vessel planning** — needs VGMs to build a safe stowage plan.", "**Finance / D&D** — detention and waiting-time invoicing."]}, "incoNote": {"_by": "incoterm", "EXW": "Under EXW, the goods were delivered at the seller's door: loading is at the buyer's risk unless agreed otherwise, and the buyer's forwarder owes the VGM.", "*": "The B/L shipper owes the VGM — under {incoterm}: {vgmBy}."}, "keyPoints": {"1": ["Goods are loaded ('stuffed') at the shipper's premises — the carrier doesn't see inside.", "A numbered seal proves the container hasn't been opened.", "No VGM, no loading: the total weight must reach the carrier before the deadline."], "2": ["Stuffing follows the CTU Code; the SLAC clause reflects that the carrier relies on the shipper.", "The seal number flows door → SI → B/L; mismatches trigger inspections.", "SOLAS VGM: two methods, signed, before the VGM cut-off; missing VGM = shut-out.", "The Incoterm decides who is B/L shipper — and therefore who owes the VGM."], "3": ["The VGM is a legal declaration by the shipper; the carrier must not replace it with an estimate.", "Seal changes after inspections must be documented end to end.", "Reefer, DG and OOG stuffing have their own rules: pre-cooling, filling ratios, lashing."]}, "question": {"1": {"prompt": "I'm full, closed with a numbered seal, and my total weight is known. What happens next?", "hint": "Where am I right now — and what does the carrier need before a ship can take me?", "options": [{"id": "a", "correct": true, "text": "A truck takes me to the port, and my weight is sent to the shipping line in time.", "confirm": "Right. I travel to the port terminal (that's 'pre-carriage'), and the carrier must have my VGM before the cut-off. Under {incoterm}, this trip is paid by {preBy}."}, {"id": "b", "text": "A big crane lifts me straight from the warehouse onto the ship that is waiting.", "why": "I'm still at the warehouse, far from the sea. I first have to reach the port and enter the terminal.", "realLife": "A box without a VGM, or not on the loading list, stays on the quay and waits for the next ship — usually a week later.", "whenRight": "Never straight from a warehouse."}, {"id": "c", "text": "I go directly to the customer's door, without passing through any port.", "why": "I haven't left {pol} yet! Export customs, loading, the voyage and import customs all come first.", "realLife": "Customs on both sides must clear the goods, and the carrier only releases me to the right party.", "whenRight": "That's step 10 — near the end of the journey."}]}, "2": {"prompt": "Stuffed, sealed, VGM determined (Method 1). What happens next?", "options": [{"id": "a", "correct": true, "text": "Pre-carriage to the export terminal; VGM to the carrier before the VGM cut-off, SI before the SI cut-off.", "confirm": "Correct. The full box moves to the terminal before the port cut-off, while VGM and SI meet their own cut-offs — sequence and timings vary by carrier and port. [TO VERIFY:v20]"}, {"id": "b", "text": "The carrier issues the Bill of Lading at once, now that the seal number and the weights are known.", "why": "The B/L is drafted from the SI, not yet submitted — and a 'shipped on board' B/L needs the box to be loaded.", "realLife": "An early B/L certifies something untrue: claims, L/C discrepancies, amendment fees.", "whenRight": "A 'received for shipment' B/L can follow the carrier's receipt of the goods, on the basis of the SI."}, {"id": "c", "text": "The box is loaded on the first available vessel; the VGM can follow later, together with the cargo manifest.", "why": "SOLAS: a packed container without a VGM must not be loaded. [TO VERIFY:v01]", "realLife": "Shut-out: rolled to the next sailing, extra storage and detention.", "whenRi
